<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title></title>
  <style>
    :root {
      --rows: 2;
      --cols: 3;
      --gap: 14px;
      --card-radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #060810;
      color: #eef2ff;
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x;
    }

    /* ── Stage ── */
    .stage {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(77,166,255,0.07), transparent 55%),
        radial-gradient(ellipse at 50% 60%, rgba(240,80,128,0.04), transparent 50%),
        linear-gradient(180deg, #08081a 0%, #0a0c18 50%, #0c0e1a 100%);
    }

    /* Stars */
    .stars {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,0.9) 0 1px, transparent 1.2px),
        radial-gradient(circle at 28% 55%, rgba(255,255,255,0.6) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 44% 18%, rgba(255,255,255,0.8) 0 1px, transparent 1.3px),
        radial-gradient(circle at 58% 62%, rgba(255,255,255,0.7) 0 0.9px, transparent 1.2px),
        radial-gradient(circle at 72% 24%, rgba(255,255,255,0.75) 0 1px, transparent 1.3px),
        radial-gradient(circle at 85% 52%, rgba(255,255,255,0.65) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 15% 72%, rgba(255,255,255,0.7) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 92% 18%, rgba(255,255,255,0.8) 0 1px, transparent 1.2px),
        radial-gradient(circle at 38% 82%, rgba(255,255,255,0.55) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 65% 38%, rgba(255,255,255,0.7) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 8% 42%, rgba(255,255,255,0.75) 0 1px, transparent 1.2px),
        radial-gradient(circle at 48% 88%, rgba(255,255,255,0.55) 0 0.9px, transparent 1.1px);
      opacity: 0.75;
    }

    /* ── Carousel ── */
    .carousel-viewport {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.25, 0.7, 0.3, 1);
      will-change: transform;
    }

    .carousel-track.instant { transition: none; }

    .batch {
      flex: 0 0 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      align-items: center;
      justify-items: center;
    }

    /* Flight channel — middle row of the grid */
    .flight-channel {
      grid-column: 1 / -1;
      grid-row: 2;
      width: 100%;
      height: clamp(50px, 12vh, 90px);
      pointer-events: none;
    }

    /* ── Photo cards ── */
    .card {
      position: relative;
      width: min(29vw, 130px);
      aspect-ratio: 4 / 5;
      border-radius: var(--card-radius);
      background: linear-gradient(180deg, rgba(10,15,28,0.95), rgba(5,9,20,0.99));
      border: 1px solid rgba(200,220,255,0.15);
      box-shadow:
        0 12px 28px rgba(0,0,0,0.38),
        0 0 20px rgba(77,150,255,0.08);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.35s ease, opacity 0.35s ease;
      will-change: transform, opacity;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: linear-gradient(180deg, #11192a, #070d17);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card.loaded img { opacity: 1; }

    .card.sliding-out-top {
      animation: slideOutTop 0.55s cubic-bezier(0.4, 0, 0.6, 1) forwards;
    }
    .card.sliding-out-bottom {
      animation: slideOutBottom 0.55s cubic-bezier(0.4, 0, 0.6, 1) forwards;
    }
    .card.sliding-in-top {
      animation: slideInTop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    .card.sliding-in-bottom {
      animation: slideInBottom 0.55s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes slideOutTop {
      to { transform: translateY(calc(-100% - 40px)); opacity: 0; }
    }
    @keyframes slideOutBottom {
      to { transform: translateY(calc(100% + 40px)); opacity: 0; }
    }
    @keyframes slideInTop {
      from { transform: translateY(calc(-100% - 40px)); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideInBottom {
      from { transform: translateY(calc(100% + 40px)); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ── Plane ── */
    .plane-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
    }

    .plane-group {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      animation: planeJourney 12s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    .plane-group svg {
      display: block;
      width: min(24vw, 120px);
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(117,154,255,0.55)) drop-shadow(0 2px 6px rgba(255,255,255,0.25));
      animation: planeHover 0.8s ease-in-out infinite alternate;
    }

    @keyframes planeHover {
      from { transform: translateY(-4px) rotateX(2deg); }
      to   { transform: translateY(4px) rotateX(-3deg); }
    }

    .plane-group svg .plane-body {
      fill: url(#planeGrad);
      stroke: rgba(255,255,255,0.5);
      stroke-width: 0.7;
    }

    .plane-trail {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(180,210,255,0.25) 10%,
        rgba(220,240,255,0.65) 35%,
        rgba(200,225,255,0.5) 65%,
        transparent 100%);
      filter: blur(2.5px);
      z-index: 4;
      border-radius: 2px;
      animation: trailJourney 12s ease-in-out infinite;
      pointer-events: none;
    }

    /* Plane journey: enter → center → grow → pause → exit */
    @keyframes planeJourney {
      0%   { left: -20%; transform: translateY(-50%) scale(0.7); opacity: 0; }
      8%   { left: -20%; opacity: 1; }
      28%  { left: 40%; transform: translateY(-50%) scale(1.15); opacity: 1; }
      40%  { left: 42%; transform: translateY(-50%) scale(1.2); opacity: 1; }
      68%  { left: 42%; transform: translateY(-50%) scale(1.2); opacity: 1; }
      82%  { left: 65%; transform: translateY(-50%) scale(0.9); opacity: 0.8; }
      100% { left: 110%; transform: translateY(-50%) scale(0.55); opacity: 0; }
    }

    @keyframes trailJourney {
      0%   { left: -20%; width: 5%; opacity: 0; }
      6%   { opacity: 0.85; }
      28%  { left: 10%; width: 28%; opacity: 0.9; }
      40%  { left: 12%; width: 30%; opacity: 0.85; }
      68%  { left: 12%; width: 30%; opacity: 0.85; }
      82%  { left: 35%; width: 28%; opacity: 0.5; }
      100% { left: 80%; width: 15%; opacity: 0; }
    }

    /* ── Swipe hint ── */
    .swipe-indicator {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .swipe-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .swipe-dot.active {
      background: rgba(200,220,255,0.9);
      transform: scale(1.4);
    }

    /* ── Page counter ── */
    .page-counter {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      right: 16px;
      z-index: 6;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    /* ── Lightbox ── */
    .overlay {
      position: fixed; inset: 0; display: none; place-items: center;
      padding: 16px; background: rgba(2,4,10,0.95); backdrop-filter: blur(16px);
      z-index: 25;
    }
    .overlay.open { display: grid; }
    .overlay figure { margin: 0; width: min(1080px, 100%); }
    .overlay img {
      display: block; width: 100%; max-height: 80vh; object-fit: contain;
      border-radius: 20px; border: 1px solid rgba(175,194,255,0.1);
      background: rgba(255,255,255,0.03);
    }
    .overlay figcaption {
      margin-top: 10px; text-align: center; color: #e7edff;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap;
    }

    /* ── Editor ── */
    .editor {
      position: fixed; inset: 0 0 0 auto; width: min(460px, 100%);
      padding: 18px; background: linear-gradient(180deg, rgba(7,12,24,0.98), rgba(6,10,18,0.98));
      border-left: 1px solid rgba(175,194,255,0.12);
      box-shadow: -18px 0 40px rgba(0,0,0,0.32);
      transform: translateX(100%); transition: transform 0.24s ease;
      z-index: 30; overflow-y: auto; backdrop-filter: blur(16px);
    }
    .editor.open { transform: translateX(0); }
    .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .editor-head h2 { margin: 0; font-size: 22px; }

    .panel { padding: 18px; margin-bottom: 16px; border-radius: 22px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.04); }
    .panel h3 { margin: 0 0 12px; font-size: 17px; }
    .panel p, .manage-empty, .status { margin: 0 0 14px; color: #9aabd9; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 8px; color: #9aabd9; font-size: 13px; }
    .field input, .field textarea { width: 100%; padding: 13px 14px; border-radius: 16px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.05); color: #eef2ff; font: inherit; outline: none; }
    .field textarea { min-height: 100px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .session-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; background: rgba(255,255,255,0.05); color: #9aabd9; font-size: 13px; }
    .manage-list { display: grid; gap: 12px; }
    .manage-card { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 12px; padding: 12px; border-radius: 18px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.04); }
    .manage-card img { display: block; width: 74px; height: 74px; object-fit: cover; border-radius: 14px; background: rgba(255,255,255,0.04); }

    button { border: 0; border-radius: 999px; padding: 12px 16px; background: linear-gradient(135deg, #6da8ff, #f06090); color: #fff; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 12px 28px rgba(100,150,255,0.25); transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease; }
    button.secondary { background: rgba(255,255,255,0.06); color: #eef2ff; border: 1px solid rgba(175,194,255,0.14); box-shadow: none; }
    button.small { padding: 9px 12px; font-size: 13px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    @media (max-width: 600px) {
      .card { width: min(28vw, 110px); }
      .plane-group svg { width: min(28vw, 100px); }
      .flight-channel { height: clamp(40px, 10vh, 70px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="stars" aria-hidden="true"></div>

    <!-- Carousel -->
    <div class="carousel-viewport" id="viewport">
      <div class="carousel-track instant" id="track"></div>
    </div>

    <!-- Plane -->
    <div class="plane-layer" aria-hidden="true">
      <div class="plane-trail"></div>
      <div class="plane-group">
        <svg viewBox="0 0 200 100">
          <defs>
            <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="80%">
              <stop offset="0%" stop-color="#ffffff"></stop>
              <stop offset="25%" stop-color="#eaf2ff"></stop>
              <stop offset="55%" stop-color="#a8ccff"></stop>
              <stop offset="100%" stop-color="#5090ee"></stop>
            </linearGradient>
            <filter id="pGlow">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Main body & wings -->
          <path class="plane-body" filter="url(#pGlow)"
            d="M22 50 170 20 116 46 170 80 100 60 76 86 82 53 22 50Z"/>
          <!-- Top wing highlight -->
          <path d="M116 46 170 20 144 38 116 46Z" fill="rgba(255,255,255,0.55)"/>
          <!-- Bottom wing shadow -->
          <path d="M100 60 170 80 144 68 100 60Z" fill="rgba(30,55,110,0.3)"/>
          <!-- Body center ridge -->
          <line x1="22" y1="50" x2="108" y2="52" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>
          <!-- Nose -->
          <ellipse cx="26" cy="50" rx="5" ry="3.5" fill="rgba(255,255,255,0.75)"/>
        </svg>
      </div>
    </div>

    <!-- Swipe dots -->
    <div class="swipe-indicator" id="swipeDots"></div>

    <!-- Page counter -->
    <div class="page-counter" id="pageCounter"></div>
  </main>

  <!-- Lightbox -->
  <div class="overlay" id="lightbox">
    <figure>
      <img id="lightboxImage" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <!-- Editor -->
  <aside class="editor" id="editorPanel" aria-hidden="true">
    <div class="editor-head">
      <h2>编辑</h2>
      <button class="secondary" id="closeEditor" type="button">关闭</button>
    </div>
    <section class="panel">
      <h3>管理员登录</h3>
      <div class="session-line">
        <span id="sessionText">未登录</span>
        <button class="secondary small" id="signOutBtn" type="button" hidden>退出</button>
      </div>
      <form id="loginForm">
        <div class="field"><label for="emailInput">邮箱</label><input id="emailInput" type="email" autocomplete="username"></div>
        <div class="field"><label for="passwordInput">密码</label><input id="passwordInput" type="password" autocomplete="current-password"></div>
        <div class="row"><button id="signInBtn" type="submit">登录</button></div>
      </form>
      <div class="status" id="authStatus"></div>
    </section>
    <section class="panel">
      <h3>背景音乐</h3>
      <div class="field"><label for="musicInput">音频直链</label><input id="musicInput" type="url" placeholder="https://example.com/music.mp3"></div>
      <div class="row"><button id="saveSettingsBtn" type="button">保存</button><button class="secondary" id="musicToggle" type="button" hidden>播放</button></div>
      <div class="status" id="settingsStatus"></div>
    </section>
    <section class="panel">
      <h3>上传图片</h3>
      <p>图片会自动优化压缩，上传快速且放大清晰。</p>
      <div class="field"><label for="uploadInput">选择图片</label><input id="uploadInput" type="file" accept="image/*" multiple></div>
      <div class="field"><label for="captionsInput">每行一句话，按图片顺序对应</label><textarea id="captionsInput" placeholder="第一张图的一句话&#10;第二张图的一句话"></textarea></div>
      <div class="row"><button id="uploadBtn" type="button">上传到云端</button></div>
      <div class="status" id="uploadStatus"></div>
    </section>
    <section class="panel">
      <h3>图片管理</h3>
      <div class="manage-list" id="manageList"></div>
      <div class="manage-empty" id="manageEmpty">还没有图片。</div>
      <div class="status" id="manageStatus"></div>
    </section>
  </aside>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const CONFIG = {
      SUPABASE_URL: "https://pnzbcsnoqrmtdkxyxfms.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_BZMrBawoq266rDTBEcIXRQ_yCrQPJ8C",
      ALBUM_SLUG: "main",
      IMAGES_BUCKET: "wall-images",
      MAX_UPLOAD_EDGE: 1200,
      TARGET_UPLOAD_BYTES: 200 * 1024,
      MAX_UPLOAD_QUALITY: 0.72,
      MIN_UPLOAD_QUALITY: 0.40,
      USE_IMAGE_TRANSFORMS: true,
      WALL_IMAGE_WIDTH: 260,
      WALL_IMAGE_HEIGHT: 340,
      WALL_IMAGE_QUALITY: 35,
      LIGHTBOX_IMAGE_WIDTH: 1280,
      LIGHTBOX_IMAGE_QUALITY: 82,
    };

    const PHOTOS_PER_BATCH = 6;
    const PLANE_PAUSE_START = 0.40;  // fraction into journey when plane stops
    const PLANE_PAUSE_END = 0.68;
    const BATCH_ADVANCE_INTERVAL = 2200; // ms between auto-advances while plane hovers

    // ── DOM ──
    const stage = document.getElementById("stage");
    const track = document.getElementById("track");
    const viewport = document.getElementById("viewport");
    const swipeDots = document.getElementById("swipeDots");
    const pageCounter = document.getElementById("pageCounter");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const editorPanel = document.getElementById("editorPanel");
    const closeEditor = document.getElementById("closeEditor");
    const sessionText = document.getElementById("sessionText");
    const signOutBtn = document.getElementById("signOutBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authStatus = document.getElementById("authStatus");
    const musicInput = document.getElementById("musicInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const musicToggle = document.getElementById("musicToggle");
    const settingsStatus = document.getElementById("settingsStatus");
    const uploadInput = document.getElementById("uploadInput");
    const captionsInput = document.getElementById("captionsInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const manageList = document.getElementById("manageList");
    const manageEmpty = document.getElementById("manageEmpty");
    const manageStatus = document.getElementById("manageStatus");

    // ── State ──
    let supabase = null;
    let currentSession = null;
    let currentImages = [];
    let audioElement = null;
    let batches = [];
    let currentBatch = 0;
    let totalBatches = 0;
    let autoAdvanceTimer = null;
    let isAutoAdvancing = false;
    let tapCount = 0;
    let tapTimer = null;
    let pendingLightboxTimeout = 0;
    let longPressTimer = 0;
    let swipeStartX = 0;
    let swipeStartY = 0;
    let swipeMoved = false;

    init();

    async function init() {
      supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      bindUi();
      updateAuthUi();
      await refreshSession();
      await loadSettings();
      await loadWall();
    }

    function bindUi() {
      closeEditor.addEventListener("click", closeEditorPanel);
      lightbox.addEventListener("click", closeLightbox);
      musicToggle.addEventListener("click", toggleMusicPlayback);
      track.addEventListener("click", onTrackClick);

      // Touch/swipe
      track.addEventListener("touchstart", onSwipeStart, { passive: true });
      track.addEventListener("touchmove", onSwipeMove, { passive: true });
      track.addEventListener("touchend", onSwipeEnd, { passive: true });

      stage.addEventListener("pointerup", onStageTap, { passive: true });
      stage.addEventListener("pointerdown", onStagePressStart, { passive: true });
      stage.addEventListener("pointermove", onStagePressEnd, { passive: true });
      stage.addEventListener("pointercancel", onStagePressEnd, { passive: true });
      stage.addEventListener("pointerleave", onStagePressEnd, { passive: true });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") { closeEditorPanel(); closeLightbox(); }
        if (event.key === "ArrowLeft") { goToBatch(currentBatch - 1); }
        if (event.key === "ArrowRight") { goToBatch(currentBatch + 1); }
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setAuthStatus("正在登录...");
        const { error } = await supabase.auth.signInWithPassword({ email: emailInput.value.trim(), password: passwordInput.value });
        if (error) { setAuthStatus(`登录失败：${error.message}`); return; }
        passwordInput.value = "";
        setAuthStatus("登录成功。");
        await refreshSession();
      });

      signOutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        currentSession = null;
        updateAuthUi();
        setAuthStatus("已退出登录。");
      });

      saveSettingsBtn.addEventListener("click", saveSettings);
      uploadBtn.addEventListener("click", uploadImages);
    }

    // ── Swipe ──
    function onSwipeStart(e) {
      if (editorPanel.classList.contains("open")) return;
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
      swipeMoved = false;
    }

    function onSwipeMove(e) {
      if (!swipeStartX) return;
      const dx = e.touches[0].clientX - swipeStartX;
      const dy = e.touches[0].clientY - swipeStartY;
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
        swipeMoved = true;
      }
    }

    function onSwipeEnd(e) {
      if (!swipeMoved || !swipeStartX) { swipeStartX = 0; return; }
      const dx = (e.changedTouches[0]?.clientX || 0) - swipeStartX;
      swipeStartX = 0;
      if (Math.abs(dx) > 40) {
        if (dx < 0) goToBatch(currentBatch + 1);
        else goToBatch(currentBatch - 1);
      }
    }

    function onTrackClick(e) {
      const card = e.target.closest(".card");
      if (!card) return;
      const idx = parseInt(card.dataset.imageIndex);
      if (!isNaN(idx) && currentImages[idx]) {
        scheduleLightboxOpen(currentImages[idx], idx);
      }
    }

    // ── Batch navigation ──
    function goToBatch(index) {
      if (totalBatches === 0) return;
      currentBatch = Math.max(0, Math.min(index, totalBatches - 1));
      track.classList.remove("instant");
      track.style.transform = `translateX(-${currentBatch * 100}%)`;
      updateIndicators();
    }

    function updateIndicators() {
      // Dots
      swipeDots.innerHTML = "";
      for (let i = 0; i < totalBatches; i++) {
        const dot = document.createElement("span");
        dot.className = "swipe-dot" + (i === currentBatch ? " active" : "");
        swipeDots.appendChild(dot);
      }
      swipeDots.style.display = totalBatches > 1 ? "flex" : "none";
      // Counter
      pageCounter.textContent = totalBatches > 1 ? `${currentBatch + 1}/${totalBatches}` : "";
    }

    // ── Auto-advance loop (triggered by plane pausing) ──
    function startAutoAdvance() {
      if (isAutoAdvancing || totalBatches <= 1) return;
      isAutoAdvancing = true;
      advanceNext();
    }

    function advanceNext() {
      if (!isAutoAdvancing) return;
      if (currentBatch >= totalBatches - 1) {
        stopAutoAdvance();
        return;
      }
      autoAdvanceTimer = setTimeout(() => {
        animateBatchTransition(currentBatch, currentBatch + 1);
        currentBatch++;
        updateIndicators();
        advanceNext();
      }, BATCH_ADVANCE_INTERVAL);
    }

    function stopAutoAdvance() {
      isAutoAdvancing = false;
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = null;
    }

    function animateBatchTransition(fromIdx, toIdx) {
      const fromBatch = document.querySelector(`.batch[data-index="${fromIdx}"]`);
      const toBatch = document.querySelector(`.batch[data-index="${toIdx}"]`);
      if (!fromBatch || !toBatch) return;

      // Animate: top row slides up, bottom row slides down (from old batch)
      const fromCards = fromBatch.querySelectorAll(".card");
      fromCards.forEach((card, i) => {
        const row = i < 3 ? 0 : 1;
        card.classList.add(row === 0 ? "sliding-out-top" : "sliding-out-bottom");
      });

      // Show new batch
      track.classList.remove("instant");
      track.style.transform = `translateX(-${toIdx * 100}%)`;

      // Animate new cards sliding in
      const toCards = toBatch.querySelectorAll(".card");
      toCards.forEach((card, i) => {
        card.style.opacity = "0";
        const row = i < 3 ? 0 : 1;
        card.classList.add(row === 0 ? "sliding-in-top" : "sliding-in-bottom");
      });

      // Cleanup
      setTimeout(() => {
        fromCards.forEach(c => {
          c.classList.remove("sliding-out-top", "sliding-out-bottom");
        });
        toCards.forEach(c => {
          c.classList.remove("sliding-in-top", "sliding-in-bottom");
          c.style.opacity = "";
        });
      }, 600);
    }

    // ── Plane journey observer ──
    function setupPlaneObserver() {
      // Listen to plane animation events via JS timers (synced to 12s journey)
      const JOURNEY_DURATION = 12000;
      const pauseStart = PLANE_PAUSE_START * JOURNEY_DURATION;
      const pauseEnd = PLANE_PAUSE_END * JOURNEY_DURATION;

      function syncPlaneCycle() {
        // Calculate where we are in the animation cycle
        const elapsed = (Date.now() % JOURNEY_DURATION);
        if (elapsed >= pauseStart && elapsed < pauseEnd) {
          if (!isAutoAdvancing && totalBatches > 1 && currentBatch === 0) {
            // Reset auto-advance for new cycle
          }
          startAutoAdvance();
        } else if (elapsed >= pauseEnd || elapsed < 1000) {
          // Plane is flying away or starting - let user manually scroll
          // Don't stop auto-advance here; let it finish
        }
        requestAnimationFrame(() => {
          setTimeout(syncPlaneCycle, 500);
        });
      }
      setTimeout(syncPlaneCycle, 500);
    }

    // ── Lightbox ──
    function scheduleLightboxOpen(image, index) {
      cancelPendingLightbox();
      pendingLightboxTimeout = window.setTimeout(() => {
        pendingLightboxTimeout = 0;
        if (!editorPanel.classList.contains("open")) openLightbox(image, index);
      }, 300);
    }

    function cancelPendingLightbox() {
      if (!pendingLightboxTimeout) return;
      window.clearTimeout(pendingLightboxTimeout);
      pendingLightboxTimeout = 0;
    }

    function openLightbox(image, index) {
      lightboxImage.alt = image.caption || `图片 ${index + 1}`;
      lightboxCaption.textContent = image.caption || "";
      lightbox.classList.add("open");
      lightboxImage.src = image.fullUrl || image.originalUrl;
      lightboxImage.onerror = () => {
        if (lightboxImage.src !== image.originalUrl) lightboxImage.src = image.originalUrl;
      };
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
      lightboxImage.alt = "";
      lightboxCaption.textContent = "";
    }

    // ── Editor entry ──
    function onStageTap(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) return;
      tapCount += 1;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 700);
      if (tapCount >= 3) {
        tapCount = 0;
        cancelPendingLightbox();
        onStagePressEnd();
        openEditorPanel();
      }
    }

    function onStagePressStart(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) return;
      onStagePressEnd();
      longPressTimer = window.setTimeout(() => {
        longPressTimer = 0;
        tapCount = 0;
        cancelPendingLightbox();
        openEditorPanel();
      }, 650);
    }

    function onStagePressEnd() {
      if (!longPressTimer) return;
      window.clearTimeout(longPressTimer);
      longPressTimer = 0;
    }

    function openEditorPanel() {
      editorPanel.classList.add("open");
      editorPanel.setAttribute("aria-hidden", "false");
    }

    function closeEditorPanel() {
      editorPanel.classList.remove("open");
      editorPanel.setAttribute("aria-hidden", "true");
    }

    // ── Auth / Settings / Music ──
    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) { setAuthStatus(`会话读取失败：${error.message}`); return; }
      currentSession = data.session;
      updateAuthUi();
    }

    function updateAuthUi() {
      const loggedIn = Boolean(currentSession?.user);
      sessionText.textContent = loggedIn ? `当前账号：${currentSession.user.email}` : "未登录";
      signOutBtn.hidden = !loggedIn;
      loginForm.hidden = loggedIn;
      saveSettingsBtn.disabled = !loggedIn;
      uploadBtn.disabled = !loggedIn;
      uploadInput.disabled = !loggedIn;
      captionsInput.disabled = !loggedIn;
      renderManageList();
    }

    async function loadSettings() {
      const { data, error } = await supabase.from("album_settings").select("music_url").eq("slug", CONFIG.ALBUM_SLUG).maybeSingle();
      if (error) { setSettingsStatus(`读取设置失败：${error.message}`); return; }
      musicInput.value = data?.music_url || "";
      syncMusic(data?.music_url || "");
    }

    function syncMusic(url) {
      if (audioElement) { audioElement.pause(); audioElement.remove(); audioElement = null; }
      if (!url) { musicToggle.hidden = true; musicToggle.textContent = "播放"; return; }
      audioElement = document.createElement("audio");
      audioElement.src = url; audioElement.loop = true; audioElement.preload = "none";
      document.body.appendChild(audioElement);
      musicToggle.hidden = false;
      musicToggle.textContent = "播放";
    }

    async function toggleMusicPlayback() {
      if (!audioElement) return;
      if (audioElement.paused) {
        try { await audioElement.play(); musicToggle.textContent = "暂停"; }
        catch { setSettingsStatus("音频无法播放，请检查链接。"); }
      } else { audioElement.pause(); musicToggle.textContent = "播放"; }
    }

    async function saveSettings() {
      if (!currentSession?.user) { setSettingsStatus("先登录，再保存。"); return; }
      setSettingsStatus("正在保存...");
      const { error } = await supabase.from("album_settings").upsert({ slug: CONFIG.ALBUM_SLUG, music_url: musicInput.value.trim() }, { onConflict: "slug" });
      if (error) { setSettingsStatus(`保存失败：${error.message}`); return; }
      syncMusic(musicInput.value.trim());
      setSettingsStatus("已保存。");
    }

    // ── Wall loading ──
    async function loadWall() {
      const { data, error } = await supabase
        .from("album_images")
        .select("id, title, file_path, sort_order, created_at")
        .eq("album_slug", CONFIG.ALBUM_SLUG)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });
      if (error) { setManageStatus(`读取图片失败：${error.message}`); return; }

      currentImages = (data || []).map((item) => {
        const originalUrl = getPublicUrl(item.file_path);
        return {
          ...item,
          caption: item.title || "",
          originalUrl,
          wallUrl: getWallUrl(item.file_path, originalUrl),
          fullUrl: getFullUrl(item.file_path, originalUrl),
        };
      });

      buildBatches();
      renderManageList();
    }

    function getWallUrl(filePath, fb) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fb;
      return getPublicUrl(filePath, { transform: { width: CONFIG.WALL_IMAGE_WIDTH, height: CONFIG.WALL_IMAGE_HEIGHT, quality: CONFIG.WALL_IMAGE_QUALITY, resize: "cover" } });
    }
    function getFullUrl(filePath, fb) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fb;
      return getPublicUrl(filePath, { transform: { width: CONFIG.LIGHTBOX_IMAGE_WIDTH, quality: CONFIG.LIGHTBOX_IMAGE_QUALITY, resize: "contain" } });
    }
    function getPublicUrl(filePath, options) {
      const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(filePath, options);
      return data.publicUrl;
    }

    // ── Batch building ──
    function buildBatches() {
      track.innerHTML = "";
      batches = [];
      totalBatches = Math.ceil(currentImages.length / PHOTOS_PER_BATCH) || 0;
      swipeDots.style.display = "none";
      pageCounter.textContent = "";

      if (totalBatches === 0) {
        // Show empty state
        const batch = document.createElement("div");
        batch.className = "batch";
        batch.dataset.index = "0";
        batch.style.display = "flex";
        batch.style.alignItems = "center";
        batch.style.justifyContent = "center";
        batch.innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:16px;text-align:center">还没有照片<br><span style="font-size:13px">三连击屏幕进入编辑</span></div>';
        track.appendChild(batch);
        return;
      }

      for (let b = 0; b < totalBatches; b++) {
        const batch = document.createElement("div");
        batch.className = "batch";
        batch.dataset.index = String(b);

        const start = b * PHOTOS_PER_BATCH;
        const end = Math.min(start + PHOTOS_PER_BATCH, currentImages.length);

        for (let i = start; i < end; i++) {
          const card = createCard(currentImages[i], i);
          batch.appendChild(card);
        }

        // Fill remaining slots with placeholders
        for (let i = end; i < start + PHOTOS_PER_BATCH; i++) {
          const ph = document.createElement("div");
          ph.className = "card";
          ph.style.visibility = "hidden";
          batch.appendChild(ph);
        }

        // Add flight channel in the middle (after 3 cards = top row)
        const channel = document.createElement("div");
        channel.className = "flight-channel";
        // Insert after the first 3 cards (top row)
        const thirdCard = batch.children[2];
        if (thirdCard) thirdCard.after(channel);

        batch.querySelectorAll(".card:not([style*='hidden'])").forEach(c => {
          if (c.dataset.imageIndex === undefined) return;
        });

        track.appendChild(batch);
        batches.push(batch);
      }

      currentBatch = 0;
      track.style.transform = "translateX(0%)";
      updateIndicators();
      setupPlaneObserver();
    }

    function createCard(image, index) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.imageIndex = String(index);

      const img = document.createElement("img");
      img.alt = image.caption || `图片 ${index + 1}`;
      img.loading = "lazy";
      img.decoding = "async";

      // Use IntersectionObserver for lazy loading
      const obs = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          img.src = image.wallUrl || image.originalUrl;
          obs.unobserve(card);
        }
      }, { rootMargin: "200px" });
      obs.observe(card);

      img.addEventListener("load", () => card.classList.add("loaded"), { once: true });
      img.addEventListener("error", () => {
        if (img.src !== image.originalUrl) { img.src = image.originalUrl; return; }
        card.classList.add("loaded");
      });

      card.appendChild(img);
      return card;
    }

    // ── Upload ──
    async function uploadImages() {
      if (!currentSession?.user) { setUploadStatus("先登录，再上传图片。"); return; }
      const files = Array.from(uploadInput.files || []).filter(f => f.type.startsWith("image/"));
      if (!files.length) { setUploadStatus("先选择至少一张图片。"); return; }

      const captions = captionsInput.value.split(/\r?\n/).map(l => l.trim());
      const baseOrder = currentImages.length ? Math.max(...currentImages.map(item => item.sort_order || 0)) + 1 : 1;
      const rowsToInsert = [];

      setUploadStatus(`准备上传 ${files.length} 张图片...`);

      for (const [offset, file] of files.entries()) {
        setUploadStatus(`正在压缩并上传第 ${offset + 1} / ${files.length} 张...`);
        const prepared = await prepareUploadFile(file);
        const filePath = `${CONFIG.ALBUM_SLUG}/${Date.now()}-${crypto.randomUUID()}-${sanitizeFileName(prepared.name)}`;

        const uploadResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(filePath, prepared, { cacheControl: "31536000", upsert: false });
        if (uploadResult.error) { setUploadStatus(`上传失败：${uploadResult.error.message}`); return; }
        rowsToInsert.push({ album_slug: CONFIG.ALBUM_SLUG, title: captions[offset] || "", file_path: filePath, sort_order: baseOrder + offset });
      }

      const insertResult = await supabase.from("album_images").insert(rowsToInsert);
      if (insertResult.error) {
        await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove(rowsToInsert.map(r => r.file_path));
        setUploadStatus(`写入图片记录失败：${insertResult.error.message}`);
        return;
      }

      uploadInput.value = "";
      captionsInput.value = "";
      setUploadStatus(`已上传 ${files.length} 张图片。`);
      await loadWall();
    }

    async function prepareUploadFile(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") return file;
      try {
        const bitmap = await loadBitmap(file);
        let { width, height } = fitSize(bitmap.width, bitmap.height, CONFIG.MAX_UPLOAD_EDGE);
        let quality = CONFIG.MAX_UPLOAD_QUALITY;
        let attempt = 0;
        let blob = null;

        while (attempt < 6) {
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d", { alpha: true }).drawImage(bitmap, 0, 0, width, height);
          blob = await canvasToBlob(canvas, "image/webp", quality);
          if (blob && blob.size <= CONFIG.TARGET_UPLOAD_BYTES) break;
          if (quality > CONFIG.MIN_UPLOAD_QUALITY) { quality = Math.max(CONFIG.MIN_UPLOAD_QUALITY, quality - 0.05); }
          else { width = Math.max(500, Math.round(width * 0.88)); height = Math.max(500, Math.round(height * 0.88)); }
          attempt++;
        }

        if (typeof bitmap.close === "function") bitmap.close();
        if (!blob || blob.size >= file.size * 0.96) return file;
        const baseName = file.name.replace(/\.[^.]+$/, "") || "photo";
        return new File([blob], `${baseName}.webp`, { type: "image/webp", lastModified: Date.now() });
      } catch (e) { console.warn("Compression skipped:", e); return file; }
    }

    async function loadBitmap(file) {
      if (typeof createImageBitmap === "function") return createImageBitmap(file);
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.src = url;
      await img.decode();
      URL.revokeObjectURL(url);
      return img;
    }

    function fitSize(w, h, max) {
      const longest = Math.max(w, h);
      if (longest <= max) return { width: w, height: h };
      const s = max / longest;
      return { width: Math.max(1, Math.round(w * s)), height: Math.max(1, Math.round(h * s)) };
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    function sanitizeFileName(n) { return n.replace(/[^a-zA-Z0-9._-]/g, "-"); }

    // ── Manage list ──
    function renderManageList() {
      manageList.innerHTML = "";
      const loggedIn = Boolean(currentSession?.user);
      if (!loggedIn) { manageEmpty.hidden = false; manageEmpty.textContent = "先登录，再管理图片。"; return; }
      if (!currentImages.length) { manageEmpty.hidden = false; manageEmpty.textContent = "还没有图片。"; return; }
      manageEmpty.hidden = true;

      currentImages.forEach((image, index) => {
        const card = document.createElement("article");
        card.className = "manage-card";
        const preview = document.createElement("img");
        preview.src = image.wallUrl;
        preview.alt = image.caption || `图片 ${index + 1}`;
        preview.loading = "lazy";
        preview.onerror = () => { if (preview.src !== image.originalUrl) preview.src = image.originalUrl; };

        const right = document.createElement("div");
        const field = document.createElement("div");
        field.className = "field";
        const label = document.createElement("label");
        label.textContent = `图片 ${index + 1} 的一句话`;
        const input = document.createElement("textarea");
        input.value = image.caption || "";
        input.maxLength = 120; input.rows = 3;
        field.append(label, input);

        const row = document.createElement("div");
        row.className = "row";

        const saveBtn = document.createElement("button");
        saveBtn.className = "secondary small"; saveBtn.type = "button"; saveBtn.textContent = "保存句子";
        saveBtn.addEventListener("click", async () => { await updateImage(image.id, { title: input.value.trim() }, "句子已保存。"); });

        const upBtn = document.createElement("button");
        upBtn.className = "secondary small"; upBtn.type = "button"; upBtn.textContent = "前移"; upBtn.disabled = index === 0;
        upBtn.addEventListener("click", async () => { await moveImage(index, index - 1); });

        const downBtn = document.createElement("button");
        downBtn.className = "secondary small"; downBtn.type = "button"; downBtn.textContent = "后移"; downBtn.disabled = index === currentImages.length - 1;
        downBtn.addEventListener("click", async () => { await moveImage(index, index + 1); });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "small"; deleteBtn.type = "button"; deleteBtn.textContent = "删除";
        deleteBtn.addEventListener("click", async () => { await deleteImage(image); });

        row.append(saveBtn, upBtn, downBtn, deleteBtn);
        right.append(field, row);
        card.append(preview, right);
        manageList.appendChild(card);
      });
    }

    async function updateImage(id, patch, msg) {
      if (!currentSession?.user) { setManageStatus("先登录，再编辑图片。"); return; }
      setManageStatus("正在保存...");
      const { error } = await supabase.from("album_images").update(patch).eq("id", id);
      if (error) { setManageStatus(`保存失败：${error.message}`); return; }
      setManageStatus(msg);
      await loadWall();
    }

    async function moveImage(from, to) {
      if (!currentSession?.user) { setManageStatus("先登录，再调整顺序。"); return; }
      const src = currentImages[from];
      const tgt = currentImages[to];
      if (!src || !tgt) return;
      setManageStatus("正在调整顺序...");
      const so = src.sort_order || from + 1;
      const to_ = tgt.sort_order || to + 1;
      const f = await supabase.from("album_images").update({ sort_order: to_ }).eq("id", src.id);
      if (f.error) { setManageStatus(`调整失败：${f.error.message}`); return; }
      const s = await supabase.from("album_images").update({ sort_order: so }).eq("id", tgt.id);
      if (s.error) { setManageStatus(`调整失败：${s.error.message}`); return; }
      setManageStatus("顺序已更新。");
      await loadWall();
    }

    async function deleteImage(image) {
      if (!currentSession?.user) { setManageStatus("先登录，再删除图片。"); return; }
      if (!window.confirm("确认删除这张图片吗？")) return;
      setManageStatus("正在删除...");
      const r = await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove([image.file_path]);
      if (r.error) { setManageStatus(`删除云端图片失败：${r.error.message}`); return; }
      const d = await supabase.from("album_images").delete().eq("id", image.id);
      if (d.error) { setManageStatus(`删除图片记录失败：${d.error.message}`); return; }
      setManageStatus("图片已删除。");
      await loadWall();
    }

    function setAuthStatus(m) { authStatus.textContent = m; }
    function setSettingsStatus(m) { settingsStatus.textContent = m; }
    function setUploadStatus(m) { uploadStatus.textContent = m; }
    function setManageStatus(m) { manageStatus.textContent = m; }
  </script>
</body>
</html>
