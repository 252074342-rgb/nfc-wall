<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <style>
    :root {
      --bg: #06060e;
      --text: #eef2ff;
      --muted: #9aabd9;
      --line: rgba(179, 197, 255, 0.16);
      --glow: rgba(77, 166, 255, 0.45);
      --pink: #f05080;
      --pink-glow: rgba(240, 80, 128, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #06060e;
    }

    /* ── Main stage ── */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
    }

    /* ── NFC dark zone (top ~60%) ── */
    .nfc-zone {
      position: relative;
      flex: 0 0 62%;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(77, 166, 255, 0.10), transparent 55%),
        radial-gradient(ellipse at 50% 55%, rgba(240, 80, 128, 0.06), transparent 50%),
        radial-gradient(circle at 30% 70%, rgba(77, 140, 255, 0.05), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(180, 130, 255, 0.04), transparent 35%),
        linear-gradient(180deg, #08081a 0%, #0a0c18 40%, #0c0e1a 100%);
      overflow: hidden;
    }

    .nfc-zone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.9) 0 1px, transparent 1.2px),
        radial-gradient(circle at 28% 72%, rgba(255,255,255,0.6) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 44% 22%, rgba(255,255,255,0.8) 0 1px, transparent 1.3px),
        radial-gradient(circle at 58% 78%, rgba(255,255,255,0.7) 0 0.9px, transparent 1.2px),
        radial-gradient(circle at 72% 28%, rgba(255,255,255,0.75) 0 1px, transparent 1.3px),
        radial-gradient(circle at 85% 68%, rgba(255,255,255,0.65) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 15% 48%, rgba(255,255,255,0.7) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 92% 15%, rgba(255,255,255,0.8) 0 1px, transparent 1.2px);
      opacity: 0.7;
    }

    /* ── NFC indicator ── */
    .nfc-indicator {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      z-index: 5;
      pointer-events: none;
    }

    .nfc-core {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,40,70,0.95), rgba(15,20,45,0.98));
      border: 1.5px solid rgba(120, 180, 255, 0.5);
      box-shadow:
        0 0 20px rgba(77, 166, 255, 0.4),
        0 0 40px rgba(77, 166, 255, 0.15),
        inset 0 0 15px rgba(77, 166, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: nfcCorePulse 2s ease-in-out infinite;
    }

    .nfc-core svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: rgba(170, 210, 255, 0.9);
      stroke-width: 1.6;
    }

    .nfc-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.2px solid rgba(77, 166, 255, 0.5);
      animation: nfcRingExpand 2s ease-out infinite;
      opacity: 0;
    }

    .nfc-ring:nth-child(2) { animation-delay: 0.65s; }
    .nfc-ring:nth-child(3) { animation-delay: 1.3s; }

    @keyframes nfcCorePulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(77, 166, 255, 0.4), 0 0 40px rgba(77, 166, 255, 0.15), inset 0 0 15px rgba(77, 166, 255, 0.1);
        border-color: rgba(120, 180, 255, 0.5);
      }
      50% {
        box-shadow: 0 0 35px rgba(77, 166, 255, 0.7), 0 0 70px rgba(77, 166, 255, 0.3), inset 0 0 25px rgba(77, 166, 255, 0.2);
        border-color: rgba(170, 220, 255, 0.8);
      }
    }

    @keyframes nfcRingExpand {
      0% {
        transform: scale(0.7);
        opacity: 0.9;
        border-width: 1.4px;
      }
      100% {
        transform: scale(2.8);
        opacity: 0;
        border-width: 0.3px;
      }
    }

    /* ── Ripple on tap ── */
    .tap-ripple {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(77, 166, 255, 0.6);
      background: radial-gradient(circle, rgba(77, 166, 255, 0.15), transparent);
      pointer-events: none;
      animation: tapRipple 0.9s ease-out forwards;
      z-index: 4;
    }

    @keyframes tapRipple {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }

    /* ── Photo cards ── */
    .cards {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .tile {
      position: absolute;
      width: min(22vw, 110px);
      min-width: 80px;
      border-radius: 18px;
      padding: 6px 6px 8px;
      background:
        linear-gradient(180deg, rgba(224, 234, 255, 0.14), rgba(100, 130, 180, 0.10)),
        linear-gradient(180deg, rgba(10, 15, 28, 0.94), rgba(5, 9, 20, 0.98));
      border: 1px solid rgba(200, 220, 255, 0.14);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.03),
        0 14px 30px rgba(0,0,0,0.35),
        0 0 22px rgba(77, 150, 255, 0.08);
      opacity: 0;
      transform: translate3d(-50%, -50%, 0) scale(1.06);
      pointer-events: auto;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .tile.visible {
      animation: tileAppear 0.75s cubic-bezier(0.22, 0.7, 0.2, 1) forwards;
    }

    .tile.floating {
      animation: tileOrbit var(--float-duration, 9s) ease-in-out infinite alternate;
      animation-delay: var(--float-delay, 0s);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 6px 6px 8px;
      border-radius: 13px;
      border: 1px solid rgba(200, 225, 255, 0.12);
      box-shadow: 0 0 10px rgba(120, 170, 255, 0.1);
      pointer-events: none;
    }

    .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 13px;
      border: 1px solid rgba(200, 225, 255, 0.15);
      background: linear-gradient(180deg, #11192a, #070d17);
      opacity: 0;
      transition: opacity 0.24s ease;
    }

    .tile.loaded img { opacity: 1; }

    /* ── Pink accent strip ── */
    .accent-strip {
      position: relative;
      z-index: 6;
      flex: 0 0 6px;
      background: linear-gradient(90deg,
        rgba(240, 80, 128, 0.2),
        rgba(240, 80, 128, 0.8) 20%,
        rgba(255, 120, 160, 0.9) 50%,
        rgba(240, 80, 128, 0.8) 80%,
        rgba(240, 80, 128, 0.2)
      );
      box-shadow: 0 0 18px rgba(240, 80, 128, 0.4), 0 0 4px rgba(240, 80, 128, 0.5);
    }

    .accent-strip::after {
      content: "";
      position: absolute;
      inset: -3px 0;
      background: linear-gradient(90deg,
        transparent,
        rgba(255, 150, 190, 0.3) 30%,
        rgba(255, 150, 190, 0.5) 50%,
        rgba(255, 150, 190, 0.3) 70%,
        transparent
      );
      filter: blur(8px);
      pointer-events: none;
    }

    /* ── Info zone (white bottom) ── */
    .info-zone {
      position: relative;
      flex: 1;
      background:
        linear-gradient(180deg, #fafafc 0%, #f4f4f8 40%, #eeeef4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      text-align: center;
      z-index: 2;
    }

    .info-zone h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .info-zone .subtitle {
      margin: 0 0 6px;
      font-size: 15px;
      color: #666680;
      line-height: 1.6;
    }

    .info-zone .hint {
      margin: 0;
      font-size: 12px;
      color: #999ab0;
      line-height: 1.6;
    }

    .info-zone .nfc-tag-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    /* ── Lightbox ── */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(2, 4, 10, 0.94);
      backdrop-filter: blur(14px);
      z-index: 25;
    }

    .overlay.open { display: grid; }

    .overlay figure {
      margin: 0;
      width: min(1080px, 100%);
    }

    .overlay img {
      display: block;
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 24px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      transition: opacity 0.18s ease, filter 0.18s ease;
    }

    .overlay img.upgrading {
      opacity: 0.9;
      filter: blur(4px);
    }

    .overlay figcaption {
      margin-top: 10px;
      text-align: center;
      color: #e7edff;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ── Editor panel ── */
    .editor {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(460px, 100%);
      padding: 18px;
      background: linear-gradient(180deg, rgba(7, 12, 24, 0.98), rgba(6, 10, 18, 0.98));
      border-left: 1px solid rgba(175, 194, 255, 0.12);
      box-shadow: -18px 0 40px rgba(0, 0, 0, 0.32);
      transform: translateX(100%);
      transition: transform 0.24s ease;
      z-index: 30;
      overflow-y: auto;
      backdrop-filter: blur(16px);
    }

    .editor.open { transform: translateX(0); }

    .editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .editor-head h2 { margin: 0; font-size: 22px; }

    .panel {
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 22px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .panel h3 { margin: 0 0 12px; font-size: 17px; }

    .panel p, .manage-empty, .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .field input, .field textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .session-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 13px;
    }

    .manage-list { display: grid; gap: 12px; }

    .manage-card {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .manage-card img {
      display: block;
      width: 74px;
      height: 74px;
      object-fit: cover;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #4da6ff, #f05080);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(77, 150, 255, 0.25);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(175, 194, 255, 0.14);
      box-shadow: none;
    }

    button.small { padding: 9px 12px; font-size: 13px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .nfc-zone { flex: 0 0 58%; }
      .tile { width: min(26vw, 100px); min-width: 76px; }
      .nfc-indicator { width: 64px; height: 64px; top: 6%; }
      .nfc-core svg { width: 22px; height: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .tile, .tile img { opacity: 1 !important; transform: translate3d(-50%, -50%, 0) !important; }
    }

    @keyframes tileAppear {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(1.12);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1);
      }
    }

    @keyframes tileOrbit {
      0% { transform: translate3d(-50%, -50%, 0) translate3d(0, 0, 0) rotate(-1deg) scale(1); }
      33% { transform: translate3d(-50%, -50%, 0) translate3d(5px, -9px, 0) rotate(0.3deg) scale(1.02); }
      66% { transform: translate3d(-50%, -50%, 0) translate3d(-5px, 6px, 0) rotate(-1deg) scale(0.995); }
      100% { transform: translate3d(-50%, -50%, 0) translate3d(3px, -4px, 0) rotate(0.6deg) scale(1.01); }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <!-- ── Dark NFC zone ── -->
    <section class="nfc-zone" id="nfcZone">
      <!-- NFC indicator -->
      <div class="nfc-indicator" aria-hidden="true">
        <div class="nfc-ring"></div>
        <div class="nfc-ring"></div>
        <div class="nfc-ring"></div>
        <div class="nfc-core">
          <svg viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 15l3-3 3 3 4-4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="9" r="1.5"/>
          </svg>
        </div>
      </div>

      <!-- Photo cards -->
      <div class="cards" id="cards"></div>

      <!-- Tap ripple container -->
      <div id="rippleContainer"></div>
    </section>

    <!-- Pink accent strip -->
    <div class="accent-strip" aria-hidden="true"></div>

    <!-- White info zone -->
    <section class="info-zone">
      <svg class="nfc-tag-icon" viewBox="0 0 24 24" fill="none" stroke="#999ab0" stroke-width="1.3">
        <rect x="3" y="7" width="18" height="12" rx="2"/>
        <path d="M7 12h2M11 12h6M7 15h4"/>
      </svg>
      <h1 id="pageTitle">我们的照片</h1>
      <p class="subtitle">轻触钥匙扣，打开这一页</p>
      <p class="hint">用手机 NFC 碰一下钥匙扣即可查看</p>
    </section>
  </main>

  <!-- ── Lightbox ── -->
  <div class="overlay" id="lightbox">
    <figure>
      <img id="lightboxImage" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <!-- ── Editor panel ── -->
  <aside class="editor" id="editorPanel" aria-hidden="true">
    <div class="editor-head">
      <h2>编辑</h2>
      <button class="secondary" id="closeEditor" type="button">关闭</button>
    </div>

    <section class="panel">
      <h3>管理员登录</h3>
      <div class="session-line">
        <span id="sessionText">未登录</span>
        <button class="secondary small" id="signOutBtn" type="button" hidden>退出</button>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="emailInput">邮箱</label>
          <input id="emailInput" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="passwordInput">密码</label>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </div>
        <div class="row">
          <button id="signInBtn" type="submit">登录</button>
        </div>
      </form>
      <div class="status" id="authStatus"></div>
    </section>

    <section class="panel">
      <h3>背景音乐</h3>
      <div class="field">
        <label for="musicInput">音频直链</label>
        <input id="musicInput" type="url" placeholder="https://example.com/music.mp3">
      </div>
      <div class="row">
        <button id="saveSettingsBtn" type="button">保存</button>
        <button class="secondary" id="musicToggle" type="button" hidden>播放</button>
      </div>
      <div class="status" id="settingsStatus"></div>
    </section>

    <section class="panel">
      <h3>上传图片</h3>
      <p>新图会被压缩优化，画质会有所牺牲。</p>
      <div class="field">
        <label for="uploadInput">选择图片</label>
        <input id="uploadInput" type="file" accept="image/*" multiple>
      </div>
      <div class="field">
        <label for="captionsInput">每行一句话，按图片顺序对应</label>
        <textarea id="captionsInput" placeholder="第一张图的一句话&#10;第二张图的一句话"></textarea>
      </div>
      <div class="row">
        <button id="uploadBtn" type="button">上传到云端</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </section>

    <section class="panel">
      <h3>图片管理</h3>
      <div class="manage-list" id="manageList"></div>
      <div class="manage-empty" id="manageEmpty">还没有图片。</div>
      <div class="status" id="manageStatus"></div>
    </section>
  </aside>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const CONFIG = {
      SUPABASE_URL: "https://pnzbcsnoqrmtdkxyxfms.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_BZMrBawoq266rDTBEcIXRQ_yCrQPJ8C",
      ALBUM_SLUG: "main",
      IMAGES_BUCKET: "wall-images",
      MAX_UPLOAD_EDGE: 640,
      TARGET_UPLOAD_BYTES: 100 * 1024,
      MAX_UPLOAD_QUALITY: 0.34,
      MIN_UPLOAD_QUALITY: 0.18,
      USE_IMAGE_TRANSFORMS: true,
      WALL_IMAGE_WIDTH: 160,
      WALL_IMAGE_HEIGHT: 220,
      WALL_IMAGE_QUALITY: 18,
      LIGHTBOX_IMAGE_WIDTH: 480,
      LIGHTBOX_IMAGE_QUALITY: 30,
    };

    const CARD_POSITIONS = [
      { x: 62, y: 42 }, { x: 78, y: 58 }, { x: 54, y: 68 },
      { x: 32, y: 72 }, { x: 80, y: 32 }, { x: 22, y: 48 },
      { x: 68, y: 28 }, { x: 86, y: 72 }, { x: 38, y: 34 }, { x: 20, y: 66 }
    ];

    const cards = document.getElementById("cards");
    const stage = document.getElementById("stage");
    const nfcZone = document.getElementById("nfcZone");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const editorPanel = document.getElementById("editorPanel");
    const closeEditor = document.getElementById("closeEditor");
    const sessionText = document.getElementById("sessionText");
    const signOutBtn = document.getElementById("signOutBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authStatus = document.getElementById("authStatus");
    const musicInput = document.getElementById("musicInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const musicToggle = document.getElementById("musicToggle");
    const settingsStatus = document.getElementById("settingsStatus");
    const uploadInput = document.getElementById("uploadInput");
    const captionsInput = document.getElementById("captionsInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const manageList = document.getElementById("manageList");
    const manageEmpty = document.getElementById("manageEmpty");
    const manageStatus = document.getElementById("manageStatus");

    let supabase = null;
    let currentSession = null;
    let currentImages = [];
    let audioElement = null;
    let sourceObserver = null;
    let tapCount = 0;
    let tapTimer = null;
    let pendingLightboxTimeout = 0;
    let longPressTimer = 0;

    init();

    async function init() {
      supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      bindUi();
      updateAuthUi();
      await refreshSession();
      await loadSettings();
      await loadWall();
    }

    function bindUi() {
      nfcZone.addEventListener("pointerup", onStageTap, { passive: true });
      nfcZone.addEventListener("pointerdown", onStagePressStart, { passive: true });
      nfcZone.addEventListener("pointermove", onStagePressEnd, { passive: true });
      nfcZone.addEventListener("pointercancel", onStagePressEnd, { passive: true });
      nfcZone.addEventListener("pointerleave", onStagePressEnd, { passive: true });
      nfcZone.addEventListener("click", spawnTapRipple, { passive: true });
      closeEditor.addEventListener("click", closeEditorPanel);
      lightbox.addEventListener("click", closeLightbox);
      musicToggle.addEventListener("click", toggleMusicPlayback);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeEditorPanel();
          closeLightbox();
        }
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setAuthStatus("正在登录...");
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });
        if (error) {
          setAuthStatus(`登录失败：${error.message}`);
          return;
        }
        passwordInput.value = "";
        setAuthStatus("登录成功。");
        await refreshSession();
      });

      signOutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        currentSession = null;
        updateAuthUi();
        setAuthStatus("已退出登录。");
      });

      saveSettingsBtn.addEventListener("click", saveSettings);
      uploadBtn.addEventListener("click", uploadImages);
    }

    function spawnTapRipple(event) {
      if (editorPanel.classList.contains("open")) return;
      if (event.target.closest(".tile")) return;
      const rect = nfcZone.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const ripple = document.createElement("div");
      ripple.className = "tap-ripple";
      ripple.style.left = x + "px";
      ripple.style.top = y + "px";
      ripple.style.width = "60px";
      ripple.style.height = "60px";
      nfcZone.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove());
    }

    function onStageTap(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) {
        return;
      }
      tapCount += 1;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 700);
      if (tapCount >= 3) {
        tapCount = 0;
        cancelPendingLightbox();
        onStagePressEnd();
        openEditorPanel();
      }
    }

    function onStagePressStart(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) {
        return;
      }
      onStagePressEnd();
      longPressTimer = window.setTimeout(() => {
        longPressTimer = 0;
        tapCount = 0;
        cancelPendingLightbox();
        openEditorPanel();
      }, 650);
    }

    function onStagePressEnd() {
      if (!longPressTimer) return;
      window.clearTimeout(longPressTimer);
      longPressTimer = 0;
    }

    function openEditorPanel() {
      editorPanel.classList.add("open");
      editorPanel.setAttribute("aria-hidden", "false");
    }

    function closeEditorPanel() {
      editorPanel.classList.remove("open");
      editorPanel.setAttribute("aria-hidden", "true");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
      lightboxImage.alt = "";
      lightboxCaption.textContent = "";
    }

    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        setAuthStatus(`会话读取失败：${error.message}`);
        return;
      }
      currentSession = data.session;
      updateAuthUi();
    }

    function updateAuthUi() {
      const loggedIn = Boolean(currentSession?.user);
      sessionText.textContent = loggedIn ? `当前账号：${currentSession.user.email}` : "未登录";
      signOutBtn.hidden = !loggedIn;
      loginForm.hidden = loggedIn;
      saveSettingsBtn.disabled = !loggedIn;
      uploadBtn.disabled = !loggedIn;
      uploadInput.disabled = !loggedIn;
      captionsInput.disabled = !loggedIn;
      renderManageList();
    }

    async function loadSettings() {
      const { data, error } = await supabase
        .from("album_settings")
        .select("music_url")
        .eq("slug", CONFIG.ALBUM_SLUG)
        .maybeSingle();
      if (error) {
        setSettingsStatus(`读取设置失败：${error.message}`);
        return;
      }
      musicInput.value = data?.music_url || "";
      syncMusic(data?.music_url || "");
    }

    async function loadWall() {
      const { data, error } = await supabase
        .from("album_images")
        .select("id, title, file_path, sort_order, created_at")
        .eq("album_slug", CONFIG.ALBUM_SLUG)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });
      if (error) {
        setManageStatus(`读取图片失败：${error.message}`);
        return;
      }

      currentImages = (data || []).map((item) => {
        const originalUrl = getPublicUrl(item.file_path);
        return {
          ...item,
          caption: item.title || "",
          originalUrl,
          wallUrl: getWallUrl(item.file_path, originalUrl),
          fullUrl: getFullUrl(item.file_path, originalUrl),
        };
      });

      renderWall();
      renderManageList();
    }

    function getWallUrl(filePath, fallbackUrl) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fallbackUrl;
      return getPublicUrl(filePath, {
        transform: {
          width: CONFIG.WALL_IMAGE_WIDTH,
          height: CONFIG.WALL_IMAGE_HEIGHT,
          quality: CONFIG.WALL_IMAGE_QUALITY,
          resize: "cover",
        },
      });
    }

    function getFullUrl(filePath, fallbackUrl) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fallbackUrl;
      return getPublicUrl(filePath, {
        transform: {
          width: CONFIG.LIGHTBOX_IMAGE_WIDTH,
          quality: CONFIG.LIGHTBOX_IMAGE_QUALITY,
          resize: "contain",
        },
      });
    }

    function getPublicUrl(filePath, options) {
      const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(filePath, options);
      return data.publicUrl;
    }

    function renderWall() {
      cards.innerHTML = "";
      if (sourceObserver) {
        sourceObserver.disconnect();
      }

      sourceObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          startTileLoad(entry.target);
          sourceObserver.unobserve(entry.target);
        }
      }, { rootMargin: "120px" });

      currentImages.forEach((image, index) => {
        const tile = createTile(image, index);
        cards.appendChild(tile);
        sourceObserver.observe(tile);
      });
    }

    function createTile(image, index) {
      const tile = document.createElement("article");
      tile.className = "tile";
      const pos = CARD_POSITIONS[index % CARD_POSITIONS.length];
      tile.style.left = pos.x + "%";
      tile.style.top = pos.y + "%";
      tile.style.setProperty("--float-duration", `${7.5 + (index % 4) * 0.8}s`);
      tile.style.setProperty("--float-delay", `${(index % 5) * 0.45}s`);
      tile.dataset.wallSrc = image.wallUrl;
      tile.dataset.wallFallback = image.originalUrl;

      const img = document.createElement("img");
      img.alt = image.caption || `图片 ${index + 1}`;
      img.decoding = "async";
      img.loading = "lazy";
      img.addEventListener("load", () => tile.classList.add("loaded"), { once: true });
      img.addEventListener("error", () => {
        if (img.src !== tile.dataset.wallFallback) {
          img.src = tile.dataset.wallFallback;
          return;
        }
        tile.classList.add("loaded");
      });

      tile.append(img);
      tile.addEventListener("click", (e) => {
        e.stopPropagation();
        scheduleLightboxOpen(image, index);
      });

      const revealDelay = 120 + index * 110;
      window.setTimeout(() => {
        tile.classList.add("visible");
        window.setTimeout(() => tile.classList.add("floating"), 760);
      }, revealDelay);

      return tile;
    }

    function scheduleLightboxOpen(image, index) {
      cancelPendingLightbox();
      pendingLightboxTimeout = window.setTimeout(() => {
        pendingLightboxTimeout = 0;
        if (!editorPanel.classList.contains("open")) {
          openLightbox(image, index);
        }
      }, 420);
    }

    function cancelPendingLightbox() {
      if (!pendingLightboxTimeout) return;
      window.clearTimeout(pendingLightboxTimeout);
      pendingLightboxTimeout = 0;
    }

    function startTileLoad(tile) {
      const img = tile.querySelector("img");
      if (!img || img.src) return;
      img.src = tile.dataset.wallSrc;
    }

    function openLightbox(image, index) {
      lightboxImage.classList.remove("upgrading");
      lightboxImage.src = image.wallUrl || image.originalUrl;
      lightboxImage.alt = image.caption || `图片 ${index + 1}`;
      lightboxCaption.textContent = image.caption || "";
      lightbox.classList.add("open");

      if (image.fullUrl && image.fullUrl !== image.wallUrl) {
        lightboxImage.classList.add("upgrading");
        const upgrade = new Image();
        upgrade.decoding = "async";
        upgrade.onload = () => {
          if (!lightbox.classList.contains("open")) return;
          lightboxImage.src = image.fullUrl;
          lightboxImage.classList.remove("upgrading");
        };
        upgrade.onerror = () => {
          if (image.originalUrl && image.originalUrl !== image.wallUrl) {
            lightboxImage.src = image.originalUrl;
          }
          lightboxImage.classList.remove("upgrading");
        };
        upgrade.src = image.fullUrl;
      }

      lightboxImage.onerror = () => {
        if (lightboxImage.src !== image.originalUrl) {
          lightboxImage.src = image.originalUrl;
        }
        lightboxImage.classList.remove("upgrading");
      };
    }

    async function saveSettings() {
      if (!currentSession?.user) {
        setSettingsStatus("先登录，再保存。");
        return;
      }
      setSettingsStatus("正在保存...");
      const { error } = await supabase.from("album_settings").upsert({
        slug: CONFIG.ALBUM_SLUG,
        music_url: musicInput.value.trim(),
      }, { onConflict: "slug" });
      if (error) {
        setSettingsStatus(`保存失败：${error.message}`);
        return;
      }
      syncMusic(musicInput.value.trim());
      setSettingsStatus("已保存。");
    }

    function syncMusic(url) {
      if (audioElement) {
        audioElement.pause();
        audioElement.remove();
        audioElement = null;
      }
      if (!url) {
        musicToggle.hidden = true;
        musicToggle.textContent = "播放";
        return;
      }
      audioElement = document.createElement("audio");
      audioElement.src = url;
      audioElement.loop = true;
      audioElement.preload = "none";
      document.body.appendChild(audioElement);
      musicToggle.hidden = false;
      musicToggle.textContent = "播放";
    }

    async function toggleMusicPlayback() {
      if (!audioElement) return;
      if (audioElement.paused) {
        try {
          await audioElement.play();
          musicToggle.textContent = "暂停";
        } catch {
          setSettingsStatus("音频无法播放，请检查链接。");
        }
        return;
      }
      audioElement.pause();
      musicToggle.textContent = "播放";
    }

    async function uploadImages() {
      if (!currentSession?.user) {
        setUploadStatus("先登录，再上传图片。");
        return;
      }

      const files = Array.from(uploadInput.files || []).filter((file) => file.type.startsWith("image/"));
      if (!files.length) {
        setUploadStatus("先选择至少一张图片。");
        return;
      }

      const captions = captionsInput.value.split(/\r?\n/).map((line) => line.trim());
      const baseOrder = currentImages.length ? Math.max(...currentImages.map((item) => item.sort_order || 0)) + 1 : 1;
      const rowsToInsert = [];

      setUploadStatus(`准备上传 ${files.length} 张图片...`);

      for (const [offset, file] of files.entries()) {
        setUploadStatus(`正在压缩并上传第 ${offset + 1} / ${files.length} 张...`);
        const prepared = await prepareUploadFile(file);
        const filePath = `${CONFIG.ALBUM_SLUG}/${Date.now()}-${crypto.randomUUID()}-${sanitizeFileName(prepared.name)}`;

        const uploadResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(filePath, prepared, {
          cacheControl: "31536000",
          upsert: false,
        });

        if (uploadResult.error) {
          setUploadStatus(`上传失败：${uploadResult.error.message}`);
          return;
        }

        rowsToInsert.push({
          album_slug: CONFIG.ALBUM_SLUG,
          title: captions[offset] || "",
          file_path: filePath,
          sort_order: baseOrder + offset,
        });
      }

      const insertResult = await supabase.from("album_images").insert(rowsToInsert);
      if (insertResult.error) {
        await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove(rowsToInsert.map((row) => row.file_path));
        setUploadStatus(`写入图片记录失败：${insertResult.error.message}`);
        return;
      }

      uploadInput.value = "";
      captionsInput.value = "";
      setUploadStatus(`已上传 ${files.length} 张图片。`);
      await loadWall();
    }

    async function prepareUploadFile(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") {
        return file;
      }

      try {
        const bitmap = await loadBitmap(file);
        let { width, height } = fitSize(bitmap.width, bitmap.height, CONFIG.MAX_UPLOAD_EDGE);
        let quality = CONFIG.MAX_UPLOAD_QUALITY;
        let attempt = 0;
        let blob = null;

        while (attempt < 6) {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d", { alpha: true });
          context.drawImage(bitmap, 0, 0, width, height);
          blob = await canvasToBlob(canvas, "image/webp", quality);

          if (blob && blob.size <= CONFIG.TARGET_UPLOAD_BYTES) {
            break;
          }

          if (quality > CONFIG.MIN_UPLOAD_QUALITY) {
            quality = Math.max(CONFIG.MIN_UPLOAD_QUALITY, quality - 0.04);
          } else {
            width = Math.max(420, Math.round(width * 0.88));
            height = Math.max(420, Math.round(height * 0.88));
          }

          attempt += 1;
        }

        if (typeof bitmap.close === "function") {
          bitmap.close();
        }

        if (!blob || blob.size >= file.size * 0.96) {
          return file;
        }

        const baseName = file.name.replace(/\.[^.]+$/, "") || "photo";
        return new File([blob], `${baseName}.webp`, {
          type: "image/webp",
          lastModified: Date.now(),
        });
      } catch (error) {
        console.warn("Image compression skipped:", error);
        return file;
      }
    }

    async function loadBitmap(file) {
      if (typeof createImageBitmap === "function") {
        return createImageBitmap(file);
      }
      const image = new Image();
      const objectUrl = URL.createObjectURL(file);
      image.src = objectUrl;
      await image.decode();
      URL.revokeObjectURL(objectUrl);
      return image;
    }

    function fitSize(width, height, maxEdge) {
      const longest = Math.max(width, height);
      if (longest <= maxEdge) {
        return { width, height };
      }
      const scale = maxEdge / longest;
      return {
        width: Math.max(1, Math.round(width * scale)),
        height: Math.max(1, Math.round(height * scale)),
      };
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob(resolve, type, quality);
      });
    }

    function renderManageList() {
      manageList.innerHTML = "";
      const loggedIn = Boolean(currentSession?.user);
      manageEmpty.hidden = currentImages.length > 0;
      if (!loggedIn) {
        manageEmpty.hidden = false;
        manageEmpty.textContent = "先登录，再管理图片。";
        return;
      }
      if (!currentImages.length) {
        manageEmpty.hidden = false;
        manageEmpty.textContent = "还没有图片。";
        return;
      }
      manageEmpty.hidden = true;

      currentImages.forEach((image, index) => {
        const card = document.createElement("article");
        card.className = "manage-card";

        const preview = document.createElement("img");
        preview.src = image.wallUrl;
        preview.alt = image.caption || `图片 ${index + 1}`;
        preview.loading = "lazy";
        preview.onerror = () => {
          if (preview.src !== image.originalUrl) preview.src = image.originalUrl;
        };

        const right = document.createElement("div");
        const field = document.createElement("div");
        field.className = "field";
        const label = document.createElement("label");
        label.textContent = `图片 ${index + 1} 的一句话`;
        const input = document.createElement("textarea");
        input.value = image.caption || "";
        input.maxLength = 120;
        input.rows = 3;
        field.append(label, input);

        const row = document.createElement("div");
        row.className = "row";

        const saveBtn = document.createElement("button");
        saveBtn.className = "secondary small";
        saveBtn.type = "button";
        saveBtn.textContent = "保存句子";
        saveBtn.addEventListener("click", async () => {
          await updateImage(image.id, { title: input.value.trim() }, "句子已保存。");
        });

        const upBtn = document.createElement("button");
        upBtn.className = "secondary small";
        upBtn.type = "button";
        upBtn.textContent = "前移";
        upBtn.disabled = index === 0;
        upBtn.addEventListener("click", async () => {
          await moveImage(index, index - 1);
        });

        const downBtn = document.createElement("button");
        downBtn.className = "secondary small";
        downBtn.type = "button";
        downBtn.textContent = "后移";
        downBtn.disabled = index === currentImages.length - 1;
        downBtn.addEventListener("click", async () => {
          await moveImage(index, index + 1);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "small";
        deleteBtn.type = "button";
        deleteBtn.textContent = "删除";
        deleteBtn.addEventListener("click", async () => {
          await deleteImage(image);
        });

        row.append(saveBtn, upBtn, downBtn, deleteBtn);
        right.append(field, row);
        card.append(preview, right);
        manageList.appendChild(card);
      });
    }

    async function updateImage(id, patch, successMessage) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再编辑图片。");
        return;
      }
      setManageStatus("正在保存...");
      const { error } = await supabase.from("album_images").update(patch).eq("id", id);
      if (error) {
        setManageStatus(`保存失败：${error.message}`);
        return;
      }
      setManageStatus(successMessage);
      await loadWall();
    }

    async function moveImage(fromIndex, toIndex) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再调整顺序。");
        return;
      }
      const source = currentImages[fromIndex];
      const target = currentImages[toIndex];
      if (!source || !target) return;

      setManageStatus("正在调整顺序...");
      const sourceOrder = source.sort_order || fromIndex + 1;
      const targetOrder = target.sort_order || toIndex + 1;

      const first = await supabase.from("album_images").update({ sort_order: targetOrder }).eq("id", source.id);
      if (first.error) {
        setManageStatus(`调整失败：${first.error.message}`);
        return;
      }

      const second = await supabase.from("album_images").update({ sort_order: sourceOrder }).eq("id", target.id);
      if (second.error) {
        setManageStatus(`调整失败：${second.error.message}`);
        return;
      }

      setManageStatus("顺序已更新。");
      await loadWall();
    }

    async function deleteImage(image) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再删除图片。");
        return;
      }
      const confirmed = window.confirm("确认删除这张图片吗？");
      if (!confirmed) return;

      setManageStatus("正在删除...");
      const removeResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove([image.file_path]);
      if (removeResult.error) {
        setManageStatus(`删除云端图片失败：${removeResult.error.message}`);
        return;
      }

      const deleteResult = await supabase.from("album_images").delete().eq("id", image.id);
      if (deleteResult.error) {
        setManageStatus(`删除图片记录失败：${deleteResult.error.message}`);
        return;
      }

      setManageStatus("图片已删除。");
      await loadWall();
    }

    function sanitizeFileName(name) {
      return name.replace(/[^a-zA-Z0-9._-]/g, "-");
    }

    function setAuthStatus(message) { authStatus.textContent = message; }
    function setSettingsStatus(message) { settingsStatus.textContent = message; }
    function setUploadStatus(message) { uploadStatus.textContent = message; }
    function setManageStatus(message) { manageStatus.textContent = message; }
  </script>
</body>
</html>
