<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #060810;
      color: #eef2ff;
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x;
    }

    /* ── Stage ── */
    .stage {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(77,166,255,0.07), transparent 55%),
        radial-gradient(ellipse at 50% 60%, rgba(240,80,128,0.04), transparent 50%),
        linear-gradient(180deg, #08081a 0%, #0a0c18 50%, #0c0e1a 100%);
    }

    /* Stars */
    .stars {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,0.85) 0 1px, transparent 1.2px),
        radial-gradient(circle at 28% 55%, rgba(255,255,255,0.55) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 44% 18%, rgba(255,255,255,0.75) 0 1px, transparent 1.3px),
        radial-gradient(circle at 58% 62%, rgba(255,255,255,0.65) 0 0.9px, transparent 1.2px),
        radial-gradient(circle at 72% 24%, rgba(255,255,255,0.7) 0 1px, transparent 1.3px),
        radial-gradient(circle at 85% 52%, rgba(255,255,255,0.6) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 15% 72%, rgba(255,255,255,0.65) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 92% 18%, rgba(255,255,255,0.75) 0 1px, transparent 1.2px),
        radial-gradient(circle at 38% 82%, rgba(255,255,255,0.5) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 65% 38%, rgba(255,255,255,0.65) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 8% 42%, rgba(255,255,255,0.7) 0 1px, transparent 1.2px),
        radial-gradient(circle at 48% 88%, rgba(255,255,255,0.5) 0 0.9px, transparent 1.1px);
      opacity: 0.72;
    }

    /* ── Viewport ── */
    .viewport {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
    }

    .track {
      display: flex;
      height: 100%;
      padding: 24px 0;
      transition: transform 0.55s cubic-bezier(0.25, 0.7, 0.3, 1);
      will-change: transform;
    }
    .track.instant { transition: none; }

    /* ── Column ── */
    .column {
      flex: 0 0 calc(100% / 3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(44px, 11vh, 80px);
      padding: 0 6px;
    }

    /* ── Cards ── */
    .card {
      position: relative;
      width: 86%;
      max-width: 140px;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(10,15,28,0.95), rgba(5,9,20,0.99));
      border: 1px solid rgba(200,220,255,0.14);
      box-shadow: 0 10px 24px rgba(0,0,0,0.36), 0 0 18px rgba(77,150,255,0.06);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.35s ease;
    }

    .card img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      background: linear-gradient(180deg, #11192a, #070d17);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card.loaded img { opacity: 1; }

    /* Card enter/exit animations */
    .card.entering {
      animation: cardEnter 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    .card.exiting {
      animation: cardExit 0.45s ease-in forwards;
      pointer-events: none;
    }

    @keyframes cardEnter {
      from { transform: translateX(30px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes cardExit {
      to { transform: translateX(-30px); opacity: 0; }
    }

    /* ── Plane ── */
    .plane-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
    }
    .plane-group {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      animation: planeJourney 12s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    .plane-group svg {
      display: block;
      width: min(24vw, 120px);
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(117,154,255,0.55)) drop-shadow(0 2px 6px rgba(255,255,255,0.25));
      animation: planeBob 0.8s ease-in-out infinite alternate;
    }
    @keyframes planeBob {
      from { transform: translateY(-3px) rotateX(2deg); }
      to   { transform: translateY(3px) rotateX(-3deg); }
    }
    .plane-trail {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, rgba(180,210,255,0.25) 10%, rgba(220,240,255,0.65) 35%, rgba(200,225,255,0.5) 65%, transparent 100%);
      filter: blur(2.5px);
      z-index: 4;
      border-radius: 2px;
      animation: trailJourney 12s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes planeJourney {
      0%   { left: -20%; transform: translateY(-50%) scale(0.65); opacity: 0; }
      7%   { opacity: 1; }
      30%  { left: 38%; transform: translateY(-50%) scale(1.18); opacity: 1; }
      42%  { left: 40%; transform: translateY(-50%) scale(1.22); opacity: 1; }
      68%  { left: 40%; transform: translateY(-50%) scale(1.22); opacity: 1; }
      82%  { left: 68%; transform: translateY(-50%) scale(0.88); opacity: 0.7; }
      100% { left: 110%; transform: translateY(-50%) scale(0.5); opacity: 0; }
    }
    @keyframes trailJourney {
      0%   { left: -20%; width: 4%; opacity: 0; }
      5%   { opacity: 0.85; }
      30%  { left: 6%; width: 28%; opacity: 0.9; }
      42%  { left: 8%; width: 32%; opacity: 0.85; }
      68%  { left: 8%; width: 32%; opacity: 0.85; }
      82%  { left: 34%; width: 28%; opacity: 0.45; }
      100% { left: 78%; width: 12%; opacity: 0; }
    }

    /* ── Indicators ── */
    .swipe-dots {
      position: absolute;
      bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 6; display: flex; gap: 7px; pointer-events: none;
    }
    .swipe-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.28);
      transition: background 0.3s, transform 0.3s;
    }
    .swipe-dot.active { background: rgba(200,220,255,0.9); transform: scale(1.5); }

    /* ── Lightbox ── */
    .overlay {
      position: fixed; inset: 0; display: none; place-items: center;
      padding: 16px; background: rgba(2,4,10,0.95); backdrop-filter: blur(16px);
      z-index: 25;
    }
    .overlay.open { display: grid; }
    .overlay figure { margin: 0; width: min(1080px, 100%); }
    .overlay img {
      display: block; width: 100%; max-height: 80vh; object-fit: contain;
      border-radius: 20px; border: 1px solid rgba(175,194,255,0.1);
      background: rgba(255,255,255,0.03);
    }
    .overlay figcaption {
      margin-top: 10px; text-align: center; color: #e7edff;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap;
    }

    /* ── Editor ── */
    .editor {
      position: fixed; inset: 0 0 0 auto; width: min(460px, 100%);
      padding: 18px; background: linear-gradient(180deg, rgba(7,12,24,0.98), rgba(6,10,18,0.98));
      border-left: 1px solid rgba(175,194,255,0.12);
      box-shadow: -18px 0 40px rgba(0,0,0,0.32);
      transform: translateX(100%); transition: transform 0.24s ease;
      z-index: 30; overflow-y: auto; backdrop-filter: blur(16px);
    }
    .editor.open { transform: translateX(0); }
    .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .editor-head h2 { margin: 0; font-size: 22px; }

    .panel { padding: 18px; margin-bottom: 16px; border-radius: 22px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.04); }
    .panel h3 { margin: 0 0 12px; font-size: 17px; }
    .panel p, .manage-empty, .status { margin: 0 0 14px; color: #9aabd9; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 8px; color: #9aabd9; font-size: 13px; }
    .field input, .field textarea { width: 100%; padding: 13px 14px; border-radius: 16px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.05); color: #eef2ff; font: inherit; outline: none; }
    .field textarea { min-height: 100px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .session-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; background: rgba(255,255,255,0.05); color: #9aabd9; font-size: 13px; }
    .manage-list { display: grid; gap: 12px; }
    .manage-card { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 12px; padding: 12px; border-radius: 18px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.04); }
    .manage-card img { display: block; width: 74px; height: 74px; object-fit: cover; border-radius: 14px; background: rgba(255,255,255,0.04); }

    button { border: 0; border-radius: 999px; padding: 12px 16px; background: linear-gradient(135deg, #6da8ff, #f06090); color: #fff; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 12px 28px rgba(100,150,255,0.25); transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s; }
    button.secondary { background: rgba(255,255,255,0.06); color: #eef2ff; border: 1px solid rgba(175,194,255,0.14); box-shadow: none; }
    button.small { padding: 9px 12px; font-size: 13px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    @media (max-width: 600px) {
      .card { max-width: 120px; }
      .column { gap: clamp(32px, 9vh, 60px); padding: 0 3px; }
      .plane-group svg { width: min(28vw, 100px); }
    }
    @media (min-width: 900px) {
      .card { max-width: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="stars" aria-hidden="true"></div>

    <!-- Carousel -->
    <div class="viewport" id="viewport">
      <div class="track instant" id="track"></div>
    </div>

    <!-- Plane -->
    <div class="plane-layer" aria-hidden="true">
      <div class="plane-trail"></div>
      <div class="plane-group">
        <svg viewBox="0 0 200 100">
          <defs>
            <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="80%">
              <stop offset="0%" stop-color="#ffffff"></stop>
              <stop offset="25%" stop-color="#eaf2ff"></stop>
              <stop offset="55%" stop-color="#a8ccff"></stop>
              <stop offset="100%" stop-color="#5090ee"></stop>
            </linearGradient>
            <filter id="pGlow">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path filter="url(#pGlow)" fill="url(#pGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="0.7"
            d="M22 50 170 20 116 46 170 80 100 60 76 86 82 53 22 50Z"/>
          <path d="M116 46 170 20 144 38 116 46Z" fill="rgba(255,255,255,0.55)"/>
          <path d="M100 60 170 80 144 68 100 60Z" fill="rgba(30,55,110,0.3)"/>
          <line x1="22" y1="50" x2="108" y2="52" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>
          <ellipse cx="26" cy="50" rx="5" ry="3.5" fill="rgba(255,255,255,0.75)"/>
        </svg>
      </div>
    </div>

    <!-- Dots -->
    <div class="swipe-dots" id="swipeDots"></div>
  </main>

  <!-- Lightbox -->
  <div class="overlay" id="lightbox">
    <figure>
      <img id="lightboxImage" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <!-- Editor -->
  <aside class="editor" id="editorPanel" aria-hidden="true">
    <div class="editor-head"><h2>编辑</h2><button class="secondary" id="closeEditor" type="button">关闭</button></div>
    <section class="panel">
      <h3>管理员登录</h3>
      <div class="session-line"><span id="sessionText">未登录</span><button class="secondary small" id="signOutBtn" type="button" hidden>退出</button></div>
      <form id="loginForm">
        <div class="field"><label for="emailInput">邮箱</label><input id="emailInput" type="email" autocomplete="username"></div>
        <div class="field"><label for="passwordInput">密码</label><input id="passwordInput" type="password" autocomplete="current-password"></div>
        <div class="row"><button id="signInBtn" type="submit">登录</button></div>
      </form>
      <div class="status" id="authStatus"></div>
    </section>
    <section class="panel">
      <h3>背景音乐</h3>
      <div class="field"><label for="musicInput">音频直链</label><input id="musicInput" type="url" placeholder="https://example.com/music.mp3"></div>
      <div class="row"><button id="saveSettingsBtn" type="button">保存</button><button class="secondary" id="musicToggle" type="button" hidden>播放</button></div>
      <div class="status" id="settingsStatus"></div>
    </section>
    <section class="panel">
      <h3>上传图片</h3>
      <p>图片会自动优化压缩，上传快速且放大清晰。</p>
      <div class="field"><label for="uploadInput">选择图片</label><input id="uploadInput" type="file" accept="image/*" multiple></div>
      <div class="field"><label for="captionsInput">每行一句话，按图片顺序对应</label><textarea id="captionsInput" placeholder="第一张图的一句话&#10;第二张图的一句话"></textarea></div>
      <div class="row"><button id="uploadBtn" type="button">上传到云端</button></div>
      <div class="status" id="uploadStatus"></div>
    </section>
    <section class="panel">
      <h3>图片管理</h3>
      <div class="manage-list" id="manageList"></div>
      <div class="manage-empty" id="manageEmpty">还没有图片。</div>
      <div class="status" id="manageStatus"></div>
    </section>
  </aside>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const CONFIG = {
      SUPABASE_URL: "https://pnzbcsnoqrmtdkxyxfms.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_BZMrBawoq266rDTBEcIXRQ_yCrQPJ8C",
      ALBUM_SLUG: "main",
      IMAGES_BUCKET: "wall-images",
      MAX_UPLOAD_EDGE: 1200,
      TARGET_UPLOAD_BYTES: 200 * 1024,
      MAX_UPLOAD_QUALITY: 0.72,
      MIN_UPLOAD_QUALITY: 0.40,
      USE_IMAGE_TRANSFORMS: true,
      WALL_IMAGE_WIDTH: 260,
      WALL_IMAGE_HEIGHT: 340,
      WALL_IMAGE_QUALITY: 35,
      LIGHTBOX_IMAGE_WIDTH: 1280,
      LIGHTBOX_IMAGE_QUALITY: 82,
    };

    // ── DOM ──
    const stage = document.getElementById("stage");
    const track = document.getElementById("track");
    const viewport = document.getElementById("viewport");
    const swipeDots = document.getElementById("swipeDots");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const editorPanel = document.getElementById("editorPanel");
    const closeEditor = document.getElementById("closeEditor");
    const sessionText = document.getElementById("sessionText");
    const signOutBtn = document.getElementById("signOutBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authStatus = document.getElementById("authStatus");
    const musicInput = document.getElementById("musicInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const musicToggle = document.getElementById("musicToggle");
    const settingsStatus = document.getElementById("settingsStatus");
    const uploadInput = document.getElementById("uploadInput");
    const captionsInput = document.getElementById("captionsInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const manageList = document.getElementById("manageList");
    const manageEmpty = document.getElementById("manageEmpty");
    const manageStatus = document.getElementById("manageStatus");

    // ── State ──
    let supabase = null;
    let currentSession = null;
    let currentImages = [];
    let audioElement = null;
    let totalCols = 0;
    let activeCol = 0;
    let isAutoSliding = false;
    let autoSlideTimer = null;
    let planeCycleTimer = null;
    let tapCount = 0;
    let tapTimer = null;
    let pendingLightboxTimeout = 0;
    let longPressTimer = 0;
    let swipeX0 = 0;
    let swipeY0 = 0;
    let swipeActive = false;

    init();

    async function init() {
      supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      bindUi();
      updateAuthUi();
      await refreshSession();
      await loadSettings();
      await loadWall();
    }

    function bindUi() {
      closeEditor.addEventListener("click", closeEditorPanel);
      lightbox.addEventListener("click", closeLightbox);
      musicToggle.addEventListener("click", toggleMusicPlayback);
      track.addEventListener("click", onTrackClick);

      viewport.addEventListener("touchstart", onSwipeStart, { passive: true });
      viewport.addEventListener("touchmove", onSwipeMove, { passive: true });
      viewport.addEventListener("touchend", onSwipeEnd, { passive: true });

      stage.addEventListener("pointerup", onStageTap, { passive: true });
      stage.addEventListener("pointerdown", onStagePressStart, { passive: true });
      stage.addEventListener("pointermove", onStagePressEnd, { passive: true });
      stage.addEventListener("pointercancel", onStagePressEnd, { passive: true });
      stage.addEventListener("pointerleave", onStagePressEnd, { passive: true });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { closeEditorPanel(); closeLightbox(); }
        if (e.key === "ArrowLeft") slideTo(activeCol - 1);
        if (e.key === "ArrowRight") slideTo(activeCol + 1);
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setAuthStatus("正在登录...");
        const { error } = await supabase.auth.signInWithPassword({ email: emailInput.value.trim(), password: passwordInput.value });
        if (error) { setAuthStatus(`登录失败：${error.message}`); return; }
        passwordInput.value = "";
        setAuthStatus("登录成功。");
        await refreshSession();
      });

      signOutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        currentSession = null;
        updateAuthUi();
        setAuthStatus("已退出登录。");
      });

      saveSettingsBtn.addEventListener("click", saveSettings);
      uploadBtn.addEventListener("click", uploadImages);
    }

    // ── Swipe ──
    function onSwipeStart(e) {
      if (editorPanel.classList.contains("open")) return;
      swipeX0 = e.touches[0].clientX;
      swipeY0 = e.touches[0].clientY;
      swipeActive = false;
    }
    function onSwipeMove(e) {
      if (!swipeX0) return;
      const dx = e.touches[0].clientX - swipeX0;
      const dy = e.touches[0].clientY - swipeY0;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) swipeActive = true;
    }
    function onSwipeEnd(e) {
      if (!swipeActive || !swipeX0) { swipeX0 = 0; return; }
      const dx = (e.changedTouches[0]?.clientX || 0) - swipeX0;
      swipeX0 = 0;
      if (Math.abs(dx) > 40) slideTo(dx < 0 ? activeCol + 1 : activeCol - 1);
    }

    function onTrackClick(e) {
      const card = e.target.closest(".card");
      if (!card) return;
      const idx = parseInt(card.dataset.img);
      if (!isNaN(idx) && currentImages[idx]) {
        scheduleLightboxOpen(currentImages[idx], idx);
      }
    }

    // ── Navigation ──
    function slideTo(col) {
      if (totalCols <= 3) return;
      const maxCol = totalCols - 3;
      activeCol = Math.max(0, Math.min(col, maxCol));
      track.classList.remove("instant");
      track.style.transform = `translateX(-${activeCol * (100 / 3)}%)`;
      updateDots();
      // Trigger enter animation on newly visible column
      animateEnteringCards();
    }

    function updateDots() {
      const maxCol = totalCols - 3;
      const pages = maxCol + 1;
      swipeDots.innerHTML = "";
      if (pages <= 1) return;
      for (let i = 0; i < pages; i++) {
        const d = document.createElement("span");
        d.className = "swipe-dot" + (i === activeCol ? " active" : "");
        swipeDots.appendChild(d);
      }
    }

    function animateEnteringCards() {
      // Cards in the rightmost visible column get an enter animation
      const rightCol = activeCol + 2; // 0-indexed, so visible cols are activeCol, activeCol+1, activeCol+2
      const columns = track.querySelectorAll(".column");
      columns.forEach(col => {
        const colIdx = parseInt(col.dataset.col);
        if (colIdx === rightCol) {
          col.querySelectorAll(".card").forEach(c => {
            if (!c.classList.contains("exiting")) {
              c.classList.add("entering");
              setTimeout(() => c.classList.remove("entering"), 500);
            }
          });
        }
      });
    }

    // ── Auto-slide (triggered while plane hovers) ──
    const PLANE_CYCLE = 12000;
    const PAUSE_START = 0.42 * PLANE_CYCLE;
    const PAUSE_END = 0.68 * PLANE_CYCLE;
    const SLIDE_INTERVAL = 2000;

    function startPlaneSync() {
      function tick() {
        const t = Date.now() % PLANE_CYCLE;
        const wasSliding = isAutoSliding;
        const inPause = t >= PAUSE_START && t < PAUSE_END;

        if (inPause && totalCols > 3 && activeCol < totalCols - 3) {
          if (!isAutoSliding) {
            isAutoSliding = true;
            scheduleNextSlide();
          }
        } else if (!inPause && isAutoSliding) {
          stopAutoSlide();
        }

        planeCycleTimer = setTimeout(tick, 400);
      }
      planeCycleTimer = setTimeout(tick, 400);
    }

    function scheduleNextSlide() {
      if (!isAutoSliding) return;
      autoSlideTimer = setTimeout(() => {
        if (activeCol < totalCols - 3) {
          slideTo(activeCol + 1);
        }
        if (activeCol >= totalCols - 3) {
          stopAutoSlide();
          return;
        }
        scheduleNextSlide();
      }, SLIDE_INTERVAL);
    }

    function stopAutoSlide() {
      isAutoSliding = false;
      clearTimeout(autoSlideTimer);
      autoSlideTimer = null;
    }

    // ── Lightbox ──
    function scheduleLightboxOpen(image, index) {
      cancelPendingLightbox();
      pendingLightboxTimeout = window.setTimeout(() => {
        pendingLightboxTimeout = 0;
        if (!editorPanel.classList.contains("open")) openLightbox(image, index);
      }, 300);
    }
    function cancelPendingLightbox() {
      if (!pendingLightboxTimeout) return;
      window.clearTimeout(pendingLightboxTimeout);
      pendingLightboxTimeout = 0;
    }
    function openLightbox(image, index) {
      lightboxImage.alt = image.caption || `图片 ${index + 1}`;
      lightboxCaption.textContent = image.caption || "";
      lightbox.classList.add("open");
      lightboxImage.src = image.fullUrl || image.originalUrl;
      lightboxImage.onerror = () => {
        if (lightboxImage.src !== image.originalUrl) lightboxImage.src = image.originalUrl;
      };
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
      lightboxImage.alt = "";
      lightboxCaption.textContent = "";
    }

    // ── Editor ──
    function onStageTap(e) {
      if (editorPanel.contains(e.target) || lightbox.contains(e.target)) return;
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 700);
      if (tapCount >= 3) {
        tapCount = 0;
        cancelPendingLightbox();
        onStagePressEnd();
        openEditorPanel();
      }
    }
    function onStagePressStart(e) {
      if (editorPanel.contains(e.target) || lightbox.contains(e.target)) return;
      onStagePressEnd();
      longPressTimer = window.setTimeout(() => {
        longPressTimer = 0;
        tapCount = 0;
        cancelPendingLightbox();
        openEditorPanel();
      }, 650);
    }
    function onStagePressEnd() {
      if (!longPressTimer) return;
      window.clearTimeout(longPressTimer);
      longPressTimer = 0;
    }
    function openEditorPanel() {
      editorPanel.classList.add("open");
      editorPanel.setAttribute("aria-hidden", "false");
    }
    function closeEditorPanel() {
      editorPanel.classList.remove("open");
      editorPanel.setAttribute("aria-hidden", "true");
    }

    // ── Auth ──
    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) { setAuthStatus(`会话读取失败：${error.message}`); return; }
      currentSession = data.session;
      updateAuthUi();
    }
    function updateAuthUi() {
      const loggedIn = Boolean(currentSession?.user);
      sessionText.textContent = loggedIn ? `当前账号：${currentSession.user.email}` : "未登录";
      signOutBtn.hidden = !loggedIn;
      loginForm.hidden = loggedIn;
      saveSettingsBtn.disabled = !loggedIn;
      uploadBtn.disabled = !loggedIn;
      uploadInput.disabled = !loggedIn;
      captionsInput.disabled = !loggedIn;
      renderManageList();
    }

    async function loadSettings() {
      const { data, error } = await supabase.from("album_settings").select("music_url").eq("slug", CONFIG.ALBUM_SLUG).maybeSingle();
      if (error) { setSettingsStatus(`读取设置失败：${error.message}`); return; }
      musicInput.value = data?.music_url || "";
      syncMusic(data?.music_url || "");
    }
    function syncMusic(url) {
      if (audioElement) { audioElement.pause(); audioElement.remove(); audioElement = null; }
      if (!url) { musicToggle.hidden = true; musicToggle.textContent = "播放"; return; }
      audioElement = document.createElement("audio");
      audioElement.src = url; audioElement.loop = true; audioElement.preload = "none";
      document.body.appendChild(audioElement);
      musicToggle.hidden = false;
      musicToggle.textContent = "播放";
    }
    async function toggleMusicPlayback() {
      if (!audioElement) return;
      if (audioElement.paused) {
        try { await audioElement.play(); musicToggle.textContent = "暂停"; }
        catch { setSettingsStatus("音频无法播放，请检查链接。"); }
      } else { audioElement.pause(); musicToggle.textContent = "播放"; }
    }
    async function saveSettings() {
      if (!currentSession?.user) { setSettingsStatus("先登录，再保存。"); return; }
      setSettingsStatus("正在保存...");
      const { error } = await supabase.from("album_settings").upsert({ slug: CONFIG.ALBUM_SLUG, music_url: musicInput.value.trim() }, { onConflict: "slug" });
      if (error) { setSettingsStatus(`保存失败：${error.message}`); return; }
      syncMusic(musicInput.value.trim());
      setSettingsStatus("已保存。");
    }

    // ── Wall ──
    async function loadWall() {
      const { data, error } = await supabase
        .from("album_images")
        .select("id, title, file_path, sort_order, created_at")
        .eq("album_slug", CONFIG.ALBUM_SLUG)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });
      if (error) { setManageStatus(`读取图片失败：${error.message}`); return; }

      currentImages = (data || []).map(item => {
        const originalUrl = getPublicUrl(item.file_path);
        return {
          ...item,
          caption: item.title || "",
          originalUrl,
          wallUrl: getWallUrl(item.file_path, originalUrl),
          fullUrl: getFullUrl(item.file_path, originalUrl),
        };
      });

      buildTrack();
      renderManageList();
    }

    function getWallUrl(fp, fb) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fb;
      return getPublicUrl(fp, { transform: { width: CONFIG.WALL_IMAGE_WIDTH, height: CONFIG.WALL_IMAGE_HEIGHT, quality: CONFIG.WALL_IMAGE_QUALITY, resize: "cover" } });
    }
    function getFullUrl(fp, fb) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fb;
      return getPublicUrl(fp, { transform: { width: CONFIG.LIGHTBOX_IMAGE_WIDTH, quality: CONFIG.LIGHTBOX_IMAGE_QUALITY, resize: "contain" } });
    }
    function getPublicUrl(fp, opts) {
      const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(fp, opts);
      return data.publicUrl;
    }

    // ── Build track ──
    function buildTrack() {
      track.innerHTML = "";
      stopAutoSlide();
      activeCol = 0;

      // Group images into columns of 2 (top + bottom = 2 rows)
      const cols = [];
      for (let i = 0; i < currentImages.length; i += 2) {
        cols.push({
          top: currentImages[i],
          bottom: currentImages[i + 1] || null,
          topIdx: i,
          bottomIdx: i + 1 < currentImages.length ? i + 1 : -1,
        });
      }

      totalCols = cols.length;

      if (totalCols === 0) {
        const empty = document.createElement("div");
        empty.className = "column";
        empty.style.flex = "0 0 100%";
        empty.style.justifyContent = "center";
        empty.style.alignItems = "center";
        empty.innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:15px;text-align:center">还没有照片<br><span style="font-size:12px">三连击进入编辑</span></div>';
        track.appendChild(empty);
        return;
      }

      // Ensure at least 3 columns visible (pad with empty columns if needed)
      const displayCols = Math.max(3, totalCols);

      for (let c = 0; c < displayCols; c++) {
        const col = document.createElement("div");
        col.className = "column";
        col.dataset.col = String(c);

        const data = c < totalCols ? cols[c] : null;

        // Top card
        const topCard = data && data.top
          ? createCard(data.top, data.topIdx)
          : createPlaceholder();
        col.appendChild(topCard);

        // Bottom card
        const botCard = data && data.bottom
          ? createCard(data.bottom, data.bottomIdx)
          : createPlaceholder();
        col.appendChild(botCard);

        track.appendChild(col);
      }

      track.style.transform = "translateX(0%)";
      updateDots();
      startPlaneSync();
    }

    function createCard(image, index) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.img = String(index);

      const img = document.createElement("img");
      img.alt = image.caption || `图片 ${index + 1}`;
      img.loading = "lazy";
      img.decoding = "async";

      // Lazy load via IntersectionObserver
      const obs = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          img.src = image.wallUrl || image.originalUrl;
          obs.unobserve(card);
        }
      }, { rootMargin: "300px" });
      obs.observe(card);

      img.addEventListener("load", () => card.classList.add("loaded"), { once: true });
      img.addEventListener("error", () => {
        if (img.src !== image.originalUrl) { img.src = image.originalUrl; return; }
        card.classList.add("loaded");
      });

      card.appendChild(img);
      return card;
    }

    function createPlaceholder() {
      const card = document.createElement("div");
      card.className = "card";
      card.style.visibility = "hidden";
      return card;
    }

    // ── Upload ──
    async function uploadImages() {
      if (!currentSession?.user) { setUploadStatus("先登录，再上传图片。"); return; }
      const files = Array.from(uploadInput.files || []).filter(f => f.type.startsWith("image/"));
      if (!files.length) { setUploadStatus("先选择至少一张图片。"); return; }

      const captions = captionsInput.value.split(/\r?\n/).map(l => l.trim());
      const baseOrder = currentImages.length ? Math.max(...currentImages.map(it => it.sort_order || 0)) + 1 : 1;
      const rows = [];

      setUploadStatus(`准备上传 ${files.length} 张图片...`);

      for (const [i, file] of files.entries()) {
        setUploadStatus(`正在压缩并上传第 ${i + 1} / ${files.length} 张...`);
        const prepared = await prepareUploadFile(file);
        const fp = `${CONFIG.ALBUM_SLUG}/${Date.now()}-${crypto.randomUUID()}-${sanitizeFileName(prepared.name)}`;
        const up = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(fp, prepared, { cacheControl: "31536000", upsert: false });
        if (up.error) { setUploadStatus(`上传失败：${up.error.message}`); return; }
        rows.push({ album_slug: CONFIG.ALBUM_SLUG, title: captions[i] || "", file_path: fp, sort_order: baseOrder + i });
      }

      const ins = await supabase.from("album_images").insert(rows);
      if (ins.error) {
        await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove(rows.map(r => r.file_path));
        setUploadStatus(`写入图片记录失败：${ins.error.message}`);
        return;
      }

      uploadInput.value = "";
      captionsInput.value = "";
      setUploadStatus(`已上传 ${files.length} 张图片。`);
      await loadWall();
    }

    async function prepareUploadFile(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") return file;
      try {
        const bitmap = await loadBitmap(file);
        let { width, height } = fitSize(bitmap.width, bitmap.height, CONFIG.MAX_UPLOAD_EDGE);
        let quality = CONFIG.MAX_UPLOAD_QUALITY;
        let blob = null;
        for (let a = 0; a < 6; a++) {
          const cv = document.createElement("canvas");
          cv.width = width; cv.height = height;
          cv.getContext("2d", { alpha: true }).drawImage(bitmap, 0, 0, width, height);
          blob = await canvasToBlob(cv, "image/webp", quality);
          if (blob && blob.size <= CONFIG.TARGET_UPLOAD_BYTES) break;
          if (quality > CONFIG.MIN_UPLOAD_QUALITY) { quality = Math.max(CONFIG.MIN_UPLOAD_QUALITY, quality - 0.05); }
          else { width = Math.max(500, Math.round(width * 0.88)); height = Math.max(500, Math.round(height * 0.88)); }
        }
        if (typeof bitmap.close === "function") bitmap.close();
        if (!blob || blob.size >= file.size * 0.96) return file;
        return new File([blob], `${file.name.replace(/\.[^.]+$/, "") || "photo"}.webp`, { type: "image/webp", lastModified: Date.now() });
      } catch (e) { console.warn("Compress skip:", e); return file; }
    }

    async function loadBitmap(file) {
      if (typeof createImageBitmap === "function") return createImageBitmap(file);
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.src = u; await img.decode(); URL.revokeObjectURL(u);
      return img;
    }

    function fitSize(w, h, max) {
      const L = Math.max(w, h);
      if (L <= max) return { width: w, height: h };
      const s = max / L;
      return { width: Math.max(1, Math.round(w * s)), height: Math.max(1, Math.round(h * s)) };
    }

    function canvasToBlob(c, t, q) { return new Promise(r => c.toBlob(r, t, q)); }
    function sanitizeFileName(n) { return n.replace(/[^a-zA-Z0-9._-]/g, "-"); }

    // ── Manage ──
    function renderManageList() {
      manageList.innerHTML = "";
      const loggedIn = Boolean(currentSession?.user);
      if (!loggedIn) { manageEmpty.hidden = false; manageEmpty.textContent = "先登录，再管理图片。"; return; }
      if (!currentImages.length) { manageEmpty.hidden = false; manageEmpty.textContent = "还没有图片。"; return; }
      manageEmpty.hidden = true;

      currentImages.forEach((img, i) => {
        const card = document.createElement("article");
        card.className = "manage-card";
        const pv = document.createElement("img");
        pv.src = img.wallUrl; pv.alt = img.caption || `图片 ${i + 1}`; pv.loading = "lazy";
        pv.onerror = () => { if (pv.src !== img.originalUrl) pv.src = img.originalUrl; };

        const right = document.createElement("div");
        const fld = document.createElement("div"); fld.className = "field";
        fld.innerHTML = `<label>图片 ${i + 1} 的一句话</label>`;
        const inp = document.createElement("textarea");
        inp.value = img.caption || ""; inp.maxLength = 120; inp.rows = 3;
        fld.appendChild(inp);

        const row = document.createElement("div"); row.className = "row";
        const sb = document.createElement("button"); sb.className = "secondary small"; sb.type = "button"; sb.textContent = "保存句子";
        sb.addEventListener("click", async () => { await updateImage(img.id, { title: inp.value.trim() }, "句子已保存。"); });

        const ub = document.createElement("button"); ub.className = "secondary small"; ub.type = "button"; ub.textContent = "前移"; ub.disabled = i === 0;
        ub.addEventListener("click", async () => { await moveImage(i, i - 1); });

        const db = document.createElement("button"); db.className = "secondary small"; db.type = "button"; db.textContent = "后移"; db.disabled = i === currentImages.length - 1;
        db.addEventListener("click", async () => { await moveImage(i, i + 1); });

        const del = document.createElement("button"); del.className = "small"; del.type = "button"; del.textContent = "删除";
        del.addEventListener("click", async () => { await deleteImage(img); });

        row.append(sb, ub, db, del);
        right.append(fld, row);
        card.append(pv, right);
        manageList.appendChild(card);
      });
    }

    async function updateImage(id, patch, msg) {
      if (!currentSession?.user) { setManageStatus("先登录，再编辑图片。"); return; }
      setManageStatus("正在保存...");
      const { error } = await supabase.from("album_images").update(patch).eq("id", id);
      if (error) { setManageStatus(`保存失败：${error.message}`); return; }
      setManageStatus(msg);
      await loadWall();
    }

    async function moveImage(from, to) {
      if (!currentSession?.user) { setManageStatus("先登录，再调整顺序。"); return; }
      const src = currentImages[from], tgt = currentImages[to];
      if (!src || !tgt) return;
      setManageStatus("正在调整顺序...");
      const so = src.sort_order || from + 1, to_ = tgt.sort_order || to + 1;
      const f = await supabase.from("album_images").update({ sort_order: to_ }).eq("id", src.id);
      if (f.error) { setManageStatus(`调整失败：${f.error.message}`); return; }
      const s = await supabase.from("album_images").update({ sort_order: so }).eq("id", tgt.id);
      if (s.error) { setManageStatus(`调整失败：${s.error.message}`); return; }
      setManageStatus("顺序已更新。");
      await loadWall();
    }

    async function deleteImage(image) {
      if (!currentSession?.user) { setManageStatus("先登录，再删除图片。"); return; }
      if (!window.confirm("确认删除这张图片吗？")) return;
      setManageStatus("正在删除...");
      const r = await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove([image.file_path]);
      if (r.error) { setManageStatus(`删除云端图片失败：${r.error.message}`); return; }
      const d = await supabase.from("album_images").delete().eq("id", image.id);
      if (d.error) { setManageStatus(`删除图片记录失败：${d.error.message}`); return; }
      setManageStatus("图片已删除。");
      await loadWall();
    }

    function setAuthStatus(m) { authStatus.textContent = m; }
    function setSettingsStatus(m) { settingsStatus.textContent = m; }
    function setUploadStatus(m) { uploadStatus.textContent = m; }
    function setManageStatus(m) { manageStatus.textContent = m; }
  </script>
</body>
</html>
