<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>照片墙</title>
  <style>
    :root {
      --bg: #02050b;
      --panel: rgba(8, 13, 24, 0.92);
      --line: rgba(175, 194, 255, 0.12);
      --text: #eef2ff;
      --muted: #98a9d8;
      --accent: #9ab5ff;
      --accent-2: #f3aff7;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(97, 122, 255, 0.16), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(244, 149, 255, 0.1), transparent 24%),
        linear-gradient(180deg, #03060d 0%, #02050a 52%, #010207 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background-image:
        radial-gradient(circle at 8% 14%, rgba(255, 255, 255, 0.94) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 21% 68%, rgba(255, 255, 255, 0.78) 0 1.1px, transparent 1.4px),
        radial-gradient(circle at 33% 28%, rgba(255, 255, 255, 0.86) 0 1px, transparent 1.3px),
        radial-gradient(circle at 48% 18%, rgba(255, 255, 255, 0.74) 0 1.2px, transparent 1.5px),
        radial-gradient(circle at 63% 62%, rgba(255, 255, 255, 0.72) 0 1.2px, transparent 1.5px),
        radial-gradient(circle at 78% 24%, rgba(255, 255, 255, 0.86) 0 1.1px, transparent 1.4px),
        radial-gradient(circle at 88% 76%, rgba(255, 255, 255, 0.7) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 15% 88%, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.2px);
      animation: starsFloat 20s linear infinite;
      opacity: 0.9;
    }

    body::after {
      background:
        radial-gradient(circle at 50% 50%, rgba(151, 180, 255, 0.06), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0) 47%, rgba(137, 162, 255, 0.06) 50%, rgba(255, 255, 255, 0) 53%);
      filter: blur(18px);
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) clamp(116px, 18vh, 160px) minmax(0, 1fr);
      gap: 6px;
      padding: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .band {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
    }

    .rail {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .rail::-webkit-scrollbar {
      display: none;
    }

    .rail.compact {
      justify-content: center;
    }

    .tile {
      --tilt: 0deg;
      --delay: 0ms;
      flex: 0 0 clamp(118px, 28vw, 170px);
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      padding: 8px 8px 10px;
      border: 1px solid rgba(222, 232, 255, 0.16);
      background:
        linear-gradient(180deg, rgba(226, 235, 255, 0.16), rgba(123, 146, 203, 0.12)),
        linear-gradient(180deg, rgba(10, 15, 26, 0.92), rgba(5, 9, 18, 0.98));
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 18px 38px rgba(0, 0, 0, 0.34);
      transform: translateY(10px) scale(1.08) rotate(var(--tilt));
      opacity: 0;
      cursor: pointer;
      scroll-snap-align: center;
      will-change: transform, opacity;
    }

    .top .tile {
      --tilt: -1.2deg;
    }

    .bottom .tile {
      --tilt: 1.2deg;
    }

    .tile.visible {
      animation: tileBackAway 0.9s cubic-bezier(0.2, 0.75, 0.2, 1) forwards;
      animation-delay: var(--delay);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 8px 8px 10px;
      border-radius: 16px;
      background:
        linear-gradient(108deg, rgba(255, 255, 255, 0) 12%, rgba(149, 178, 255, 0.18) 38%, rgba(255, 255, 255, 0) 66%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0));
      transform: translateX(-140%);
      opacity: 0;
      z-index: 2;
      pointer-events: none;
    }

    .tile.visible::before {
      opacity: 1;
      animation: trailSweep 0.9s ease-out forwards;
      animation-delay: var(--delay);
    }

    .tile-plane {
      position: absolute;
      top: 14px;
      left: -62px;
      width: 48px;
      height: 18px;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 4px 10px rgba(151, 180, 255, 0.28));
    }

    .tile-plane svg {
      width: 100%;
      height: 100%;
      fill: rgba(245, 247, 255, 0.95);
    }

    .tile.visible .tile-plane {
      animation: tilePlaneFly 0.95s ease-out forwards;
      animation-delay: var(--delay);
    }

    .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(224, 234, 255, 0.18);
      background: linear-gradient(180deg, #11192a, #070d17);
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .tile.loaded img {
      opacity: 1;
    }

    .caption {
      display: none;
    }

    .runway {
      position: relative;
      overflow: hidden;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(9, 14, 25, 0.28), rgba(7, 10, 19, 0.34));
    }

    .runway::before {
      content: "";
      position: absolute;
      inset: 50% 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(165, 191, 255, 0.68), rgba(255, 255, 255, 0));
      transform: translateY(-50%);
    }

    .runway-plane {
      position: absolute;
      top: 50%;
      left: -96px;
      width: 102px;
      height: 40px;
      transform: translateY(-50%);
      filter: drop-shadow(0 8px 20px rgba(142, 171, 255, 0.34));
      animation: runwayPlane 11s linear infinite;
    }

    .runway-plane svg {
      width: 100%;
      height: 100%;
      fill: rgba(245, 248, 255, 0.96);
    }

    .runway-plane::after {
      content: "";
      position: absolute;
      top: 50%;
      left: -220px;
      width: 240px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(166, 192, 255, 0.82), rgba(255, 255, 255, 0));
      transform: translateY(-50%);
      opacity: 0.84;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(2, 4, 10, 0.92);
      backdrop-filter: blur(10px);
      z-index: 25;
    }

    .overlay.open {
      display: grid;
    }

    .overlay figure {
      margin: 0;
      width: min(1080px, 100%);
    }

    .overlay img {
      display: block;
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 26px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .overlay figcaption {
      margin-top: 10px;
      text-align: center;
      color: #e8edff;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .editor {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(460px, 100%);
      padding: 18px;
      background: linear-gradient(180deg, rgba(7, 12, 24, 0.98), rgba(6, 10, 18, 0.98));
      border-left: 1px solid rgba(175, 194, 255, 0.12);
      box-shadow: -18px 0 40px rgba(0, 0, 0, 0.32);
      transform: translateX(100%);
      transition: transform 0.24s ease;
      z-index: 30;
      overflow-y: auto;
      backdrop-filter: blur(16px);
    }

    .editor.open {
      transform: translateX(0);
    }

    .editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .editor-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .panel {
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 22px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .panel p,
    .manage-empty,
    .status-note,
    .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(154, 181, 255, 0.42);
      box-shadow: 0 0 0 4px rgba(154, 181, 255, 0.12);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .session-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 13px;
    }

    .manage-list {
      display: grid;
      gap: 12px;
    }

    .manage-card {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .manage-card img {
      display: block;
      width: 74px;
      height: 74px;
      object-fit: cover;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #07101f;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(148, 175, 255, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(148, 175, 255, 0.28);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(175, 194, 255, 0.14);
      box-shadow: none;
    }

    button.small {
      padding: 9px 12px;
      font-size: 13px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    @media (max-width: 860px) {
      .tile {
        flex-basis: clamp(108px, 27vw, 148px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .tile,
      .tile img {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    @keyframes starsFloat {
      from { transform: translateY(0); }
      50% { transform: translateY(8px); }
      to { transform: translateY(0); }
    }

    @keyframes runwayPlane {
      0% {
        transform: translate(-4vw, -50%) rotate(-8deg);
        opacity: 0;
      }
      8%, 76% {
        opacity: 1;
      }
      100% {
        transform: translate(112vw, -50%) rotate(5deg);
        opacity: 0;
      }
    }

    @keyframes tileBackAway {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(1.08) rotate(var(--tilt));
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(var(--tilt));
      }
    }

    @keyframes trailSweep {
      0% { transform: translateX(-140%); }
      100% { transform: translateX(140%); }
    }

    @keyframes tilePlaneFly {
      0% {
        opacity: 0;
        transform: translate(-10px, 8px) rotate(-14deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(228px, -10px) rotate(8deg);
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <section class="band top">
      <div class="rail" id="topRail"></div>
    </section>

    <section class="runway">
      <div class="runway-plane" id="runwayPlane" aria-hidden="true">
        <svg viewBox="0 0 96 40"><path d="M4 20 92 6 64 20 92 34 55 25 40 36 43 24 4 20Z"/></svg>
      </div>
    </section>

    <section class="band bottom">
      <div class="rail" id="bottomRail"></div>
    </section>
  </main>

  <div class="overlay" id="lightbox">
    <figure>
      <img id="lightboxImage" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <aside class="editor" id="editorPanel" aria-hidden="true">
    <div class="editor-head">
      <h2>编辑</h2>
      <button class="secondary" id="closeEditor" type="button">关闭</button>
    </div>

    <section class="panel">
      <h3>管理员登录</h3>
      <div class="session-line">
        <span id="sessionText">未登录</span>
        <button class="secondary small" id="signOutBtn" type="button" hidden>退出</button>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="emailInput">邮箱</label>
          <input id="emailInput" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="passwordInput">密码</label>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </div>
        <div class="row">
          <button id="signInBtn" type="submit">登录</button>
        </div>
      </form>
      <div class="status" id="authStatus"></div>
    </section>

    <section class="panel">
      <h3>背景音乐</h3>
      <div class="field">
        <label for="musicInput">音频直链</label>
        <input id="musicInput" type="url" placeholder="https://example.com/music.mp3">
      </div>
      <div class="row">
        <button id="saveSettingsBtn" type="button">保存</button>
        <button class="secondary" id="musicToggle" type="button" hidden>播放</button>
      </div>
      <div class="status" id="settingsStatus"></div>
    </section>

    <section class="panel">
      <h3>上传图片</h3>
      <p>为了尽可能快，这里会把新图压到更小。旧图不会自动变快，想提速需要删掉后重新上传。</p>
      <div class="field">
        <label for="uploadInput">选择图片</label>
        <input id="uploadInput" type="file" accept="image/*" multiple>
      </div>
      <div class="field">
        <label for="captionsInput">每行一句话，按图片顺序对应</label>
        <textarea id="captionsInput" placeholder="第一张图的一句话&#10;第二张图的一句话"></textarea>
      </div>
      <div class="row">
        <button id="uploadBtn" type="button">上传到云端</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </section>

    <section class="panel">
      <h3>图片管理</h3>
      <div class="manage-list" id="manageList"></div>
      <div class="manage-empty" id="manageEmpty">还没有图片。</div>
      <div class="status" id="manageStatus"></div>
    </section>
  </aside>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const CONFIG = {
      SUPABASE_URL: "https://pnzbcsnoqrmtdkxyxfms.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_BZMrBawoq266rDTBEcIXRQ_yCrQPJ8C",
      ALBUM_SLUG: "main",
      IMAGES_BUCKET: "wall-images",
      MAX_UPLOAD_EDGE: 960,
      TARGET_UPLOAD_BYTES: 350 * 1024,
      MAX_UPLOAD_QUALITY: 0.68,
      MIN_UPLOAD_QUALITY: 0.46,
      RUNWAY_CYCLE_MS: 11000,
      RUNWAY_ENTRY_LEAD_MS: 680,
      REVEAL_STEP_MS: 110,
      USE_IMAGE_TRANSFORMS: true,
      WALL_IMAGE_WIDTH: 320,
      WALL_IMAGE_HEIGHT: 420,
      WALL_IMAGE_QUALITY: 38,
      LIGHTBOX_IMAGE_WIDTH: 1280,
      LIGHTBOX_IMAGE_QUALITY: 64,
    };

    const topRail = document.getElementById("topRail");
    const bottomRail = document.getElementById("bottomRail");
    const stage = document.getElementById("stage");
    const runway = document.querySelector(".runway");
    const runwayPlane = document.getElementById("runwayPlane");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const editorPanel = document.getElementById("editorPanel");
    const closeEditor = document.getElementById("closeEditor");
    const sessionText = document.getElementById("sessionText");
    const signOutBtn = document.getElementById("signOutBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authStatus = document.getElementById("authStatus");
    const musicInput = document.getElementById("musicInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const musicToggle = document.getElementById("musicToggle");
    const settingsStatus = document.getElementById("settingsStatus");
    const uploadInput = document.getElementById("uploadInput");
    const captionsInput = document.getElementById("captionsInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const manageList = document.getElementById("manageList");
    const manageEmpty = document.getElementById("manageEmpty");
    const manageStatus = document.getElementById("manageStatus");

    const planeSvg = '<svg viewBox="0 0 96 40" aria-hidden="true"><path d="M4 20 92 6 64 20 92 34 55 25 40 36 43 24 4 20Z"/></svg>';

    let supabase = null;
    let currentSession = null;
    let currentImages = [];
    let audioElement = null;
    let sourceObserver = null;
    let revealSweepRaf = 0;
    let revealTimeouts = [];
    let runwayCycleStartedAt = performance.now();
    let tapCount = 0;
    let tapTimer = null;
    let pendingLightboxTimeout = 0;

    init();

    async function init() {
      supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      bindUi();
      updateAuthUi();
      await refreshSession();
      await loadSettings();
      await loadWall();
    }

    function bindUi() {
      stage.addEventListener("pointerup", onStageTap, { passive: true });
      topRail.addEventListener("scroll", requestRevealSweep, { passive: true });
      bottomRail.addEventListener("scroll", requestRevealSweep, { passive: true });
      window.addEventListener("resize", requestRevealSweep);
      closeEditor.addEventListener("click", closeEditorPanel);
      lightbox.addEventListener("click", closeLightbox);
      musicToggle.addEventListener("click", toggleMusicPlayback);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeEditorPanel();
          closeLightbox();
        }
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setAuthStatus("正在登录...");
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });

        if (error) {
          setAuthStatus(`登录失败：${error.message}`);
          return;
        }

        passwordInput.value = "";
        setAuthStatus("登录成功。");
        await refreshSession();
      });

      signOutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        currentSession = null;
        updateAuthUi();
        setAuthStatus("已退出登录。");
      });

      saveSettingsBtn.addEventListener("click", saveSettings);
      uploadBtn.addEventListener("click", uploadImages);
    }

    function onStageTap(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) {
        return;
      }

      tapCount += 1;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => {
        tapCount = 0;
      }, 700);

      if (tapCount >= 3) {
        tapCount = 0;
        cancelPendingLightbox();
        openEditorPanel();
      }
    }

    function openEditorPanel() {
      editorPanel.classList.add("open");
      editorPanel.setAttribute("aria-hidden", "false");
    }

    function closeEditorPanel() {
      editorPanel.classList.remove("open");
      editorPanel.setAttribute("aria-hidden", "true");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
      lightboxImage.alt = "";
      lightboxCaption.textContent = "";
    }

    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        setAuthStatus(`会话读取失败：${error.message}`);
        return;
      }
      currentSession = data.session;
      updateAuthUi();
    }

    function updateAuthUi() {
      const loggedIn = Boolean(currentSession?.user);
      sessionText.textContent = loggedIn ? `当前账号：${currentSession.user.email}` : "未登录";
      signOutBtn.hidden = !loggedIn;
      loginForm.hidden = loggedIn;
      saveSettingsBtn.disabled = !loggedIn;
      uploadBtn.disabled = !loggedIn;
      uploadInput.disabled = !loggedIn;
      captionsInput.disabled = !loggedIn;
      renderManageList();
    }

    async function loadSettings() {
      const { data, error } = await supabase
        .from("album_settings")
        .select("music_url")
        .eq("slug", CONFIG.ALBUM_SLUG)
        .maybeSingle();

      if (error) {
        setSettingsStatus(`读取设置失败：${error.message}`);
        return;
      }

      musicInput.value = data?.music_url || "";
      syncMusic(data?.music_url || "");
    }

    async function loadWall() {
      const { data, error } = await supabase
        .from("album_images")
        .select("id, title, file_path, sort_order, created_at")
        .eq("album_slug", CONFIG.ALBUM_SLUG)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });

      if (error) {
        setManageStatus(`读取图片失败：${error.message}`);
        return;
      }

      currentImages = (data || []).map((item) => {
        const originalUrl = getPublicUrl(item.file_path);
        return {
          ...item,
          caption: item.title || "",
          originalUrl,
          wallUrl: getWallUrl(item.file_path, originalUrl),
          fullUrl: getFullUrl(item.file_path, originalUrl),
        };
      });

      renderWall();
      renderManageList();
    }

    function getWallUrl(filePath, fallbackUrl) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) {
        return fallbackUrl;
      }

      return getPublicUrl(filePath, {
        transform: {
          width: CONFIG.WALL_IMAGE_WIDTH,
          height: CONFIG.WALL_IMAGE_HEIGHT,
          quality: CONFIG.WALL_IMAGE_QUALITY,
          resize: "cover",
        },
      });
    }

    function getFullUrl(filePath, fallbackUrl) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) {
        return fallbackUrl;
      }

      return getPublicUrl(filePath, {
        transform: {
          width: CONFIG.LIGHTBOX_IMAGE_WIDTH,
          quality: CONFIG.LIGHTBOX_IMAGE_QUALITY,
          resize: "contain",
        },
      });
    }

    function getPublicUrl(filePath, options) {
      const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(filePath, options);
      return data.publicUrl;
    }

    function renderWall() {
      topRail.innerHTML = "";
      bottomRail.innerHTML = "";

      if (sourceObserver) {
        sourceObserver.disconnect();
      }
      clearRevealTimeouts();

      sourceObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) {
            continue;
          }
          startTileLoad(entry.target);
          sourceObserver.unobserve(entry.target);
        }
      }, { rootMargin: "180px" });

      currentImages.forEach((image, index) => {
        const tile = createTile(image, index);
        const targetRail = index % 2 === 0 ? topRail : bottomRail;
        targetRail.appendChild(tile);
        sourceObserver.observe(tile);
      });

      syncRailDensity(topRail);
      syncRailDensity(bottomRail);
      restartRunwayCycle();
    }

    function createTile(image, index) {
      const tile = document.createElement("article");
      tile.className = "tile";
      tile.style.setProperty("--delay", "0ms");
      tile.dataset.wallSrc = image.wallUrl;
      tile.dataset.wallFallback = image.originalUrl;

      const plane = document.createElement("div");
      plane.className = "tile-plane";
      plane.innerHTML = planeSvg;

      const img = document.createElement("img");
      img.alt = image.caption || `图片 ${index + 1}`;
      img.decoding = "async";
      img.loading = "lazy";
      img.addEventListener("load", () => {
        tile.classList.add("loaded");
      }, { once: true });
      img.addEventListener("error", () => {
        if (img.src !== tile.dataset.wallFallback) {
          img.src = tile.dataset.wallFallback;
          return;
        }
        tile.classList.add("loaded");
      });

      const caption = document.createElement("div");
      caption.className = "caption";
      caption.textContent = image.caption || "";

      tile.append(plane, img, caption);
      tile.addEventListener("click", () => scheduleLightboxOpen(image, index));
      return tile;
    }

    function scheduleLightboxOpen(image, index) {
      cancelPendingLightbox();
      pendingLightboxTimeout = window.setTimeout(() => {
        pendingLightboxTimeout = 0;
        if (!editorPanel.classList.contains("open")) {
          openLightbox(image, index);
        }
      }, 520);
    }

    function cancelPendingLightbox() {
      if (!pendingLightboxTimeout) {
        return;
      }
      window.clearTimeout(pendingLightboxTimeout);
      pendingLightboxTimeout = 0;
    }

    function startTileLoad(tile) {
      const img = tile.querySelector("img");
      if (!img || img.src) {
        return;
      }
      img.src = tile.dataset.wallSrc;
    }

    function syncRailDensity(rail) {
      rail.classList.toggle("compact", rail.scrollWidth <= rail.clientWidth + 4);
    }

    function restartRunwayCycle() {
      runwayCycleStartedAt = performance.now();
      runwayPlane.style.animation = "none";
      void runwayPlane.offsetWidth;
      runwayPlane.style.animation = "";
      requestRevealSweep();
    }

    function requestRevealSweep() {
      if (revealSweepRaf) {
        return;
      }

      revealSweepRaf = requestAnimationFrame(() => {
        revealSweepRaf = 0;
        scheduleVisibleReveal();
      });
    }

    function scheduleVisibleReveal() {
      const pendingTiles = [...document.querySelectorAll(".tile")]
        .filter((tile) => !tile.classList.contains("visible"))
        .filter((tile) => tile.dataset.revealScheduled !== "1")
        .filter(isTileVisibleInRail)
        .sort((left, right) => {
          const leftRect = left.getBoundingClientRect();
          const rightRect = right.getBoundingClientRect();
          return (leftRect.left + leftRect.width / 2) - (rightRect.left + rightRect.width / 2);
        });

      for (const [index, tile] of pendingTiles.entries()) {
        const delay = getDelayUntilPlanePass(tile) + index * CONFIG.REVEAL_STEP_MS;
        tile.dataset.revealScheduled = "1";
        const timeoutId = window.setTimeout(() => {
          tile.classList.add("visible");
          delete tile.dataset.revealScheduled;
          startTileLoad(tile);
        }, delay);
        revealTimeouts.push(timeoutId);
      }
    }

    function isTileVisibleInRail(tile) {
      const rail = tile.parentElement;
      if (!rail) {
        return false;
      }

      const tileRect = tile.getBoundingClientRect();
      const railRect = rail.getBoundingClientRect();
      return tileRect.right > railRect.left + 10 && tileRect.left < railRect.right - 10;
    }

    function getDelayUntilPlanePass(tile) {
      const tileRect = tile.getBoundingClientRect();
      const runwayRect = runway.getBoundingClientRect();
      const centerX = tileRect.left + tileRect.width / 2;
      const ratio = clamp((centerX - runwayRect.left) / runwayRect.width, 0, 1);
      const targetElapsed =
        CONFIG.RUNWAY_ENTRY_LEAD_MS +
        ratio * (CONFIG.RUNWAY_CYCLE_MS - CONFIG.RUNWAY_ENTRY_LEAD_MS * 2);
      const elapsed = (performance.now() - runwayCycleStartedAt) % CONFIG.RUNWAY_CYCLE_MS;
      return elapsed <= targetElapsed
        ? targetElapsed - elapsed
        : CONFIG.RUNWAY_CYCLE_MS - elapsed + targetElapsed;
    }

    function clearRevealTimeouts() {
      for (const timeoutId of revealTimeouts) {
        clearTimeout(timeoutId);
      }
      revealTimeouts = [];
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function openLightbox(image, index) {
      lightboxImage.src = image.fullUrl;
      lightboxImage.alt = image.caption || `图片 ${index + 1}`;
      lightboxCaption.textContent = image.caption || "";
      lightbox.classList.add("open");
      lightboxImage.onerror = () => {
        if (lightboxImage.src !== image.originalUrl) {
          lightboxImage.src = image.originalUrl;
        }
      };
    }

    async function saveSettings() {
      if (!currentSession?.user) {
        setSettingsStatus("先登录，再保存。");
        return;
      }

      setSettingsStatus("正在保存...");
      const { error } = await supabase.from("album_settings").upsert({
        slug: CONFIG.ALBUM_SLUG,
        music_url: musicInput.value.trim(),
      }, { onConflict: "slug" });

      if (error) {
        setSettingsStatus(`保存失败：${error.message}`);
        return;
      }

      syncMusic(musicInput.value.trim());
      setSettingsStatus("已保存。");
    }

    function syncMusic(url) {
      if (audioElement) {
        audioElement.pause();
        audioElement.remove();
        audioElement = null;
      }

      if (!url) {
        musicToggle.hidden = true;
        musicToggle.textContent = "播放";
        return;
      }

      audioElement = document.createElement("audio");
      audioElement.src = url;
      audioElement.loop = true;
      audioElement.preload = "none";
      document.body.appendChild(audioElement);
      musicToggle.hidden = false;
      musicToggle.textContent = "播放";
    }

    async function toggleMusicPlayback() {
      if (!audioElement) {
        return;
      }

      if (audioElement.paused) {
        try {
          await audioElement.play();
          musicToggle.textContent = "暂停";
        } catch {
          setSettingsStatus("音频无法播放，请检查链接。");
        }
        return;
      }

      audioElement.pause();
      musicToggle.textContent = "播放";
    }

    async function uploadImages() {
      if (!currentSession?.user) {
        setUploadStatus("先登录，再上传图片。");
        return;
      }

      const files = Array.from(uploadInput.files || []).filter((file) => file.type.startsWith("image/"));
      if (!files.length) {
        setUploadStatus("先选择至少一张图片。");
        return;
      }

      const captions = captionsInput.value
        .split(/\r?\n/)
        .map((line) => line.trim());
      const baseOrder = currentImages.length ? Math.max(...currentImages.map((item) => item.sort_order || 0)) + 1 : 1;

      setUploadStatus(`准备上传 ${files.length} 张图片...`);

      for (const [offset, file] of files.entries()) {
        setUploadStatus(`正在压缩并上传第 ${offset + 1} / ${files.length} 张...`);
        const prepared = await prepareUploadFile(file);
        const filePath = `${CONFIG.ALBUM_SLUG}/${Date.now()}-${crypto.randomUUID()}-${sanitizeFileName(prepared.name)}`;

        const uploadResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(filePath, prepared, {
          cacheControl: "31536000",
          upsert: false,
        });

        if (uploadResult.error) {
          setUploadStatus(`上传失败：${uploadResult.error.message}`);
          return;
        }

        const insertResult = await supabase.from("album_images").insert({
          album_slug: CONFIG.ALBUM_SLUG,
          title: captions[offset] || "",
          file_path: filePath,
          sort_order: baseOrder + offset,
        });

        if (insertResult.error) {
          await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove([filePath]);
          setUploadStatus(`写入图片记录失败：${insertResult.error.message}`);
          return;
        }
      }

      uploadInput.value = "";
      captionsInput.value = "";
      setUploadStatus(`已上传 ${files.length} 张图片。`);
      await loadWall();
    }

    async function prepareUploadFile(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") {
        return file;
      }

      try {
        const bitmap = await loadBitmap(file);
        let { width, height } = fitSize(bitmap.width, bitmap.height, CONFIG.MAX_UPLOAD_EDGE);
        let quality = CONFIG.MAX_UPLOAD_QUALITY;
        let attempt = 0;
        let blob = null;

        while (attempt < 6) {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d", { alpha: true });
          context.drawImage(bitmap, 0, 0, width, height);
          blob = await canvasToBlob(canvas, "image/webp", quality);

          if (blob && blob.size <= CONFIG.TARGET_UPLOAD_BYTES) {
            break;
          }

          if (quality > CONFIG.MIN_UPLOAD_QUALITY) {
            quality = Math.max(CONFIG.MIN_UPLOAD_QUALITY, quality - 0.06);
          } else {
            width = Math.max(640, Math.round(width * 0.9));
            height = Math.max(640, Math.round(height * 0.9));
          }

          attempt += 1;
        }

        if (typeof bitmap.close === "function") {
          bitmap.close();
        }

        if (!blob || blob.size >= file.size * 0.96) {
          return file;
        }

        const baseName = file.name.replace(/\.[^.]+$/, "") || "photo";
        return new File([blob], `${baseName}.webp`, {
          type: "image/webp",
          lastModified: Date.now(),
        });
      } catch (error) {
        console.warn("Image compression skipped:", error);
        return file;
      }
    }

    async function loadBitmap(file) {
      if (typeof createImageBitmap === "function") {
        return createImageBitmap(file);
      }

      const image = new Image();
      const objectUrl = URL.createObjectURL(file);
      image.src = objectUrl;
      await image.decode();
      URL.revokeObjectURL(objectUrl);
      return image;
    }

    function fitSize(width, height, maxEdge) {
      const longest = Math.max(width, height);
      if (longest <= maxEdge) {
        return { width, height };
      }

      const scale = maxEdge / longest;
      return {
        width: Math.max(1, Math.round(width * scale)),
        height: Math.max(1, Math.round(height * scale)),
      };
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob(resolve, type, quality);
      });
    }

    function renderManageList() {
      manageList.innerHTML = "";
      const loggedIn = Boolean(currentSession?.user);
      manageEmpty.hidden = currentImages.length > 0;

      if (!loggedIn) {
        manageEmpty.hidden = false;
        manageEmpty.textContent = "先登录，再管理图片。";
        return;
      }

      if (!currentImages.length) {
        manageEmpty.hidden = false;
        manageEmpty.textContent = "还没有图片。";
        return;
      }

      manageEmpty.hidden = true;

      currentImages.forEach((image, index) => {
        const card = document.createElement("article");
        card.className = "manage-card";

        const preview = document.createElement("img");
        preview.src = image.wallUrl;
        preview.alt = image.caption || `图片 ${index + 1}`;
        preview.loading = "lazy";
        preview.onerror = () => {
          if (preview.src !== image.originalUrl) {
            preview.src = image.originalUrl;
          }
        };

        const right = document.createElement("div");

        const field = document.createElement("div");
        field.className = "field";

        const label = document.createElement("label");
        label.textContent = `图片 ${index + 1} 的一句话`;

        const input = document.createElement("textarea");
        input.value = image.caption || "";
        input.maxLength = 120;
        input.rows = 3;

        field.append(label, input);

        const row = document.createElement("div");
        row.className = "row";

        const saveBtn = document.createElement("button");
        saveBtn.className = "secondary small";
        saveBtn.type = "button";
        saveBtn.textContent = "保存句子";
        saveBtn.addEventListener("click", async () => {
          await updateImage(image.id, { title: input.value.trim() }, "句子已保存。");
        });

        const upBtn = document.createElement("button");
        upBtn.className = "secondary small";
        upBtn.type = "button";
        upBtn.textContent = "前移";
        upBtn.disabled = index === 0;
        upBtn.addEventListener("click", async () => {
          await moveImage(index, index - 1);
        });

        const downBtn = document.createElement("button");
        downBtn.className = "secondary small";
        downBtn.type = "button";
        downBtn.textContent = "后移";
        downBtn.disabled = index === currentImages.length - 1;
        downBtn.addEventListener("click", async () => {
          await moveImage(index, index + 1);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "small";
        deleteBtn.type = "button";
        deleteBtn.textContent = "删除";
        deleteBtn.addEventListener("click", async () => {
          await deleteImage(image);
        });

        row.append(saveBtn, upBtn, downBtn, deleteBtn);
        right.append(field, row);
        card.append(preview, right);
        manageList.appendChild(card);
      });
    }

    async function updateImage(id, patch, successMessage) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再编辑图片。");
        return;
      }

      setManageStatus("正在保存...");
      const { error } = await supabase.from("album_images").update(patch).eq("id", id);
      if (error) {
        setManageStatus(`保存失败：${error.message}`);
        return;
      }

      setManageStatus(successMessage);
      await loadWall();
    }

    async function moveImage(fromIndex, toIndex) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再调整顺序。");
        return;
      }

      const source = currentImages[fromIndex];
      const target = currentImages[toIndex];
      if (!source || !target) {
        return;
      }

      setManageStatus("正在调整顺序...");
      const sourceOrder = source.sort_order || fromIndex + 1;
      const targetOrder = target.sort_order || toIndex + 1;

      const first = await supabase.from("album_images").update({ sort_order: targetOrder }).eq("id", source.id);
      if (first.error) {
        setManageStatus(`调整失败：${first.error.message}`);
        return;
      }

      const second = await supabase.from("album_images").update({ sort_order: sourceOrder }).eq("id", target.id);
      if (second.error) {
        setManageStatus(`调整失败：${second.error.message}`);
        return;
      }

      setManageStatus("顺序已更新。");
      await loadWall();
    }

    async function deleteImage(image) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再删除图片。");
        return;
      }

      const confirmed = window.confirm("确认删除这张图片吗？");
      if (!confirmed) {
        return;
      }

      setManageStatus("正在删除...");
      const removeResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove([image.file_path]);
      if (removeResult.error) {
        setManageStatus(`删除云端图片失败：${removeResult.error.message}`);
        return;
      }

      const deleteResult = await supabase.from("album_images").delete().eq("id", image.id);
      if (deleteResult.error) {
        setManageStatus(`删除图片记录失败：${deleteResult.error.message}`);
        return;
      }

      setManageStatus("图片已删除。");
      await loadWall();
    }

    function sanitizeFileName(name) {
      return name.replace(/[^a-zA-Z0-9._-]/g, "-");
    }

    function setAuthStatus(message) {
      authStatus.textContent = message;
    }

    function setSettingsStatus(message) {
      settingsStatus.textContent = message;
    }

    function setUploadStatus(message) {
      uploadStatus.textContent = message;
    }

    function setManageStatus(message) {
      manageStatus.textContent = message;
    }
  </script>
</body>
</html>
