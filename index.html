<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <style>
    :root {
      --bg: #02050b;
      --text: #eef2ff;
      --muted: #9aabd9;
      --line: rgba(179, 197, 255, 0.16);
      --glow: rgba(152, 186, 255, 0.38);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(97, 122, 255, 0.14), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(244, 149, 255, 0.08), transparent 24%),
        linear-gradient(180deg, #03060d 0%, #02050a 52%, #010207 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background-image:
        radial-gradient(circle at 9% 14%, rgba(255, 255, 255, 0.95) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 22% 68%, rgba(255, 255, 255, 0.72) 0 1.1px, transparent 1.4px),
        radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.88) 0 1px, transparent 1.3px),
        radial-gradient(circle at 51% 18%, rgba(255, 255, 255, 0.7) 0 1.2px, transparent 1.5px),
        radial-gradient(circle at 66% 64%, rgba(255, 255, 255, 0.76) 0 1.2px, transparent 1.5px),
        radial-gradient(circle at 78% 26%, rgba(255, 255, 255, 0.84) 0 1.1px, transparent 1.4px),
        radial-gradient(circle at 88% 78%, rgba(255, 255, 255, 0.68) 0 1.2px, transparent 1.4px),
        radial-gradient(circle at 16% 88%, rgba(255, 255, 255, 0.72) 0 1px, transparent 1.2px);
      animation: starsFloat 18s linear infinite;
      opacity: 0.9;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(154, 182, 255, 0.08), transparent 34%),
        radial-gradient(circle at 50% 52%, rgba(131, 161, 255, 0.06), transparent 24%);
      filter: blur(18px);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
    }

    .centerpiece {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(46vw, 260px);
      max-width: 260px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: drop-shadow(0 14px 34px rgba(117, 154, 255, 0.34));
      animation: planeHero 9.5s ease-in-out infinite;
      z-index: 2;
    }

    .centerpiece svg {
      width: 100%;
      height: auto;
      display: block;
      fill: url(#planeGradient);
      stroke: rgba(245, 248, 255, 0.4);
      stroke-width: 1.1;
    }

    .center-trail {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(72vw, 420px);
      height: 2px;
      transform: translate(-50%, -50%);
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(162, 191, 255, 0.8), rgba(255,255,255,0));
      filter: blur(0.8px);
      opacity: 0.8;
      z-index: 1;
      pointer-events: none;
      animation: trailPulse 9.5s ease-in-out infinite;
    }

    .cards {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .tile {
      position: absolute;
      width: min(30vw, 150px);
      min-width: 110px;
      border-radius: 20px;
      padding: 7px 7px 9px;
      background:
        linear-gradient(180deg, rgba(224, 234, 255, 0.16), rgba(123, 146, 203, 0.12)),
        linear-gradient(180deg, rgba(10, 15, 26, 0.92), rgba(5, 9, 18, 0.98));
      border: 1px solid rgba(230, 238, 255, 0.16);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 16px 34px rgba(0,0,0,0.34),
        0 0 28px rgba(124, 157, 255, 0.12);
      opacity: 0;
      transform: translate3d(-50%, -50%, 0) scale(1.08);
      pointer-events: auto;
      cursor: pointer;
    }

    .tile.visible {
      animation: tileAppear 0.85s cubic-bezier(0.22, 0.7, 0.2, 1) forwards;
    }

    .tile.floating {
      animation: tileOrbit var(--float-duration, 10s) ease-in-out infinite alternate;
      animation-delay: var(--float-delay, 0s);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 7px 7px 9px;
      border-radius: 14px;
      border: 1px solid rgba(210, 225, 255, 0.14);
      box-shadow: 0 0 18px rgba(152, 186, 255, 0.18);
      pointer-events: none;
    }

    .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(224, 234, 255, 0.18);
      background: linear-gradient(180deg, #11192a, #070d17);
      opacity: 0;
      transition: opacity 0.24s ease;
    }

    .tile.loaded img {
      opacity: 1;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(2, 4, 10, 0.92);
      backdrop-filter: blur(12px);
      z-index: 25;
    }

    .overlay.open { display: grid; }

    .overlay figure {
      margin: 0;
      width: min(1080px, 100%);
    }

    .overlay img {
      display: block;
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 24px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      transition: opacity 0.18s ease, filter 0.18s ease;
    }

    .overlay img.upgrading {
      opacity: 0.9;
      filter: blur(4px);
    }

    .overlay figcaption {
      margin-top: 10px;
      text-align: center;
      color: #e7edff;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .editor {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(460px, 100%);
      padding: 18px;
      background: linear-gradient(180deg, rgba(7, 12, 24, 0.98), rgba(6, 10, 18, 0.98));
      border-left: 1px solid rgba(175, 194, 255, 0.12);
      box-shadow: -18px 0 40px rgba(0, 0, 0, 0.32);
      transform: translateX(100%);
      transition: transform 0.24s ease;
      z-index: 30;
      overflow-y: auto;
      backdrop-filter: blur(16px);
    }

    .editor.open { transform: translateX(0); }

    .editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .editor-head h2 { margin: 0; font-size: 22px; }

    .panel {
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 22px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .panel h3 { margin: 0 0 12px; font-size: 17px; }

    .panel p, .manage-empty, .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .field input, .field textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .session-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 13px;
    }

    .manage-list { display: grid; gap: 12px; }

    .manage-card {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(175, 194, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .manage-card img {
      display: block;
      width: 74px;
      height: 74px;
      object-fit: cover;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #9ab5ff, #f3aff7);
      color: #07101f;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(148, 175, 255, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(175, 194, 255, 0.14);
      box-shadow: none;
    }

    button.small { padding: 9px 12px; font-size: 13px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    @media (max-width: 860px) {
      .centerpiece { width: min(54vw, 250px); }
      .tile { width: min(31vw, 142px); min-width: 104px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .tile, .tile img { opacity: 1 !important; transform: translate3d(-50%, -50%, 0) !important; }
    }

    @keyframes starsFloat {
      from { transform: translateY(0); }
      50% { transform: translateY(7px); }
      to { transform: translateY(0); }
    }

    @keyframes planeHero {
      0% {
        transform: translate(-50%, -50%) translate3d(-4vw, 0, -240px) scale(0.62) rotateX(20deg) rotateY(-24deg) rotate(-10deg);
        opacity: 0;
      }
      12% {
        transform: translate(-50%, -50%) translate3d(-1vw, 0, -120px) scale(0.78) rotateX(12deg) rotateY(-16deg) rotate(-7deg);
        opacity: 0.86;
      }
      50% {
        transform: translate(-50%, -50%) translate3d(0, 0, 90px) scale(1.16) rotateX(2deg) rotateY(0deg) rotate(0deg);
        opacity: 1;
      }
      84% {
        transform: translate(-50%, -50%) translate3d(2vw, 0, -120px) scale(0.8) rotateX(12deg) rotateY(16deg) rotate(6deg);
        opacity: 0.86;
      }
      100% {
        transform: translate(-50%, -50%) translate3d(5vw, 0, -260px) scale(0.6) rotateX(18deg) rotateY(24deg) rotate(8deg);
        opacity: 0;
      }
    }

    @keyframes trailPulse {
      0%, 100% { opacity: 0.48; transform: translate(-50%, -50%) scaleX(0.82); }
      50% { opacity: 0.9; transform: translate(-50%, -50%) scaleX(1.06); }
    }

    @keyframes tileAppear {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(1.12);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1);
      }
    }

    @keyframes tileOrbit {
      0% { transform: translate3d(-50%, -50%, 0) translate3d(0, 0, 0) rotate(-1deg) scale(1); }
      33% { transform: translate3d(-50%, -50%, 0) translate3d(6px, -18px, 0) rotate(0.4deg) scale(1.028); }
      66% { transform: translate3d(-50%, -50%, 0) translate3d(-8px, 10px, 0) rotate(-1.4deg) scale(0.992); }
      100% { transform: translate3d(-50%, -50%, 0) translate3d(4px, -8px, 0) rotate(0.8deg) scale(1.012); }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="center-trail"></div>
    <div class="centerpiece" aria-hidden="true">
      <svg viewBox="0 0 160 80">
        <defs>
          <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff8fd"></stop>
            <stop offset="55%" stop-color="#b9d0ff"></stop>
            <stop offset="100%" stop-color="#6fa6ff"></stop>
          </linearGradient>
        </defs>
        <path d="M10 40 150 12 98 38 150 68 85 52 60 73 66 48 10 40Z"></path>
      </svg>
    </div>
    <section class="cards" id="cards"></section>
  </main>

  <div class="overlay" id="lightbox">
    <figure>
      <img id="lightboxImage" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <aside class="editor" id="editorPanel" aria-hidden="true">
    <div class="editor-head">
      <h2>编辑</h2>
      <button class="secondary" id="closeEditor" type="button">关闭</button>
    </div>

    <section class="panel">
      <h3>管理员登录</h3>
      <div class="session-line">
        <span id="sessionText">未登录</span>
        <button class="secondary small" id="signOutBtn" type="button" hidden>退出</button>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="emailInput">邮箱</label>
          <input id="emailInput" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="passwordInput">密码</label>
          <input id="passwordInput" type="password" autocomplete="current-password">
        </div>
        <div class="row">
          <button id="signInBtn" type="submit">登录</button>
        </div>
      </form>
      <div class="status" id="authStatus"></div>
    </section>

    <section class="panel">
      <h3>背景音乐</h3>
      <div class="field">
        <label for="musicInput">音频直链</label>
        <input id="musicInput" type="url" placeholder="https://example.com/music.mp3">
      </div>
      <div class="row">
        <button id="saveSettingsBtn" type="button">保存</button>
        <button class="secondary" id="musicToggle" type="button" hidden>播放</button>
      </div>
      <div class="status" id="settingsStatus"></div>
    </section>

    <section class="panel">
      <h3>上传图片</h3>
      <p>这个版本彻底偏速度优先。新图会被压得很小，画质会明显牺牲。</p>
      <div class="field">
        <label for="uploadInput">选择图片</label>
        <input id="uploadInput" type="file" accept="image/*" multiple>
      </div>
      <div class="field">
        <label for="captionsInput">每行一句话，按图片顺序对应</label>
        <textarea id="captionsInput" placeholder="第一张图的一句话&#10;第二张图的一句话"></textarea>
      </div>
      <div class="row">
        <button id="uploadBtn" type="button">上传到云端</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </section>

    <section class="panel">
      <h3>图片管理</h3>
      <div class="manage-list" id="manageList"></div>
      <div class="manage-empty" id="manageEmpty">还没有图片。</div>
      <div class="status" id="manageStatus"></div>
    </section>
  </aside>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const CONFIG = {
      SUPABASE_URL: "https://pnzbcsnoqrmtdkxyxfms.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_BZMrBawoq266rDTBEcIXRQ_yCrQPJ8C",
      ALBUM_SLUG: "main",
      IMAGES_BUCKET: "wall-images",
      MAX_UPLOAD_EDGE: 640,
      TARGET_UPLOAD_BYTES: 100 * 1024,
      MAX_UPLOAD_QUALITY: 0.34,
      MIN_UPLOAD_QUALITY: 0.18,
      USE_IMAGE_TRANSFORMS: true,
      WALL_IMAGE_WIDTH: 160,
      WALL_IMAGE_HEIGHT: 220,
      WALL_IMAGE_QUALITY: 18,
      LIGHTBOX_IMAGE_WIDTH: 480,
      LIGHTBOX_IMAGE_QUALITY: 30,
    };

    const CARD_POSITIONS = [
      { x: 22, y: 26 }, { x: 78, y: 24 },
      { x: 16, y: 68 }, { x: 84, y: 70 },
      { x: 32, y: 16 }, { x: 68, y: 18 },
      { x: 28, y: 78 }, { x: 72, y: 80 },
      { x: 10, y: 46 }, { x: 90, y: 48 }
    ];

    const cards = document.getElementById("cards");
    const stage = document.getElementById("stage");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const editorPanel = document.getElementById("editorPanel");
    const closeEditor = document.getElementById("closeEditor");
    const sessionText = document.getElementById("sessionText");
    const signOutBtn = document.getElementById("signOutBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authStatus = document.getElementById("authStatus");
    const musicInput = document.getElementById("musicInput");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const musicToggle = document.getElementById("musicToggle");
    const settingsStatus = document.getElementById("settingsStatus");
    const uploadInput = document.getElementById("uploadInput");
    const captionsInput = document.getElementById("captionsInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const manageList = document.getElementById("manageList");
    const manageEmpty = document.getElementById("manageEmpty");
    const manageStatus = document.getElementById("manageStatus");

    let supabase = null;
    let currentSession = null;
    let currentImages = [];
    let audioElement = null;
    let sourceObserver = null;
    let tapCount = 0;
    let tapTimer = null;
    let pendingLightboxTimeout = 0;
    let longPressTimer = 0;

    init();

    async function init() {
      supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      bindUi();
      updateAuthUi();
      await refreshSession();
      await loadSettings();
      await loadWall();
    }

    function bindUi() {
      stage.addEventListener("pointerup", onStageTap, { passive: true });
      stage.addEventListener("pointerdown", onStagePressStart, { passive: true });
      stage.addEventListener("pointermove", onStagePressEnd, { passive: true });
      stage.addEventListener("pointercancel", onStagePressEnd, { passive: true });
      stage.addEventListener("pointerleave", onStagePressEnd, { passive: true });
      closeEditor.addEventListener("click", closeEditorPanel);
      lightbox.addEventListener("click", closeLightbox);
      musicToggle.addEventListener("click", toggleMusicPlayback);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeEditorPanel();
          closeLightbox();
        }
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setAuthStatus("正在登录...");
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });
        if (error) {
          setAuthStatus(`登录失败：${error.message}`);
          return;
        }
        passwordInput.value = "";
        setAuthStatus("登录成功。");
        await refreshSession();
      });

      signOutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        currentSession = null;
        updateAuthUi();
        setAuthStatus("已退出登录。");
      });

      saveSettingsBtn.addEventListener("click", saveSettings);
      uploadBtn.addEventListener("click", uploadImages);
    }

    function onStageTap(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) {
        return;
      }
      tapCount += 1;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 700);
      if (tapCount >= 3) {
        tapCount = 0;
        cancelPendingLightbox();
        onStagePressEnd();
        openEditorPanel();
      }
    }

    function onStagePressStart(event) {
      if (editorPanel.contains(event.target) || lightbox.contains(event.target)) {
        return;
      }
      onStagePressEnd();
      longPressTimer = window.setTimeout(() => {
        longPressTimer = 0;
        tapCount = 0;
        cancelPendingLightbox();
        openEditorPanel();
      }, 650);
    }

    function onStagePressEnd() {
      if (!longPressTimer) return;
      window.clearTimeout(longPressTimer);
      longPressTimer = 0;
    }

    function openEditorPanel() {
      editorPanel.classList.add("open");
      editorPanel.setAttribute("aria-hidden", "false");
    }

    function closeEditorPanel() {
      editorPanel.classList.remove("open");
      editorPanel.setAttribute("aria-hidden", "true");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
      lightboxImage.alt = "";
      lightboxCaption.textContent = "";
    }

    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        setAuthStatus(`会话读取失败：${error.message}`);
        return;
      }
      currentSession = data.session;
      updateAuthUi();
    }

    function updateAuthUi() {
      const loggedIn = Boolean(currentSession?.user);
      sessionText.textContent = loggedIn ? `当前账号：${currentSession.user.email}` : "未登录";
      signOutBtn.hidden = !loggedIn;
      loginForm.hidden = loggedIn;
      saveSettingsBtn.disabled = !loggedIn;
      uploadBtn.disabled = !loggedIn;
      uploadInput.disabled = !loggedIn;
      captionsInput.disabled = !loggedIn;
      renderManageList();
    }

    async function loadSettings() {
      const { data, error } = await supabase
        .from("album_settings")
        .select("music_url")
        .eq("slug", CONFIG.ALBUM_SLUG)
        .maybeSingle();
      if (error) {
        setSettingsStatus(`读取设置失败：${error.message}`);
        return;
      }
      musicInput.value = data?.music_url || "";
      syncMusic(data?.music_url || "");
    }

    async function loadWall() {
      const { data, error } = await supabase
        .from("album_images")
        .select("id, title, file_path, sort_order, created_at")
        .eq("album_slug", CONFIG.ALBUM_SLUG)
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true });
      if (error) {
        setManageStatus(`读取图片失败：${error.message}`);
        return;
      }

      currentImages = (data || []).map((item) => {
        const originalUrl = getPublicUrl(item.file_path);
        return {
          ...item,
          caption: item.title || "",
          originalUrl,
          wallUrl: getWallUrl(item.file_path, originalUrl),
          fullUrl: getFullUrl(item.file_path, originalUrl),
        };
      });

      renderWall();
      renderManageList();
    }

    function getWallUrl(filePath, fallbackUrl) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fallbackUrl;
      return getPublicUrl(filePath, {
        transform: {
          width: CONFIG.WALL_IMAGE_WIDTH,
          height: CONFIG.WALL_IMAGE_HEIGHT,
          quality: CONFIG.WALL_IMAGE_QUALITY,
          resize: "cover",
        },
      });
    }

    function getFullUrl(filePath, fallbackUrl) {
      if (!CONFIG.USE_IMAGE_TRANSFORMS) return fallbackUrl;
      return getPublicUrl(filePath, {
        transform: {
          width: CONFIG.LIGHTBOX_IMAGE_WIDTH,
          quality: CONFIG.LIGHTBOX_IMAGE_QUALITY,
          resize: "contain",
        },
      });
    }

    function getPublicUrl(filePath, options) {
      const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(filePath, options);
      return data.publicUrl;
    }

    function renderWall() {
      cards.innerHTML = "";
      if (sourceObserver) {
        sourceObserver.disconnect();
      }

      sourceObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          startTileLoad(entry.target);
          sourceObserver.unobserve(entry.target);
        }
      }, { rootMargin: "120px" });

      currentImages.forEach((image, index) => {
        const tile = createTile(image, index);
        cards.appendChild(tile);
        sourceObserver.observe(tile);
      });
    }

    function createTile(image, index) {
      const tile = document.createElement("article");
      tile.className = "tile";
      tile.style.left = `${CARD_POSITIONS[index % CARD_POSITIONS.length].x}%`;
      tile.style.top = `${CARD_POSITIONS[index % CARD_POSITIONS.length].y}%`;
      tile.style.setProperty("--float-duration", `${7.5 + (index % 4) * 0.8}s`);
      tile.style.setProperty("--float-delay", `${(index % 5) * 0.45}s`);
      tile.dataset.wallSrc = image.wallUrl;
      tile.dataset.wallFallback = image.originalUrl;

      const img = document.createElement("img");
      img.alt = image.caption || `图片 ${index + 1}`;
      img.decoding = "async";
      img.loading = "lazy";
      img.addEventListener("load", () => tile.classList.add("loaded"), { once: true });
      img.addEventListener("error", () => {
        if (img.src !== tile.dataset.wallFallback) {
          img.src = tile.dataset.wallFallback;
          return;
        }
        tile.classList.add("loaded");
      });

      tile.append(img);
      tile.addEventListener("click", () => scheduleLightboxOpen(image, index));

      const revealDelay = 120 + index * 110;
      window.setTimeout(() => {
        tile.classList.add("visible");
        window.setTimeout(() => tile.classList.add("floating"), 860);
      }, revealDelay);

      return tile;
    }

    function scheduleLightboxOpen(image, index) {
      cancelPendingLightbox();
      pendingLightboxTimeout = window.setTimeout(() => {
        pendingLightboxTimeout = 0;
        if (!editorPanel.classList.contains("open")) {
          openLightbox(image, index);
        }
      }, 420);
    }

    function cancelPendingLightbox() {
      if (!pendingLightboxTimeout) return;
      window.clearTimeout(pendingLightboxTimeout);
      pendingLightboxTimeout = 0;
    }

    function startTileLoad(tile) {
      const img = tile.querySelector("img");
      if (!img || img.src) return;
      img.src = tile.dataset.wallSrc;
    }

    function openLightbox(image, index) {
      lightboxImage.classList.remove("upgrading");
      lightboxImage.src = image.wallUrl || image.originalUrl;
      lightboxImage.alt = image.caption || `图片 ${index + 1}`;
      lightboxCaption.textContent = image.caption || "";
      lightbox.classList.add("open");

      if (image.fullUrl && image.fullUrl !== image.wallUrl) {
        lightboxImage.classList.add("upgrading");
        const upgrade = new Image();
        upgrade.decoding = "async";
        upgrade.onload = () => {
          if (!lightbox.classList.contains("open")) return;
          lightboxImage.src = image.fullUrl;
          lightboxImage.classList.remove("upgrading");
        };
        upgrade.onerror = () => {
          if (image.originalUrl && image.originalUrl !== image.wallUrl) {
            lightboxImage.src = image.originalUrl;
          }
          lightboxImage.classList.remove("upgrading");
        };
        upgrade.src = image.fullUrl;
      }

      lightboxImage.onerror = () => {
        if (lightboxImage.src !== image.originalUrl) {
          lightboxImage.src = image.originalUrl;
        }
        lightboxImage.classList.remove("upgrading");
      };
    }

    async function saveSettings() {
      if (!currentSession?.user) {
        setSettingsStatus("先登录，再保存。");
        return;
      }
      setSettingsStatus("正在保存...");
      const { error } = await supabase.from("album_settings").upsert({
        slug: CONFIG.ALBUM_SLUG,
        music_url: musicInput.value.trim(),
      }, { onConflict: "slug" });
      if (error) {
        setSettingsStatus(`保存失败：${error.message}`);
        return;
      }
      syncMusic(musicInput.value.trim());
      setSettingsStatus("已保存。");
    }

    function syncMusic(url) {
      if (audioElement) {
        audioElement.pause();
        audioElement.remove();
        audioElement = null;
      }
      if (!url) {
        musicToggle.hidden = true;
        musicToggle.textContent = "播放";
        return;
      }
      audioElement = document.createElement("audio");
      audioElement.src = url;
      audioElement.loop = true;
      audioElement.preload = "none";
      document.body.appendChild(audioElement);
      musicToggle.hidden = false;
      musicToggle.textContent = "播放";
    }

    async function toggleMusicPlayback() {
      if (!audioElement) return;
      if (audioElement.paused) {
        try {
          await audioElement.play();
          musicToggle.textContent = "暂停";
        } catch {
          setSettingsStatus("音频无法播放，请检查链接。");
        }
        return;
      }
      audioElement.pause();
      musicToggle.textContent = "播放";
    }

    async function uploadImages() {
      if (!currentSession?.user) {
        setUploadStatus("先登录，再上传图片。");
        return;
      }

      const files = Array.from(uploadInput.files || []).filter((file) => file.type.startsWith("image/"));
      if (!files.length) {
        setUploadStatus("先选择至少一张图片。");
        return;
      }

      const captions = captionsInput.value.split(/\r?\n/).map((line) => line.trim());
      const baseOrder = currentImages.length ? Math.max(...currentImages.map((item) => item.sort_order || 0)) + 1 : 1;
      const rowsToInsert = [];

      setUploadStatus(`准备上传 ${files.length} 张图片...`);

      for (const [offset, file] of files.entries()) {
        setUploadStatus(`正在压缩并上传第 ${offset + 1} / ${files.length} 张...`);
        const prepared = await prepareUploadFile(file);
        const filePath = `${CONFIG.ALBUM_SLUG}/${Date.now()}-${crypto.randomUUID()}-${sanitizeFileName(prepared.name)}`;

        const uploadResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(filePath, prepared, {
          cacheControl: "31536000",
          upsert: false,
        });

        if (uploadResult.error) {
          setUploadStatus(`上传失败：${uploadResult.error.message}`);
          return;
        }

        rowsToInsert.push({
          album_slug: CONFIG.ALBUM_SLUG,
          title: captions[offset] || "",
          file_path: filePath,
          sort_order: baseOrder + offset,
        });
      }

      const insertResult = await supabase.from("album_images").insert(rowsToInsert);
      if (insertResult.error) {
        await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove(rowsToInsert.map((row) => row.file_path));
        setUploadStatus(`写入图片记录失败：${insertResult.error.message}`);
        return;
      }

      uploadInput.value = "";
      captionsInput.value = "";
      setUploadStatus(`已上传 ${files.length} 张图片。`);
      await loadWall();
    }

    async function prepareUploadFile(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.type === "image/svg+xml") {
        return file;
      }

      try {
        const bitmap = await loadBitmap(file);
        let { width, height } = fitSize(bitmap.width, bitmap.height, CONFIG.MAX_UPLOAD_EDGE);
        let quality = CONFIG.MAX_UPLOAD_QUALITY;
        let attempt = 0;
        let blob = null;

        while (attempt < 6) {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d", { alpha: true });
          context.drawImage(bitmap, 0, 0, width, height);
          blob = await canvasToBlob(canvas, "image/webp", quality);

          if (blob && blob.size <= CONFIG.TARGET_UPLOAD_BYTES) {
            break;
          }

          if (quality > CONFIG.MIN_UPLOAD_QUALITY) {
            quality = Math.max(CONFIG.MIN_UPLOAD_QUALITY, quality - 0.04);
          } else {
            width = Math.max(420, Math.round(width * 0.88));
            height = Math.max(420, Math.round(height * 0.88));
          }

          attempt += 1;
        }

        if (typeof bitmap.close === "function") {
          bitmap.close();
        }

        if (!blob || blob.size >= file.size * 0.96) {
          return file;
        }

        const baseName = file.name.replace(/\.[^.]+$/, "") || "photo";
        return new File([blob], `${baseName}.webp`, {
          type: "image/webp",
          lastModified: Date.now(),
        });
      } catch (error) {
        console.warn("Image compression skipped:", error);
        return file;
      }
    }

    async function loadBitmap(file) {
      if (typeof createImageBitmap === "function") {
        return createImageBitmap(file);
      }
      const image = new Image();
      const objectUrl = URL.createObjectURL(file);
      image.src = objectUrl;
      await image.decode();
      URL.revokeObjectURL(objectUrl);
      return image;
    }

    function fitSize(width, height, maxEdge) {
      const longest = Math.max(width, height);
      if (longest <= maxEdge) {
        return { width, height };
      }
      const scale = maxEdge / longest;
      return {
        width: Math.max(1, Math.round(width * scale)),
        height: Math.max(1, Math.round(height * scale)),
      };
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob(resolve, type, quality);
      });
    }

    function renderManageList() {
      manageList.innerHTML = "";
      const loggedIn = Boolean(currentSession?.user);
      manageEmpty.hidden = currentImages.length > 0;
      if (!loggedIn) {
        manageEmpty.hidden = false;
        manageEmpty.textContent = "先登录，再管理图片。";
        return;
      }
      if (!currentImages.length) {
        manageEmpty.hidden = false;
        manageEmpty.textContent = "还没有图片。";
        return;
      }
      manageEmpty.hidden = true;

      currentImages.forEach((image, index) => {
        const card = document.createElement("article");
        card.className = "manage-card";

        const preview = document.createElement("img");
        preview.src = image.wallUrl;
        preview.alt = image.caption || `图片 ${index + 1}`;
        preview.loading = "lazy";
        preview.onerror = () => {
          if (preview.src !== image.originalUrl) preview.src = image.originalUrl;
        };

        const right = document.createElement("div");
        const field = document.createElement("div");
        field.className = "field";
        const label = document.createElement("label");
        label.textContent = `图片 ${index + 1} 的一句话`;
        const input = document.createElement("textarea");
        input.value = image.caption || "";
        input.maxLength = 120;
        input.rows = 3;
        field.append(label, input);

        const row = document.createElement("div");
        row.className = "row";

        const saveBtn = document.createElement("button");
        saveBtn.className = "secondary small";
        saveBtn.type = "button";
        saveBtn.textContent = "保存句子";
        saveBtn.addEventListener("click", async () => {
          await updateImage(image.id, { title: input.value.trim() }, "句子已保存。");
        });

        const upBtn = document.createElement("button");
        upBtn.className = "secondary small";
        upBtn.type = "button";
        upBtn.textContent = "前移";
        upBtn.disabled = index === 0;
        upBtn.addEventListener("click", async () => {
          await moveImage(index, index - 1);
        });

        const downBtn = document.createElement("button");
        downBtn.className = "secondary small";
        downBtn.type = "button";
        downBtn.textContent = "后移";
        downBtn.disabled = index === currentImages.length - 1;
        downBtn.addEventListener("click", async () => {
          await moveImage(index, index + 1);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "small";
        deleteBtn.type = "button";
        deleteBtn.textContent = "删除";
        deleteBtn.addEventListener("click", async () => {
          await deleteImage(image);
        });

        row.append(saveBtn, upBtn, downBtn, deleteBtn);
        right.append(field, row);
        card.append(preview, right);
        manageList.appendChild(card);
      });
    }

    async function updateImage(id, patch, successMessage) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再编辑图片。");
        return;
      }
      setManageStatus("正在保存...");
      const { error } = await supabase.from("album_images").update(patch).eq("id", id);
      if (error) {
        setManageStatus(`保存失败：${error.message}`);
        return;
      }
      setManageStatus(successMessage);
      await loadWall();
    }

    async function moveImage(fromIndex, toIndex) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再调整顺序。");
        return;
      }
      const source = currentImages[fromIndex];
      const target = currentImages[toIndex];
      if (!source || !target) return;

      setManageStatus("正在调整顺序...");
      const sourceOrder = source.sort_order || fromIndex + 1;
      const targetOrder = target.sort_order || toIndex + 1;

      const first = await supabase.from("album_images").update({ sort_order: targetOrder }).eq("id", source.id);
      if (first.error) {
        setManageStatus(`调整失败：${first.error.message}`);
        return;
      }

      const second = await supabase.from("album_images").update({ sort_order: sourceOrder }).eq("id", target.id);
      if (second.error) {
        setManageStatus(`调整失败：${second.error.message}`);
        return;
      }

      setManageStatus("顺序已更新。");
      await loadWall();
    }

    async function deleteImage(image) {
      if (!currentSession?.user) {
        setManageStatus("先登录，再删除图片。");
        return;
      }
      const confirmed = window.confirm("确认删除这张图片吗？");
      if (!confirmed) return;

      setManageStatus("正在删除...");
      const removeResult = await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove([image.file_path]);
      if (removeResult.error) {
        setManageStatus(`删除云端图片失败：${removeResult.error.message}`);
        return;
      }

      const deleteResult = await supabase.from("album_images").delete().eq("id", image.id);
      if (deleteResult.error) {
        setManageStatus(`删除图片记录失败：${deleteResult.error.message}`);
        return;
      }

      setManageStatus("图片已删除。");
      await loadWall();
    }

    function sanitizeFileName(name) {
      return name.replace(/[^a-zA-Z0-9._-]/g, "-");
    }

    function setAuthStatus(message) { authStatus.textContent = message; }
    function setSettingsStatus(message) { settingsStatus.textContent = message; }
    function setUploadStatus(message) { uploadStatus.textContent = message; }
    function setManageStatus(message) { manageStatus.textContent = message; }
  </script>
</body>
</html>
