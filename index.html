<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://pnzbcsnoqrmtdkxyxfms.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="preload" href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"></noscript>
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #060810; color: #eef2ff;
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .stage {
      position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(77,166,255,0.07), transparent 55%),
        radial-gradient(ellipse at 50% 60%, rgba(240,80,128,0.04), transparent 50%),
        linear-gradient(180deg, #08081a 0%, #0a0c18 50%, #0c0e1a 100%);
    }

    .stars {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,0.85) 0 1px, transparent 1.2px),
        radial-gradient(circle at 28% 55%, rgba(255,255,255,0.55) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 44% 18%, rgba(255,255,255,0.75) 0 1px, transparent 1.3px),
        radial-gradient(circle at 58% 62%, rgba(255,255,255,0.65) 0 0.9px, transparent 1.2px),
        radial-gradient(circle at 72% 24%, rgba(255,255,255,0.7) 0 1px, transparent 1.3px),
        radial-gradient(circle at 85% 52%, rgba(255,255,255,0.6) 0 0.9px, transparent 1.1px),
        radial-gradient(circle at 15% 72%, rgba(255,255,255,0.65) 0 0.8px, transparent 1.1px),
        radial-gradient(circle at 92% 18%, rgba(255,255,255,0.75) 0 1px, transparent 1.2px);
      opacity: 0.72;
    }

    /* ── Camera ── */
    .camera {
      position: absolute; inset: 0; z-index: 3; overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* ── Column (always exactly 3) ── */
    .column {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(130px, 34vh, 240px);
      padding: 0 4px;
    }

    /* ── Cards ── */
    .card {
      position: relative;
      width: 120px;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      animation: cardFloat var(--fd, 6s) ease-in-out infinite alternate;
      animation-delay: var(--fdl, 0s);
    }

    .card .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 16px; padding: 5px;
      background: linear-gradient(180deg,
        rgba(180,200,240,0.25), rgba(120,150,200,0.18) 30%,
        rgba(80,110,170,0.22) 60%, rgba(140,170,220,0.2));
      border: 1.5px solid rgba(190,215,255,0.35);
      box-shadow:
        0 10px 36px rgba(0,0,0,0.42),
        0 0 22px rgba(100,160,240,0.10),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .card img {
      display: block; width: 100%; height: 100%;
      object-fit: cover; border-radius: 12px;
      background: linear-gradient(180deg, #11192a, #070d17);
      transition: opacity 0.3s ease;
    }

    .card .caption {
      font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      font-weight: 500;
      font-size: clamp(12px, 2.4vw, 15px);
      color: #e0e8ff;
      text-align: center;
      line-height: 1.4;
      padding: 2px 4px;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(160,200,255,0.4), 0 1px 3px rgba(0,0,0,0.6);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Scroll transition ── */
    .track {
      display: flex; height: 100%; padding: 12px 0;
      transition: transform 0.45s cubic-bezier(0.22, 0.6, 0.28, 1);
    }
    .track.scroll-left { transform: translateX(-34%); }
    .track.scroll-right { transform: translateX(34%); }

    /* ── Float (normal state) ── */
    .card.floating {
      animation: cardFloat var(--fd, 6s) ease-in-out infinite alternate;
      animation-delay: var(--fdl, 0s);
    }

    @keyframes cardFloat {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-8px); }
      100% { transform: translateY(-1px); }
    }

    /* ── Plane highlights middle column ── */
    .card.highlighted .img-wrap {
      border-color: rgba(170,220,255,0.85) !important;
      box-shadow:
        0 10px 44px rgba(0,0,0,0.44),
        0 0 45px rgba(150,210,255,0.6),
        0 0 75px rgba(110,170,250,0.35),
        inset 0 0 0 1px rgba(255,255,255,0.12) !important;
    }
    .card.highlighted {
      z-index: 4; opacity: 1 !important; filter: brightness(1.18) !important;
    }

    /* ── Plane ── */
    .plane-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
    }
    .plane-group {
      position: absolute; top: 50%; transform: translateY(-50%);
      animation: planeEnter 2s ease-in-out forwards, planeHover 1.6s 2s ease-in-out infinite;
    }
    .plane-group svg {
      display: block;
      width: min(40vw, 190px); height: auto;
      filter: drop-shadow(0 10px 28px rgba(117,154,255,0.65)) drop-shadow(0 4px 10px rgba(255,255,255,0.35));
    }
    .plane-trail {
      position: absolute; top: 50%; transform: translateY(-50%); height: 3px;
      background: linear-gradient(90deg, transparent 0%, rgba(180,210,255,0.2) 10%, rgba(220,240,255,0.7) 40%, rgba(200,225,255,0.45) 70%, transparent 100%);
      filter: blur(3px); z-index: 4; border-radius: 2px;
      animation: trailEnter 2s ease-in-out forwards, trailHover 2.5s 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes planeEnter {
      0%   { left: -22%; transform: translateY(-50%) scale(0.6); opacity: 0; }
      15%  { opacity: 1; }
      100% { left: 42%; transform: translateY(-50%) scale(1.2); opacity: 1; }
    }
    @keyframes planeHover {
      0%   { transform: translateY(-50%) scale(1.2) translateY(-8px) rotateX(5deg) rotateY(-4deg); }
      50%  { transform: translateY(-50%) scale(1.2) translateY(8px) rotateX(-4deg) rotateY(5deg); }
      100% { transform: translateY(-50%) scale(1.2) translateY(-8px) rotateX(5deg) rotateY(-4deg); }
    }
    @keyframes trailEnter {
      0%   { left: -22%; width: 4%; opacity: 0; }
      30%  { opacity: 0.9; }
      100% { left: 6%; width: 34%; opacity: 0.85; }
    }
    @keyframes trailHover {
      0%   { opacity: 0.85; }
      50%  { opacity: 0.5; }
      100% { opacity: 0.85; }
    }

    /* ── Toast ── */
    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 10; pointer-events: none;
      padding: 14px 24px; border-radius: 14px;
      background: rgba(0,0,0,0.85); color: #ff9090;
      font-size: 13px; text-align: center; line-height: 1.6;
      border: 1px solid rgba(255,100,100,0.3);
      max-width: 80%;
    }
    .toast:empty { display: none; }

    /* ── Splash (tap to start) ── */
    .splash {
      position: fixed; inset: 0; z-index: 50;
      width: 100%; height: 100%; border-radius: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: radial-gradient(ellipse at 50% 40%, rgba(60,100,200,0.15), transparent 60%),
                  linear-gradient(180deg, #08081a 0%, #0a0c18 100%);
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.6s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .music-toggle { position: fixed; top: 12px; right: 12px; z-index: 20; }
    .splash-icon {
      width: min(120px, 30vw); height: min(120px, 30vw);
      border-radius: 50%; border: 2px solid rgba(180,210,255,0.3);
      background: rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      animation: splashPulse 2s ease-in-out infinite;
    }
    .splash-icon svg { width: 40%; height: 40%; fill: rgba(200,220,255,0.8); }
    .splash-text {
      font-size: clamp(15px, 3.5vw, 18px); color: rgba(200,220,255,0.7);
      letter-spacing: 0.1em;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(120,170,255,0.15); }
      50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(120,170,255,0.3); }
    }

    /* ── Dots ── */
    .swipe-dots {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 6; display: flex; gap: 7px; pointer-events: none;
    }
    .swipe-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.28); transition: background 0.3s, transform 0.3s;
    }
    .swipe-dot.active { background: rgba(200,220,255,0.9); transform: scale(1.5); }

    /* ── Lightbox ── */
    .overlay {
      position: fixed; inset: 0; display: none; place-items: center;
      padding: 16px; background: rgba(2,4,10,0.95); backdrop-filter: blur(16px); z-index: 25;
    }
    .overlay.open { display: grid; }
    .overlay figure { margin: 0; width: min(1080px, 100%); }
    .overlay img {
      display: block; width: 100%; max-height: 80vh; object-fit: contain;
      border-radius: 20px; border: 1px solid rgba(175,194,255,0.1);
      background: rgba(255,255,255,0.03);
    }
    .overlay figcaption { margin-top: 10px; text-align: center; color: #e7edff; font-size: 14px; }

    /* ── Editor ── */
    .editor {
      position: fixed; inset: 0 0 0 auto; width: min(460px, 100%);
      padding: 18px; background: linear-gradient(180deg, rgba(7,12,24,0.98), rgba(6,10,18,0.98));
      border-left: 1px solid rgba(175,194,255,0.12); box-shadow: -18px 0 40px rgba(0,0,0,0.32);
      transform: translateX(100%); transition: transform 0.24s ease;
      z-index: 30; overflow-y: auto; backdrop-filter: blur(16px);
    }
    .editor.open { transform: translateX(0); }
    .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .editor-head h2 { margin: 0; font-size: 22px; }
    .panel { padding: 18px; margin-bottom: 16px; border-radius: 22px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.04); }
    .panel h3 { margin: 0 0 12px; font-size: 17px; }
    .panel p, .manage-empty, .status { margin: 0 0 14px; color: #9aabd9; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 8px; color: #9aabd9; font-size: 13px; }
    .field input, .field textarea { width: 100%; padding: 13px 14px; border-radius: 16px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.05); color: #eef2ff; font: inherit; outline: none; }
    .field textarea { min-height: 100px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .session-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; background: rgba(255,255,255,0.05); color: #9aabd9; font-size: 13px; }
    .manage-list { display: grid; gap: 12px; }
    .manage-card { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 12px; padding: 12px; border-radius: 18px; border: 1px solid rgba(175,194,255,0.12); background: rgba(255,255,255,0.04); }
    .manage-card img { display: block; width: 74px; height: 74px; object-fit: cover; border-radius: 14px; background: rgba(255,255,255,0.04); }

    button { border: 0; border-radius: 999px; padding: 12px 16px; background: linear-gradient(135deg, #6da8ff, #f06090); color: #fff; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 12px 28px rgba(100,150,255,0.25); transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s; }
    button.secondary { background: rgba(255,255,255,0.06); color: #eef2ff; border: 1px solid rgba(175,194,255,0.14); box-shadow: none; }
    button.small { padding: 9px 12px; font-size: 13px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    @media (max-width: 600px) {
      .card { width: 105px; }
      .column { gap: clamp(100px, 30vh, 200px); padding: 0 2px; }
      .plane-group svg { width: min(44vw, 160px); }
    }
    @media (min-width: 900px) {
      .card { width: 140px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="stars" aria-hidden="true"></div>
    <div class="camera" id="camera">
      <div class="track" id="track">
        <div class="column" data-col="0"><div class="card floating" data-slot="0"></div><div class="card floating" data-slot="1"></div></div>
        <div class="column" data-col="1"><div class="card floating" data-slot="2"></div><div class="card floating" data-slot="3"></div></div>
        <div class="column" data-col="2"><div class="card floating" data-slot="4"></div><div class="card floating" data-slot="5"></div></div>
      </div>
    </div>

    <div class="plane-layer" aria-hidden="true">
      <div class="plane-trail"></div>
      <div class="plane-group" id="planeGroup">
        <svg viewBox="0 0 200 100">
          <defs>
            <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="80%">
              <stop offset="0%" stop-color="#ffffff"></stop><stop offset="25%" stop-color="#eaf2ff"></stop>
              <stop offset="55%" stop-color="#a8ccff"></stop><stop offset="100%" stop-color="#5090ee"></stop>
            </linearGradient>
            <filter id="pGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path filter="url(#pGlow)" fill="url(#pGrad)" stroke="rgba(255,255,255,0.55)" stroke-width="0.7" d="M22 50 170 20 116 46 170 80 100 60 76 86 82 53 22 50Z"/>
          <path d="M116 46 170 20 144 38 116 46Z" fill="rgba(255,255,255,0.6)"/>
          <path d="M100 60 170 80 144 68 100 60Z" fill="rgba(30,55,110,0.35)"/>
          <line x1="22" y1="50" x2="108" y2="52" stroke="rgba(255,255,255,0.45)" stroke-width="0.7"/>
          <ellipse cx="26" cy="50" rx="5" ry="3.5" fill="rgba(255,255,255,0.8)"/>
        </svg>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="swipe-dots" id="swipeDots"></div>
  </main>

  <button class="splash" id="splash" type="button">
    <span class="splash-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </span>
    <span class="splash-text">轻触开启</span>
  </button>
  <button class="secondary small music-toggle" id="musicToggle" type="button" hidden>播放音乐</button>

  <div class="overlay" id="lightbox">
    <figure><img id="lightboxImage" alt=""><figcaption id="lightboxCaption"></figcaption></figure>
  </div>

  <aside class="editor" id="editorPanel" aria-hidden="true">
    <div class="editor-head"><h2>编辑</h2><button class="secondary" id="closeEditor" type="button">关闭</button></div>
    <section class="panel">
      <h3>管理员登录</h3>
      <div class="session-line"><span id="sessionText">未登录</span><button class="secondary small" id="signOutBtn" type="button" hidden>退出</button><button class="secondary small" id="diagBtn" type="button" hidden>诊断</button></div>
      <form id="loginForm">
        <div class="field"><label for="emailInput">邮箱</label><input id="emailInput" type="email" autocomplete="username"></div>
        <div class="field"><label for="passwordInput">密码</label><input id="passwordInput" type="password" autocomplete="current-password"></div>
        <div class="row"><button id="signInBtn" type="submit">登录</button></div>
      </form>
      <div class="status" id="authStatus"></div>
    </section>
    <section class="panel">
      <h3>背景音乐</h3>
      <div class="field"><label for="musicInput">音频直链（或直接上传）</label><input id="musicInput" type="url" placeholder="https://example.com/music.mp3"></div>
      <div class="field"><label for="musicUpload">上传音乐文件</label><input id="musicUpload" type="file" accept="audio/*"></div>
      <div class="row"><button id="uploadMusicBtn" type="button">上传到云端</button><button id="saveSettingsBtn" type="button">保存</button></div>
      <div class="status" id="settingsStatus"></div>
    </section>
    <section class="panel">
      <h3>上传图片</h3>
      <p>图片会自动优化压缩，上传快速且放大清晰。</p>
      <div class="field"><label for="uploadInput">选择图片</label><input id="uploadInput" type="file" accept="image/*" multiple></div>
      <div class="field"><label for="captionsInput">每行一句话，按图片顺序对应</label><textarea id="captionsInput" placeholder="第一张图的一句话&#10;第二张图的一句话"></textarea></div>
      <div class="row"><button id="uploadBtn" type="button">上传到云端</button></div>
      <div class="status" id="uploadStatus"></div>
    </section>
    <section class="panel">
      <h3>图片管理</h3>
      <button class="secondary small" id="cleanupBtn" type="button" hidden>重试清理</button>
      <div class="manage-list" id="manageList"></div>
      <div class="manage-empty" id="manageEmpty">还没有图片。</div>
      <div class="status" id="manageStatus"></div>
    </section>
  </aside>

  <script type="module">
    const CONFIG = {
      SUPABASE_URL: "https://pnzbcsnoqrmtdkxyxfms.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_BZMrBawoq266rDTBEcIXRQ_yCrQPJ8C",
      ALBUM_SLUG: "main", IMAGES_BUCKET: "wall-images",
      MAX_UPLOAD_EDGE: 2048, TARGET_UPLOAD_BYTES: 600 * 1024,
      MAX_UPLOAD_QUALITY: 0.92, MIN_UPLOAD_QUALITY: 0.7,
      USE_IMAGE_TRANSFORMS: false,
      WALL_IMAGE_WIDTH: 200, WALL_IMAGE_HEIGHT: 260, WALL_IMAGE_QUALITY: 55,
      LIGHTBOX_IMAGE_WIDTH: 1280, LIGHTBOX_IMAGE_QUALITY: 82,
    };

    const CYCLE_INTERVAL = 2000;

    const stage = document.getElementById("stage");
    const camera = document.getElementById("camera");
    const track = document.getElementById("track");
    const planeGroup = document.getElementById("planeGroup");
    const toast = document.getElementById("toast");
    const swipeDots = document.getElementById("swipeDots");
    const splash = document.getElementById("splash");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const editorPanel = document.getElementById("editorPanel");
    const closeEditor = document.getElementById("closeEditor");
    const sessionText = document.getElementById("sessionText");
    const diagBtn = document.getElementById("diagBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authStatus = document.getElementById("authStatus");
    const musicInput = document.getElementById("musicInput");
    const musicUpload = document.getElementById("musicUpload");
    const uploadMusicBtn = document.getElementById("uploadMusicBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const musicToggle = document.getElementById("musicToggle");
    const settingsStatus = document.getElementById("settingsStatus");
    const uploadInput = document.getElementById("uploadInput");
    const captionsInput = document.getElementById("captionsInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const manageList = document.getElementById("manageList");
    const manageEmpty = document.getElementById("manageEmpty");
    const manageStatus = document.getElementById("manageStatus");
    const cleanupBtn = document.getElementById("cleanupBtn");

    function safeUUID() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    let supabase, currentSession, currentImages = [], audioElement;
    let isAdmin = false, albumBusy = false;
    let splashDone = false, musicWanted = false;
    let authRefresh = 0, wallReadVersion = 0, cameraStarted = false;
    let musicConfigVersion = 0, savingMusic = false;
    let windowStart = 0, cycleTimer = null, resumeTimer = null;
    let tapCount = 0, tapTimer = null, pendingLightboxTimeout = 0, longPressTimer = 0;
    let swipeX0 = 0, swipeY0 = 0, swipeActive = false;
    let userActive = false, lightboxOpen = false;

    // Card elements in order: [col0-top, col0-bot, col1-top, col1-bot, col2-top, col2-bot]
    const cardSlots = Array.from(track.querySelectorAll(".card[data-slot]"));

    bindUi();
    updateAuthUi();
    syncMusic(readCachedMusic());
    init();

    async function init() {
      let timeout;
      try {
        const { createClient } = await Promise.race([
          import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm"),
          new Promise((_, reject) => { timeout = setTimeout(reject, 12000); }),
        ]);
        supabase = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        await Promise.all([refreshSession(), loadSettings(), loadWall()]);
        if (isAdmin) retryCleanup();
      } catch {
        const msg = "照片墙连接失败，请检查网络后刷新页面。";
        setAuthStatus(msg);
        showToast(msg, true);
      } finally {
        clearTimeout(timeout);
      }
    }

    function bindUi() {
      closeEditor.addEventListener("click", closeEditorPanel);
      lightbox.addEventListener("click", closeLightbox);
      musicToggle.addEventListener("click", toggleMusicPlayback);
      track.addEventListener("click", onTrackClick);
      camera.addEventListener("touchstart", onSwipeStart, { passive: true });
      camera.addEventListener("touchmove", onSwipeMove, { passive: true });
      camera.addEventListener("touchend", onSwipeEnd, { passive: true });
      stage.addEventListener("pointerup", onStageTap, { passive: true });
      stage.addEventListener("pointerdown", onStagePressStart, { passive: true });
      stage.addEventListener("pointermove", onStagePressEnd, { passive: true });
      stage.addEventListener("pointercancel", onStagePressEnd, { passive: true });
      stage.addEventListener("pointerleave", onStagePressEnd, { passive: true });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { closeEditorPanel(); closeLightbox(); }
        if (e.key === "ArrowLeft") manualCycle(-1);
        if (e.key === "ArrowRight") manualCycle(1);
      });
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!supabase) { setAuthStatus("云端尚未连接，请稍后重试或刷新页面。"); return; }
        setAuthStatus("正在登录...");
        const { error } = await supabase.auth.signInWithPassword({ email: emailInput.value.trim(), password: passwordInput.value });
        if (error) { setAuthStatus(`登录失败：${error.message}`); return; }
        passwordInput.value = "";
        await refreshSession();
        if (isAdmin) retryCleanup();
      });
      diagBtn.addEventListener("click", runDiagnostic);
      signOutBtn.addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();
        if (error) { setAuthStatus(`退出失败：${error.message}`); return; }
        authRefresh++;
        currentSession = null;
        isAdmin = false;
        updateAuthUi();
        setAuthStatus("已退出登录。");
      });
      saveSettingsBtn.addEventListener("click", saveSettings);
      uploadBtn.addEventListener("click", uploadImages);
      uploadMusicBtn.addEventListener("click", uploadMusic);
      cleanupBtn.addEventListener("click", retryCleanup);
      splash.addEventListener("click", () => {
        splashDone = true;
        musicWanted = true;
        splash.classList.add("hide");
        setTimeout(() => splash.remove(), 600);
        playMusic();
      }, { once: true });
    }

    function onSwipeStart(e) {
      if (editorPanel.classList.contains("open")) return;
      markUserActive();
      swipeX0 = e.touches[0].clientX; swipeY0 = e.touches[0].clientY; swipeActive = false;
    }
    function onSwipeMove(e) {
      if (!swipeX0) return;
      markUserActive();
      const dx = e.touches[0].clientX - swipeX0, dy = e.touches[0].clientY - swipeY0;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) swipeActive = true;
    }
    function onSwipeEnd(e) {
      markUserActive();
      if (!swipeActive || !swipeX0) { swipeX0 = 0; return; }
      const dx = (e.changedTouches[0]?.clientX || 0) - swipeX0; swipeX0 = 0;
      if (Math.abs(dx) > 40) manualCycle(dx < 0 ? 1 : -1);
    }

    function onTrackClick(e) {
      const card = e.target.closest(".card");
      if (!card) return;
      const idx = parseInt(card.dataset.img);
      if (!isNaN(idx) && currentImages[idx]) scheduleLightboxOpen(currentImages[idx], idx);
    }

    // ── Photo index helpers ──
    function photoIdx(slot) {
      if (currentImages.length === 0) return -1;
      return (windowStart + slot) % currentImages.length;
    }

    function fillAllCards() {
      const seen = new Set();
      cardSlots.forEach((card, slot) => {
        const idx = photoIdx(slot);
        if (idx >= 0 && currentImages[idx] && !seen.has(idx)) {
          seen.add(idx);
          fillCardContent(card, slot);
        } else {
          card.style.visibility = "hidden";
        }
      });
      highlightMiddleColumn();
    }

    // ── Cycling ──
    function preloadImage(url) {
      if (!url) return;
      const p = new Image(); p.src = url;
    }

    let cancelCycle = null;

    function manualCycle(dir) {
      if (currentImages.length < 2 || cancelCycle) return;
      const nextStart = (windowStart + dir * 2 + currentImages.length) % currentImages.length;
      for (let s = 0; s < 6; s++) {
        const idx = (nextStart + s) % currentImages.length;
        preloadImage(currentImages[idx].wallUrl || currentImages[idx].originalUrl);
      }

      const direction = dir > 0 ? "scroll-left" : "scroll-right";
      let timeout;
      function settle(advance) {
        clearTimeout(timeout);
        track.removeEventListener("transitionend", onTransition);
        track.removeEventListener("transitioncancel", onTransition);
        track.style.transition = "none";
        track.classList.remove(direction);
        if (advance) {
          windowStart = nextStart;
          fillAllCards();
          updateDots();
        }
        track.offsetHeight;
        track.style.transition = "";
        cancelCycle = null;
      }
      function onTransition(event) {
        if (event.target === track && event.propertyName === "transform") settle(true);
      }
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        settle(true);
        return;
      }
      cancelCycle = () => settle(false);
      track.addEventListener("transitionend", onTransition);
      track.addEventListener("transitioncancel", onTransition);
      track.classList.add(direction);
      timeout = setTimeout(() => settle(true), 650);
    }

    function fillCardContent(card, slot) {
      const idx = photoIdx(slot);
      if (idx < 0 || !currentImages[idx]) {
        card.style.visibility = "hidden";
        return;
      }
      card.style.visibility = "";
      card.dataset.img = String(idx);
      card.style.setProperty("--fd", `${5.5 + (idx % 5) * 0.7}s`);
      card.style.setProperty("--fdl", `${(idx % 7) * 0.6}s`);

      // Ensure structure: .img-wrap > img, then .caption
      let wrap = card.querySelector(".img-wrap");
      if (!wrap) { wrap = document.createElement("div"); wrap.className = "img-wrap"; card.appendChild(wrap); }
      let img = wrap.querySelector("img");
      if (!img) { img = document.createElement("img"); wrap.appendChild(img); }
      img.alt = currentImages[idx].caption || "";
      img.decoding = "async";
      const src = currentImages[idx].wallUrl || currentImages[idx].originalUrl;
      if (img.src !== src) {
        img.src = src;
        img.addEventListener("load", () => card.classList.add("loaded"), { once: true });
      }

      let cap = card.querySelector(".caption");
      if (!cap) { cap = document.createElement("div"); cap.className = "caption"; card.appendChild(cap); }
      cap.textContent = currentImages[idx].caption || "";
    }

    // ── Highlight middle column (plane hovers there) ──
    function highlightMiddleColumn() {
      cardSlots.forEach(c => c.classList.remove("highlighted"));
      // Middle column = slots 2,3
      [cardSlots[2], cardSlots[3]].forEach(c => {
        if (c.style.visibility !== "hidden") c.classList.add("highlighted");
      });
    }

    function updateDots() {
      if (currentImages.length === 0) { swipeDots.innerHTML = ""; return; }
      const pages = Math.ceil(currentImages.length / 2);
      swipeDots.innerHTML = "";
      const curPage = Math.floor(windowStart / 2) % pages;
      for (let i = 0; i < pages; i++) {
        const d = document.createElement("span");
        d.className = "swipe-dot" + (i === curPage ? " active" : "");
        swipeDots.appendChild(d);
      }
    }

    // ── Auto cycle ──
    function startAutoCycle() {
      clearTimeout(cycleTimer);
      function tick() {
        cycleTimer = setTimeout(tick, CYCLE_INTERVAL);
        if (userActive || lightboxOpen || editorPanel.classList.contains("open")) return;
        manualCycle(1);
      }
      cycleTimer = setTimeout(tick, CYCLE_INTERVAL);
    }

    function pauseCycle() {
      userActive = true;
      clearTimeout(cycleTimer);
      clearTimeout(resumeTimer);
    }

    function resumeCycle() {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => {
        userActive = false;
        startAutoCycle();
      }, 1200);
    }

    function markUserActive() {
      pauseCycle();
      resumeCycle();
    }

    // ── Camera oscillation ──
    function startCameraOscillation() {
      const t0 = Date.now();
      const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      function loop() {
        const elapsed = (Date.now() - t0) / 1000;
        if (motion.matches) {
          camera.style.transform = "";
        } else {
          camera.style.transform = `translateX(${Math.sin(elapsed * 0.35) * 6}px)`;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    // ── Lightbox ──
    function scheduleLightboxOpen(image, index) {
      cancelPendingLightbox();
      pendingLightboxTimeout = setTimeout(() => {
        pendingLightboxTimeout = 0;
        if (!editorPanel.classList.contains("open")) openLightbox(image, index);
      }, 300);
    }
    function cancelPendingLightbox() { clearTimeout(pendingLightboxTimeout); pendingLightboxTimeout = 0; }
    function openLightbox(image, index) {
      lightboxOpen = true;
      lightboxImage.alt = image.caption || `图片 ${index + 1}`;
      lightboxCaption.textContent = image.caption || "";
      lightbox.classList.add("open");
      lightboxImage.src = image.wallUrl || image.originalUrl;
      if (image.fullUrl && image.fullUrl !== image.wallUrl) {
        const up = new Image();
        up.onload = () => { if (lightbox.classList.contains("open")) lightboxImage.src = image.fullUrl; };
        up.onerror = () => { if (image.originalUrl) lightboxImage.src = image.originalUrl; };
        up.src = image.fullUrl;
      }
    }
    function closeLightbox() { lightboxOpen = false; lightbox.classList.remove("open"); lightboxImage.src = ""; lightboxImage.alt = ""; lightboxCaption.textContent = ""; }

    // ── Editor ──
    function onStageTap(e) {
      onStagePressEnd();
      markUserActive();
      if (editorPanel.contains(e.target) || lightbox.contains(e.target)) return;
      tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(() => { tapCount = 0; }, 700);
      if (tapCount >= 3) { tapCount = 0; cancelPendingLightbox(); onStagePressEnd(); openEditorPanel(); }
    }
    function onStagePressStart(e) {
      markUserActive();
      if (editorPanel.contains(e.target) || lightbox.contains(e.target)) return;
      onStagePressEnd();
      longPressTimer = setTimeout(() => { longPressTimer = 0; tapCount = 0; cancelPendingLightbox(); openEditorPanel(); }, 650);
    }
    function onStagePressEnd() { clearTimeout(longPressTimer); longPressTimer = 0; }
    function openEditorPanel() {
      if (editorPanel.classList.contains("open")) return;
      editorPanel.classList.add("open");
      editorPanel.setAttribute("aria-hidden", "false");
      if (isAdmin) retryCleanup();
    }
    function closeEditorPanel() { editorPanel.classList.remove("open"); editorPanel.setAttribute("aria-hidden", "true"); }

    // ── Auth / Music ──
    async function refreshSession() {
      const request = ++authRefresh;
      const { data, error } = await supabase.auth.getSession();
      if (request !== authRefresh) return;
      if (error) { setAuthStatus(`会话读取失败：${error.message}`); return; }
      currentSession = data.session;
      isAdmin = false;
      updateAuthUi();
      if (!currentSession) return;
      const { data: allowed, error: permissionError } = await readWithTimeout(supabase.rpc("is_album_admin"));
      if (request !== authRefresh) return;
      isAdmin = allowed === true;
      updateAuthUi();
      setAuthStatus(permissionError ? `管理员权限检查失败：${permissionError.message}`
        : isAdmin ? "已登录管理员账号。" : "当前账号未获管理员授权。");
    }
    function updateAuthUi() {
      const signedIn = Boolean(currentSession?.user);
      sessionText.textContent = signedIn ? `当前账号：${currentSession.user.email}` : "未登录";
      signOutBtn.hidden = !signedIn; diagBtn.hidden = !isAdmin; loginForm.hidden = signedIn;
      saveSettingsBtn.disabled = !isAdmin || savingMusic;
      uploadInput.disabled = !isAdmin; captionsInput.disabled = !isAdmin;
      uploadMusicBtn.disabled = !isAdmin; musicUpload.disabled = !isAdmin;
      cleanupBtn.hidden = !isAdmin;
      setAlbumBusy(albumBusy);
      renderManageList();
    }

    async function readWithTimeout(query) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      try { return await query.abortSignal(controller.signal); }
      finally { clearTimeout(timeout); }
    }

    function readCachedMusic() {
      try { return localStorage.getItem("nfc_wall_music") || ""; }
      catch { return ""; }
    }

    function cacheMusic(url) {
      try { localStorage.setItem("nfc_wall_music", url); } catch {}
    }

    async function loadSettings() {
      const version = musicConfigVersion;
      try {
        const { data, error } = await readWithTimeout(
          supabase.from("album_settings").select("music_url").eq("slug", CONFIG.ALBUM_SLUG).maybeSingle()
        );
        if (version !== musicConfigVersion) return;
        if (error) throw error;
        const url = data?.music_url || "";
        syncMusic(url);
        cacheMusic(url);
      } catch (error) {
        if (version === musicConfigVersion) setSettingsStatus(`读取设置失败：${error.message}`);
      }
    }

    function syncMusic(url) {
      musicInput.value = url;
      if (!audioElement) {
        audioElement = document.createElement("audio");
        audioElement.loop = true;
        audioElement.preload = "auto";
        audioElement.addEventListener("playing", updateMusicToggle);
        audioElement.addEventListener("pause", updateMusicToggle);
        audioElement.addEventListener("error", updateMusicToggle);
        document.body.appendChild(audioElement);
      }
      musicToggle.hidden = !url;
      if (url === (audioElement.getAttribute("src") || "")) return;
      audioElement.pause();
      if (url) {
        audioElement.src = url;
        if (splashDone && musicWanted) playMusic();
      } else {
        audioElement.removeAttribute("src");
        audioElement.load();
      }
      updateMusicToggle();
    }

    function updateMusicToggle() {
      musicToggle.textContent = audioElement.paused || audioElement.error ? "播放音乐" : "暂停音乐";
    }

    async function playMusic(showError = false) {
      if (!audioElement?.hasAttribute("src")) return;
      try {
        audioElement.muted = false;
        await audioElement.play();
      } catch (error) {
        if (showError && error.name !== "AbortError") showToast("音乐无法播放，请检查音频链接或网络。");
      } finally {
        updateMusicToggle();
      }
    }

    function toggleMusicPlayback() {
      musicWanted = audioElement.paused || Boolean(audioElement.error);
      if (musicWanted) playMusic(true);
      else audioElement.pause();
    }

    async function saveSettings() {
      if (!isAdmin || savingMusic) return;
      const url = musicInput.value.trim();
      musicConfigVersion++;
      savingMusic = true;
      saveSettingsBtn.disabled = true;
      setSettingsStatus("保存中...");
      try {
        const { error } = await supabase.from("album_settings").upsert({ slug: CONFIG.ALBUM_SLUG, music_url: url }, { onConflict: "slug" });
        if (error) throw error;
        cacheMusic(url);
        syncMusic(url);
        setSettingsStatus("已保存。"); showToast("音乐链接已保存");
      } catch (error) {
        setSettingsStatus(`保存失败：${error.message}`);
      } finally {
        savingMusic = false;
        saveSettingsBtn.disabled = !isAdmin;
      }
    }

    // ── Wall ──
    let toastTimer;
    function showToast(msg, persistent = false) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      if (!persistent) toastTimer = setTimeout(clearToast, 8000);
    }
    function clearToast() { clearTimeout(toastTimer); toast.textContent = ""; }

    async function loadWall() {
      const request = ++wallReadVersion;
      clearToast();
      try {
        const { data, error } = await readWithTimeout(supabase.from("album_images")
          .select("id, title, file_path, sort_order, created_at")
          .eq("album_slug", CONFIG.ALBUM_SLUG).order("sort_order").order("created_at").order("id"));
        if (request !== wallReadVersion) return;
        if (error) {
          const msg = `无法加载相册：${error.message}\n请检查网络及 Supabase 部署配置后刷新页面。`;
          setManageStatus(msg); showToast(msg, true); return;
        }
        if (!data || data.length === 0) {
          showToast("相册为空，请登录后上传照片");
        }
        cancelCycle?.();
        currentImages = (data || []).map(item => {
          const ou = getPublicUrl(item.file_path);
          return { ...item, caption: item.title || "", originalUrl: ou,
            wallUrl: getWallUrl(item.file_path, ou), fullUrl: getFullUrl(item.file_path, ou) };
        });
        windowStart = 0;
        clearTimeout(cycleTimer);
        resetAllCards();
        fillAllCards();
        updateDots();
        renderManageList();
        if (currentImages.length > 0) {
          startAutoCycle();
          if (!cameraStarted) {
            cameraStarted = true;
            startCameraOscillation();
          }
        }
      } catch(e) {
        if (request === wallReadVersion) showToast(`加载相册异常：${e.message}。请刷新页面重试。`, true);
      }
    }

    function resetAllCards() {
      cardSlots.forEach(c => {
        c.classList.remove("highlighted", "loaded");
        c.classList.add("floating");
        c.style.visibility = "";
        const img = c.querySelector("img");
        if (img) { img.src = ""; img.alt = ""; }
        const cap = c.querySelector(".caption");
        if (cap) cap.textContent = "";
      });
    }

    function getWallUrl(fp, fb) { return CONFIG.USE_IMAGE_TRANSFORMS ? getPublicUrl(fp, { transform: { width: CONFIG.WALL_IMAGE_WIDTH, height: CONFIG.WALL_IMAGE_HEIGHT, quality: CONFIG.WALL_IMAGE_QUALITY, resize: "cover" } }) : fb; }
    function getFullUrl(fp, fb) { return CONFIG.USE_IMAGE_TRANSFORMS ? getPublicUrl(fp, { transform: { width: CONFIG.LIGHTBOX_IMAGE_WIDTH, quality: CONFIG.LIGHTBOX_IMAGE_QUALITY, resize: "contain" } }) : fb; }
    function getPublicUrl(fp, opts) { const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(fp, opts); return data.publicUrl; }

    // ── Music upload ──
    async function uploadMusic() {
      if (!isAdmin) { setSettingsStatus("请先登录管理员账号"); return; }
      const file = musicUpload.files[0];
      if (!file) { setSettingsStatus("先选择音乐文件"); return; }
      if (file.size > 20 * 1024 * 1024) { setSettingsStatus("文件不能超过 20MB"); return; }
      setSettingsStatus("正在上传音乐...");
      const fp = `${CONFIG.ALBUM_SLUG}/music-${Date.now()}-${sanitizeFileName(file.name)}`;
      const up = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(fp, file, { cacheControl: "31536000", upsert: false });
      if (up.error) { setSettingsStatus(up.error.message); return; }
      const { data } = supabase.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(fp);
      musicInput.value = data.publicUrl;
      musicUpload.value = "";
      setSettingsStatus("音乐已上传，点保存生效。");
    }

    // ── Diagnostic ──
    async function runDiagnostic() {
      if (!isAdmin) return;
      setUploadStatus("正在检测数据库和存储桶...");
      try {
        const [db, storage] = await Promise.all([
          readWithTimeout(supabase.from("album_settings").select("slug").limit(1)),
          supabase.storage.from(CONFIG.IMAGES_BUCKET).list(CONFIG.ALBUM_SLUG, { limit: 1 }),
        ]);
        setUploadStatus([
          db.error ? `数据库访问失败：${db.error.message}` : "数据库可读取",
          storage.error ? `存储桶访问失败：${storage.error.message}` : "存储桶可读取",
        ].join("\n"));
      } catch (error) {
        setUploadStatus(`诊断失败：${error.message}`);
      }
    }

    // ── Image Compression ──
    async function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          try {
            let { width, height } = img;
            const maxEdge = CONFIG.MAX_UPLOAD_EDGE;
            if (width > maxEdge || height > maxEdge) {
              const ratio = Math.min(maxEdge / width, maxEdge / height);
              width = Math.max(1, Math.round(width * ratio));
              height = Math.max(1, Math.round(height * ratio));
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            if (canvas.toBlob) {
              canvas.toBlob(blob => resolve(blob || file), "image/jpeg", CONFIG.MAX_UPLOAD_QUALITY);
            } else {
              const dataUrl = canvas.toDataURL("image/jpeg", CONFIG.MAX_UPLOAD_QUALITY);
              fetch(dataUrl).then(r => r.blob()).then(b => resolve(b || file)).catch(() => resolve(file));
            }
          } catch (error) {
            reject(error);
          } finally {
            URL.revokeObjectURL(url);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(file);
        };
        img.src = url;
      });
    }

    async function uploadImages() {
      await withAlbumWrite(async () => {
        const files = Array.from(uploadInput.files || []).filter(file => file.type.startsWith("image/"));
        if (!files.length) {
          setUploadStatus("请先选择图片。");
          return;
        }
        const captions = captionsInput.value.split(/\r?\n/).map(line => line.trim());
        const batch = safeUUID();
        const entries = files.map((file, index) => ({
          name: `${index}-${sanitizeFileName(file.name).slice(-180)}`,
          title: captions[index] || "",
        }));
        setUploadStatus("正在准备上传...");
        try {
          await albumRpc("begin_album_upload", { p_batch: batch, p_files: entries });
          for (const [index, file] of files.entries()) {
            setUploadStatus(`压缩上传 ${index + 1}/${files.length}...`);
            const compressed = await compressImage(file);
            const path = `${CONFIG.ALBUM_SLUG}/photos/${batch}/${entries[index].name}`;
            const { error } = await supabase.storage.from(CONFIG.IMAGES_BUCKET).upload(path, compressed, {
              cacheControl: "31536000", upsert: false,
            });
            if (error) throw error;
          }
          setUploadStatus("正在发布照片...");
          await albumRpc("finish_album_upload", { p_batch: batch, p_publish: true });
        } catch (error) {
          let result;
          try {
            result = await albumRpc("finish_album_upload", { p_batch: batch, p_publish: false });
            if (result !== "ready") await cleanupQueuedPhotos();
          } catch (cleanupError) {
            setManageStatus(`云端清理待重试：${cleanupError.message}`);
          }
          if (result !== "ready") {
            setUploadStatus(result
              ? `上传失败，照片未发布：${error.message}`
              : `无法确认上传结果，请刷新相册确认后再上传：${error.message}`);
            await loadWall();
            return;
          }
        }
        uploadInput.value = ""; captionsInput.value = "";
        await loadWall();
        setUploadStatus(`已上传 ${files.length} 张图片。`);
      }, setUploadStatus);
    }
    function sanitizeFileName(n) { return n.replace(/[^a-zA-Z0-9._-]/g,"-"); }

    // ── Manage ──
    function renderManageList() {
      manageList.innerHTML = "";
      if (!isAdmin) { manageEmpty.hidden=false; manageEmpty.textContent="请先登录管理员账号"; return; }
      if (!currentImages.length) { manageEmpty.hidden=false; manageEmpty.textContent="还没有图片。"; return; }
      manageEmpty.hidden=true;
      currentImages.forEach((img,i)=>{
        const card=document.createElement("article"); card.className="manage-card";
        const pv=document.createElement("img"); pv.src=img.wallUrl; pv.alt=img.caption||`图片 ${i+1}`; pv.loading="lazy";
        pv.onerror=()=>{ if(pv.src!==img.originalUrl) pv.src=img.originalUrl; };
        const right=document.createElement("div");
        const fld=document.createElement("div"); fld.className="field";
        fld.innerHTML=`<label>图片 ${i+1} 的一句话</label>`;
        const inp=document.createElement("textarea"); inp.value=img.caption||""; inp.maxLength=120; inp.rows=3; fld.appendChild(inp);
        const row=document.createElement("div"); row.className="row";
        const sb=document.createElement("button"); sb.className="secondary small"; sb.type="button"; sb.textContent="保存句子";
        sb.addEventListener("click",async()=>{await updateImage(img.id,{title:inp.value.trim()},"已保存");});
        const ub=document.createElement("button"); ub.className="secondary small"; ub.type="button"; ub.textContent="前移"; ub.disabled=i===0;
        ub.addEventListener("click", () => moveImage(img.id, currentImages[i-1]?.id, -1));
        const db=document.createElement("button"); db.className="secondary small"; db.type="button"; db.textContent="后移"; db.disabled=i===currentImages.length-1;
        db.addEventListener("click", () => moveImage(img.id, currentImages[i+1]?.id, 1));
        const del=document.createElement("button"); del.className="small"; del.type="button"; del.textContent="删除";
        del.addEventListener("click",async()=>{await deleteImage(img);});
        row.append(sb,ub,db,del); right.append(fld,row); card.append(pv,right); manageList.appendChild(card);
      });
    }
    function setAlbumBusy(busy) {
      albumBusy = busy;
      uploadBtn.disabled = busy || !isAdmin;
      uploadInput.disabled = busy || !isAdmin;
      captionsInput.disabled = busy || !isAdmin;
      cleanupBtn.disabled = busy || !isAdmin;
      manageList.inert = busy;
    }

    async function withAlbumWrite(action, setStatus = setManageStatus) {
      if (!isAdmin || albumBusy) return;
      setAlbumBusy(true);
      try { await action(); }
      catch (error) { setStatus(`操作未完成：${error.message}`); }
      finally { setAlbumBusy(false); }
    }

    async function albumRpc(name, params) {
      const { data, error } = await supabase.rpc(name, { p_album: CONFIG.ALBUM_SLUG, ...params });
      if (error) throw error;
      return data;
    }

    async function cleanupQueuedPhotos(photoId = null) {
      let processed = 0;
      while (true) {
        const jobs = await albumRpc("queue_album_cleanup", { p_id: photoId });
        if (!jobs.length) return processed;
        const { error } = await supabase.storage.from(CONFIG.IMAGES_BUCKET).remove(jobs.map(job => job.file_path));
        const done = await albumRpc("finish_album_cleanup", { p_ids: jobs.map(job => job.id) });
        if (!done) throw error || new Error("存储中的文件尚未清除，请点击「重试清理」。");
        processed += jobs.length;
      }
    }

    function retryCleanup() {
      return withAlbumWrite(async () => {
        const processed = await cleanupQueuedPhotos();
        if (processed) setManageStatus("已清理待删除文件。");
      });
    }

    function updateImage(id, patch, message) {
      return withAlbumWrite(async () => {
        setManageStatus("保存中...");
        const { data, error } = await supabase.from("album_images").update(patch).eq("id", id).select("id").maybeSingle();
        if (error) throw error;
        await loadWall();
        setManageStatus(data ? message : "照片已变更，请在刷新后的列表中重试。");
      });
    }

    function moveImage(id, neighbor, direction) {
      if (!neighbor) return;
      return withAlbumWrite(async () => {
        setManageStatus("调整中...");
        let moved;
        try {
          moved = await albumRpc("move_album_image", { p_id: id, p_neighbor: neighbor, p_direction: direction });
        } finally {
          await loadWall();
        }
        setManageStatus(moved ? "已更新顺序。" : "顺序已变更，请在刷新后的列表中重试。");
      });
    }

    function deleteImage(image) {
      if (!isAdmin || albumBusy || !window.confirm("确认删除？")) return;
      return withAlbumWrite(async () => {
        setManageStatus("删除中...");
        try {
          await cleanupQueuedPhotos(image.id);
        } finally {
          await loadWall();
        }
        setManageStatus("已删除。");
      });
    }

    function setAuthStatus(m){authStatus.textContent=m;}
    function setSettingsStatus(m){settingsStatus.textContent=m;}
    function setUploadStatus(m){uploadStatus.textContent=m;}
    function setManageStatus(m){manageStatus.textContent=m;}
  </script>
</body>
</html>
